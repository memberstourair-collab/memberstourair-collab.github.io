|Bote en la cueva de Gwangcheon|Almuerzo de tortitas de trigo sarraceno|Grupo de máx. 40","vi":"Đường mòn sinh thái Olympic|Đi thuyền hang Gwangcheon|Bữa trưa bánh kiều mạch|Nhóm tối đa 40 khách"},"tour.ad02.title":{"en":"Andong Hahoe Village & Folk Market Day Tour","ko":"안동 하회마을 & 전통시장 당일투어","zh":"安东河回村与传统市场一日游","ja":"安東河回村＆伝統市場日帰りツアー","ru":"Андон: деревня Хахве и народный рынок","es":"Andong: aldea Hahoe y mercado tradicional","vi":"Andong: làng Hahoe & chợ truyền thống"},"tour.ad02.desc":{"en":"A UNESCO-listed hanok village, a mask dance stage and the food stalls of Andong's old market.","ko":"유네스코 하회마을의 한옥 골목과 탈춤 공연, 안동 구시장 먹거리를 하루에 담았습니다.","zh":"一天走遍联合国教科文组织河回韩屋村、假面舞表演与安东老市场小吃。","ja":"世界遺産の河回韓屋村、仮面舞踊、安東の旧市場グルメを一日で。","ru":"Деревня ханок из списка ЮНЕСКО, театр масок и еда на старом рынке Андона.","es":"Aldea hanok de la UNESCO, danza de máscaras y puestos del mercado antiguo de Andong.","vi":"Làng hanok di sản UNESCO, múa mặt nạ và chợ cũ Andong trong một ngày."},"tour.ad02.hl":{"en":"UNESCO Hahoe hanok alleys|Traditional mask dance|Andong jjimdak lunch|Buyongdae cliff view","ko":"유네스코 하회 한옥 골목|전통 탈춤 공연|안동찜닭 중식|부용대 절경","zh":"河回韩屋胡同|传统假面舞|安东炖鸡午餐|芙蓉台绝景","ja":"河回韓屋の路地|伝統仮面舞踊|アンドンジムダク昼食|芙蓉台の絶景","ru":"Переулки ханок Хахве|Традиционный танец масок|Обед ччимдак|Скала Пурёндэ","es":"Callejones hanok de Hahoe|Danza de máscaras|Almuerzo jjimdak|Mirador Buyongdae","vi":"Ngõ hanok Hahoe|Múa mặt nạ truyền thống|Trưa gà hầm Andong|Vách đá Buyongdae"},"tour.gj03.title":{"en":"Gyeongju UNESCO & Pohang Space Walk 1N2D","ko":"경주 유네스코 & 포항 스페이스워크 1박2일","zh":"庆州UNESCO与浦项天空步道 2天1晚","ja":"慶州UNESCO＆浦項スカイウォーク 1泊2日","ru":"Кёнджу (ЮНЕСКО) и смотровая в Пховане, 2 дня","es":"Gyeongju UNESCO y Pohang Space Walk, 2 días","vi":"Gyeongju UNESCO & Pohang Space Walk 2 ngày 1 đêm"},"tour.gj03.desc":{"en":"Bulguksa and Seokguram at first light, a steel skywalk over the East Sea, and a night among royal tombs.","ko":"새벽 불국사와 석굴암, 동해를 내려다보는 포항 스페이스워크, 왕릉 야경까지 담은 1박 2일입니다.","zh":"清晨的佛国寺与石窟庵、俯瞰东海的浦项天 set yacht cruise, Suncheon Bay reed fields and the Dolsan cable car.","ko":"남해안 3일, 여수 선셋 요트와 순천만 갈대밭, 돌산 케이블카를 함께 즐깁니다.","zh":"南海岸三日：丽水日落游艇、顺天湾芦苇荡与突山缆车。","ja":"南海岸3日間。麗水サンセットヨット、順天湾の葦原、突山ケーブルカー。","ru":"Три дня на южном побережье: яхта на закате, тростники Сунчхон и канатка Тольсан.","es":"Tres días en la costa sur: yate al atardecer, juncos de Suncheon y teleférico de Dolsan.","vi":"Ba ngày bờ biển phía nam: du thuyền hoàng hôn, lau sậy Suncheon và cáp treo Dolsan."},"tour.ys06.hl":{"en":"Sunset yacht around Yeosu islands|Suncheon Bay reed field|Dolsan cable car ridge|Two nights by the sea","ko":"여수 섬 투어 선셋 요트|순천만 갈대밭|돌산 케이블카|바닷가 2박","zh":"丽水群岛日落游艇|顺天湾芦苇荡|突山缆车|海边连住两晚","ja":"麗水の島めぐりサンセットヨット|順天湾の葦原|突山ケーブルカー|海辺に2泊","ru":"Яхта на закате вокруг островов Йосу|Тростники Сунчхона|Канатка Тольсан|Две ночи у моря","es":"Yate al atardecer por las islas|Juncos de Suncheon|Teleférico de Dolsan|Dos noches junto al mar","vi":"Du thuyền hoàng hôn quanh đảo Yeosu|Lau sậy Suncheon|Cáp treo Dolsan|Hai đêm bên biển"},"tour.je07.title":{"en":"Jeju Hallasan & Olle Trail 2N3D Flight Package","ko":"제주 한라산 & 올레길 2박3일 항공 패키지","zh":"济州汉拿山与偶来小路 3天2晚机票套餐","ja":"済州ハルラサン＆オルレ 2泊3日航空パック","ru":"Чеджу: Халласан и тропа Олле, 3 дня с перелётом","es":"Jeju: Hallasan y Olle, 3 días con vuelo","vi":"Jeju: Hallasan & đường Olle 3 ngày 2 đêm gồm vé bay"},"tour.je07.desc":{"en":"Fly to Jeju for a crater hike, a volcanic coastal walk and sunrise over Seongsan Ilchulbong.","ko":"제주로 떠나 한라산 분화구 트레킹, 화산 해안 올레길, 성산일출봉 일출을 만납니다.","zh":"飞往济州，登汉拿山火山口、走火山海岸偶来小路、看城山日出峰日出。","ja":"済州へ。ハルラサンの火口トレッキング、火山海岸のオルレ、城山日出峰の日の出。","ru":"Перелёт на Чеджу: кратер Халласан, вулканическое побережье Олле и рассвет на Сонсан-Ильчхульбон.","es":"Vuela a Jeju: cráter de Hallasan, costa volcánica de Olle y amanecer en Seongsan Ilchulbong.","vi":"Bay đến Jeju: leo miệng núi lửa Hallasan, đường Olle ven biển và bình minh Seongsan."},"tour.je07.hl":{"en":"Hallasan crater hike with a local guide|Olle trail along the volcanic coast|Seongsan Ilchulbong sunrise|Resort with ocean view","ko":"현지 가이드와 한라산 분화구 트레킹|화산 해안 올레길|성산일출봉 일출|오션뷰 리조트","zh":"当地向导带队登汉拿山|火山海岸偶来小路|城山日出峰日出|海景度假村","ja":"現地ガイドとハルラサン火口トレッキング|火山海岸のオルレ|城山日出峰の日の出|オーシャンビューリゾート","ru":"Треккинг к кратеру Халласан с гидом|Тропа Олле по вулканическому берегу|Рассвет на Сонсан|Курорт с видом на море","es":"Cráter de Hallasan con guía local|Costa volcánica de Olle|Amanecer en Seongsan|Resort con vistas al mar","vi":"Leo núi Hallasan cùng HDV địa phương|Đường Olle ven biển|Bình minh Seongsan|Resort view biển"},"tour.ul08.title":{"en":"Ulleungdo & Dokdo Cruise 2N3D","ko":"울릉도·독도 크루즈 2박3일","zh":"郁陵岛·独岛游船 3天2晚","ja":"鬱陵島・独島クルーズ 2泊3日","ru":"Уллындо и Токто: круиз, 3 дня","es":"Ulleungdo y Dokdo en crucero, 3 días","vi":"Ulleungdo & Dokdo 3 ngày 2 đêm"},"tour.ul08.desc":{"en":"A three-hour ferry to a volcanic island, a Dokdo landing when the sea allows, and quiet coastal trails.","ko":"3시간 여객선으로 떠나는 화산섬, 날씨가 허락하면 독도 상륙, 한적한 해안 산책로를 걷습니다.","zh":"乘三小时渡轮前往火山岛，海况允许时登独岛，漫步宁静海岸步道。","ja":"3時間のフェリーで火山島へ。海況が許せば独島上陸、静かな海岸遊歩道。","ru":"Трёхчасовой паром на вулканический остров, высадка на Токто при хорошей погоде и тихие тропы.","es":"Tres horas de ferri a una isla volcánica, desembarco en Dokdo si el mar lo permite y senderos tranquilos.","vi":"Ba giờ phà đến đảo núi lửa, lên đảo Dokdo nếu biển lặng và những lối ven biển yên bình."},"tour.ul08.hl":{"en":"Three-hour ferry across the East Sea|Dokdo landing (weather permitting)|Elephant Rock coastal trail|Fresh squid dinner","ko":"동해 3시간 여객선|독도 상륙 (기상 허락 시)|코끼리바위 해안 산책로|생오징어 회 저녁","zh":"横渡东海三小时渡轮|登独岛（视天气）|象岩海岸步道|新鲜鱿鱼晚餐","ja":"東海3時間フェリー|独島上陸（天候次第）|象岩の海岸遊歩道|新鮮イカの夕食","ru":"Трёхчасовой паром через Восточное море|Высадка на Токто (по погоде)|Тропа у скалы Слон|Ужин из свежего кальмара","es":"Ferri de tres horas por el mar del Este|Desembarco en Dokdo (según el tiempo)|Senda de Elephant Rock|Cena de calamar fresco","vi":"Phà ba giờ qua Biển Đông|Lên đảo Dokdo (tùy thời tiết)|Đường ven biển Đá Voi|Tối mực tươi"},"tour.gf09.title": ":"Паломничество по святыням Кореи, 3 дня","es":"Peregrinación católica y budista por Corea, 3 días","vi":"Hành hương Công giáo & Phật giáo Hàn Quốc 3 ngày 2 đêm"},"tour.pg10.desc":{"en":"Walk the martyr sites of Seoul and Chungcheong with a Catholic historian, then the Buddhist temples of Gyeongju — a quiet route through Korea's 200-year Catholic history.","ko":"서소문·절두산·솔뫼성지·해미읍성을 가톨릭 해설 가이드와 함께 순례하고, 경주 불국사·석굴암에서 불교 성지를 둘러보는 조용한 2박 3일 일정입니다.","zh":"由天主教历史向导陪同，走访西小门、切头山、松梅圣地与海美邑城，再到庆州佛国寺与石窟庵，静心感受韩国两百年的信仰之路。","ja":"カトリック史家ガイドと西小門・切頭山・松梅聖地・海美邑城を巡礼し、慶州の仏国寺・石窟庵へ。韓国の二百年の信仰の道を静かにたどります。","ru":"С молитвенными остановками в Сосомуне, Чольтусане и Солмэ, затем буддийские храмы Кёнджу — тихий маршрут по 200-летней истории веры в Корее.","es":"Peregrinación por Seosomun, Jeoldusan, Solmoe y Haemi con un guía historiador, y después los templos budistas de Gyeongju: un recorrido sereno por 200 años de fe.","vi":"Hành hương Seosomun · Jeoldusan · Solmoe · thành Haemi cùng HDV sử học Công giáo, rồi chùa Phật giáo Gyeongju — hành trình tĩnh lặng 200 năm đức tin."},"tour.pg10.hl":{"en":"Seosomun, Jeoldusan and Solmoe shrines|Haemi Fortress & the Catholic martyr road|Bulguksa and Seokguram with a temple guide|Mass and quiet reflection each day","ko":"서소문·절두산·솔뫼 성지|해미읍성·천주교 순교의 길|불국사·석굴암 사찰 해설|매일 미사·묵상 시간","zh":"西小门·切头山·松梅圣地|海美邑城与殉教之路|佛国寺·石窟庵寺院讲解|每日弥撒与默想时间","ja":"西小門・切頭山・松梅聖地|海美邑城と殉教の道|仏国寺・石窟庵の寺院解説|毎日のミサと黙想","ru":"Святыни Сосомун, Чольтусан и Солмэ|Крепость Хэми и путь мучеников|Пульгукса и Соккурам с гидом|Ежедневная месса и время тишины","es":"Santuarios de Seosomun, Jeoldusan y Solmoe|Fortaleza de Haemi y ruta de los mártires|Bulguksa y Seokguram con guía de templo|Misa y reflexión cada día","vi":"Thánh địa Seosomun · Jeoldusan · Solmoe|Thành Haemi & đường tử đạo|Bulguksa & Seokguram có HDV chùa|Thánh lễ & tĩnh tâm mỗi ngày"},"tour.pg10.itin":{"en":"Seoul: Seosomun shrine, Jeoldusan & Mass|Solmoe shrine and Haemi Fortress|Bulguksa & Seokguram, return by KTX","ko":"서울: 서소문성지·절두산 순례·미사|솔뫼성지·해미읍성|불국사·석굴암 · KTX 귀경","zh":"首尔：西小门圣地·切头山朝圣·弥撒|松梅圣地与海美邑城|佛国寺·石窟庵，KTX返程","ja":"ソウル：西小門聖地・切頭山巡礼・ミサ|松梅聖地と海美邑城|仏国寺・石窟庵、KTXで帰京","ru":"Сеул: Сосомун, Чольтусан и месса|Солмэ и крепость Хэми|Пульгукса и Соккурам, возвращение на KTX","es":"Seúl: Seosomun, Jeoldusan y misa|Solmoe y fortaleza de Haemi|Bulguksa y Seokguram, regreso en KTX","vi":"Seoul: Seosomun · Jeoldusan · thánh lễ|Solmoe & thành Haemi|Bulguksa · Seokguram, về bằng KTX"},"tour.st11.title":{"en":"K-Culture, Top Universities & DMZ Student Trip 3N4D","ko":"K-컬처 & 명문대·DMZ 학생단체 수학여행 3박 4일","zh":"K-文化·名校·DMZ 学生团体修学旅行 4天3晚","ja":"K-カルチャー・名門大学・DMZ 学生団体研修旅行 3泊4日","ru":"K-культура, ведущие вузы и ДМЗ: школьная поездка, 4 дня","es":"Viaje escolar K-culture, universidades y DMZ, 4 días","vi":"Du lịch học sinh K-culture · đại học · DMZ 4 ngày 3 đêm"},"tour.st11.desc":{"en":"Campus visits at Seoul National and Yonsei, a DMZ peace tour, Gyeongbokgung in hanbok and a K-POP dance class — with a safety manager for the whole group.","ko":"서울대·연세대 캠퍼스 탐방, DMZ 평화 투어, 한복 입고 경복궁, K-POP 댄스 클래스까지. 단체 전담 안전 매니저가 24시간 함께합니다.","zh":"首尔大学与延世大学校园交流、DMZ和平之旅、穿韩服游景福宫与K-POP舞蹈课，全程配备团体安全管理员。","ja":"ソウル大・延世大のキャンパス交流、DMZ平和ツアー、韓服で景福宮、K-POPダンス教室。安全管理スタッフが24時間同行します。","ru":"Кампусы SNU и Ёнсе, тур мира на ДМЗ, Кёнбоккун в ханбоке и урок K-POP танцев — с менеджером по безопасности на всю группу.","es":"Visitas a los campus de SNU y Yonsei, gira por la DMZ, Gyeongbokgung con hanbok y clase de baile K-POP, con gestor de seguridad.","vi":"Tham quan ĐH Quốc gia Seoul & Yonsei, tour hòa bình DMZ, Gyeongbokgung với áo hanbok và lớp nhảy K-POP, có quản lý an toàn theo đoàn."},"tour.st11.hl":{"en":"Seoul National Univ. & Yonsei campus visits|DMZ & Imjingak peace programme|Gyeongbokgung hanbok walk & K-POP dance class|Safety manager and 45-seat coach throughout","ko":"서울대·연세대 캠퍼스 탐방|DMZ·임진각 평화 프로그램|경복궁 한복 체험·K-POP 댄스 클래스|안전 매니저·45인승 버스 전일 동행","zh":"首尔大学·延世大学校园探访|DMZ·临津阁和平项目|景福宫韩服体验与K-POP舞蹈课|安全管理员与45座大巴全程随行","ja":"ソウル大・延世大キャンパス見学|DMZ・臨津閣平和プログラム|景福宮韓服体験・K-POPダンス教室|安全管理スタッフと45人乗りバスが終日同行","ru":"Кампусы SNU и Ёнсе|Программа мира на ДМЗ и в Имджингаке|Кёнбоккун в ханбоке и урок K-POP|Менеджер по безопасности и автобус на 45 мест","es":"Campus de SNU y Yonsei|Programa de paz en la DMZ e Imjingak|Gyeongbokgung en hanbok y clase de K-POP|Gestor de seguridad y autobús de 45 plazas","vi":"ĐH Quốc gia Seoul & Yonsei|Chương trình hòa bình DMZ · Imjingak|Gyeongbokgung áo hanbok & lớp nhảy K-POP|Quản lý an toàn & xe 45 chỗ"},"tour.st11.itin":{"en":"Arrival · Gyeongbokgung & hanbok walk|SNU & Yonsei campus visits · Hongdae K-POP class|DMZ & Imjingak peace programme|Departure · souvenir stop & airport transfer","ko":"도착 · 경복궁 한복 체험|서울대·연세대 탐방 · 홍대 K-POP 클래스|DMZ·임진각 평화 프로그램|출국 · 기념품 쇼핑 · 공항 이동","zh":"抵达·景福宫韩服体验|首尔大·延世大探访·弘大K-POP课|DMZ·临津阁和平项目|返程·纪念品购物·送往机场","ja":"到着・景福宮韓服体験|ソウル大・延世大見学・弘大K-POP教室|DMZ・臨津閣平和プログラム|帰国・お土産・空港送迎","ru":"Прилёт · Кёнбоккун в ханбоке|Кампусы SNU и Ёнсе · K-POP в Хондэ|ДМЗ и Имджингак|Отъезд · сувениры · трансфер в аэропорт","es":"Llegada · Gyeongbokgung con hanbok|Campus SNU y Yonsei · clase K-POP en Hongdae|DMZ e Imjingak|Salida · souvenirs · traslado al aeropuerto","vi":"Đến · Gyeongbokgung áo hanbok|ĐH Quốc gia Seoul & Yonsei · lớp K-POP Hongdae|DMZ & Imjingak|Khởi hành · mua quà · ra sân bay"},"tour.md12.title":{"en":"Seoul Gangnam Premium Health Check & Wellness 2N3D","ko":"서울 강남 프리미엄 건강검진 & 한방·뷰티 웰니스 2박 3일","zh":"首尔江南高端体检与韩方·美容养生 3天2晚","ja":"ソウル江南 プレミアム人間ドック＆韓方・ビューティーウェルネス 2泊3日","ru":"Чекап премиум-класса в Каннаме и велнес, 3 дня","es":"Chequeo premium en Gangnam y bienestar, 3 días","vi":"Khám sức khỏe cao cấp Gangnam & wellness 3 ngày 2 đêm"},"tour.md12.desc":{"en":"A JCI-accredited comprehensive screening in Gangnam with 1:1 medical interpretation, then Korea's answer to recovery: an oriental-medicine spa, beauty care and a 5-star hotel.","ko":"JCI 인증 종합검진과 1:1 의료 통역, 그리고 한방 스파·뷰티 케어와 5성급 호텔에서의 회복까지. 검진과 웰니스를 한 번에 담았습니다.","zh":"江南JCI认证综合体检、一对一医疗翻译，加上韩方水疗与美容护理、五星级酒店休养，一次完成体检与养生。","ja":"江南のJCI認証総合健康診断と1対1医療通訳、韓方スパ・ビューティーケア、5つ星ホテルでの休息まで。検診とウェルネスを一度に。","ru":"Комплексное обследование в клинике Каннама с аккредитацией JCI и переводчиком 1:1, затем спа восточной медицины, уход за собой и отель 5*.","es":"Chequeo completo en un centro acreditado JCI de Gangnam con intérprete 1:1, y después spa de medicina oriental, cuidado de belleza y hotel 5*.","vi":"Khám tổng quát tại trung tâm chuẩn JCI ở Gangnam với phiên dịch 1:1, sau đó spa đông y, chăm sóc sắc đẹp và khách sạn 5 sao."},"tour.md12.hl":{"en":"JCI-accredited full health screening|1:1 medical interpreter all day|Oriental medicine spa & beauty care|5-star Gangnam hotel, 2 nights","ko":"JCI 인증 종합 건강검진|전일 1:1 의료 통역|한방 스파·뷰티 케어|강남 5성급 호텔 2박","zh":"JCI认证综合体检|全程一对一医疗翻译|韩方水疗与美容护理|江南五星酒店2晚","ja":"JCI認証の総合健康診断|終日1対1医療通訳|韓方スパ・ビューティーケア|江南5つ星ホテル2泊","ru":"Полный чекап с аккредитацией JCI|Переводчик 1:1 весь день|Спа восточной медицины и уход за собой|Отель 5* в Каннаме, 2 ночи","es":"Chequeo completo acreditado JCI|Intérprete médico 1:1 todo el día|Spa de medicina oriental y belleza|Hotel 5* en Gangnam, 2 noches","vi":"Khám tổng quát chuẩn JCI|Phiên dịch y tế 1:1 cả ngày|Spa đông y & chăm sóc sắc đẹp|Khách sạn 5 sao Gangnam, 2 đêm"},"tour.md12.itin":{"en":"Arrival · hotel check-in · wellness consultation|Health screening · interpreter · oriental spa|Results briefing · beauty care · departure","ko":"도착 · 호텔 체크인 · 웰니스 상담|건강검진 · 의료 통역 · 한방 스파|결과 상담 · 뷰티 케어 · 출국","zh":"抵达·酒店入住·养生咨询|健康体检·医疗翻译·韩方水疗|结果说明·美容护理·返程","ja":"到着・ホテルチェックイン・ウェルネス相談|健康診断・医療通訳・韓方スパ|結果説明・ビューティーケア・帰国","ru":"Прилёт · заселение · велнес-консультация|Обследование · переводчик · спа|Разбор результатов · уход · отъезд","es":"Llegada · check-in · consulta de bienestar|Chequeo · intérprete · spa oriental|Resultados · cuidado de belleza · salida","vi":"Đến · nhận phòng · tư vấn wellness|Khám sức khỏe · phiên dịch · spa đông y|Tư vấn kết quả · chăm sóc sắc đẹp · khởi hành"},"hotel.lotte.desc":{"en":"Landmark five-star hotel above Myeongdong with a pool, spa and direct su olf, nueve hoteles, sesión B2B y los orangutanes de Semenggoh.","vi":"Chương trình đã xác nhận 22–26/02/2027: hai sân golf, chín khách sạn, buổi kết nối B2B và đười ươi Semenggoh."},"tour.kch01.hl":{"en":"Confirmed 2027.02.22–26 · AirAsia direct BKI–KCH 1 h 25 m|Two golf inspections: Damai Golf & Country Club, Kelab Golf Sarawak|Nine hotel inspections incl. Sheraton, Pullman, Hilton, Waterfront|Sarawak Cultural Village, Semadang kayaking, Semenggoh orangutans","ko":"2027.02.22~26 확정 · 에어아시아 BKI–KCH 직항 1시간 25분|골프장 2곳 인스펙션: 다마이 골프&CC, 클랩 골프 사라왁|호텔 9곳 답사: 쉐라톤·풀만·힐튼·워터프론트 등|사라왁 문화마을, 스마당 카약, 세멩고 오랑우탄","zh":"2027.02.22–26 已确认 · 亚航 BKI–KCH 直飞1小时25分|两座球场考察：Damai GCC、Kelab Golf Sarawak|九家酒店考察：喜来登、铂尔曼、希尔顿等|砂拉越文化村、Semadang 皮划艇、实蒙谷红毛猩猩","ja":"2027.02.22〜26 確定・エアアジア BKI–KCH 直行1時間25分|ゴルフ場2視察：ダマイGCC、クラブ・ゴルフ・サラワク|ホテル9軒視察：シェラトン、プルマン、ヒルトン等|サラワク文化村、スマダン川カヤック、セメンゴ・オランウータン","ru":"22–26.02.2027 подтверждено · AirAsia BKI–KCH, 1 ч 25 мин|Два гольф-клуба: Damai GCC и Kelab Golf Sarawak|Девять отелей: Sheraton, Pullman, Hilton и др.|Деревня культуры Саравака, каякинг Semadang, орангутаны","es":"22–26.02.2027 confirmado · AirAsia BKI–KCH 1 h 25 min|Dos campos: Damai GCC y Kelab Golf Sarawak|Nueve hoteles: Sheraton, Pullman, Hilton y más|Aldea cultural de Sarawak, kayak en Semadang, orangutanes","vi":"22–26/02/2027 đã xác nhận · AirAsia BKI–KCH 1g25|Hai sân golf: Damai GCC, Kelab Golf Sarawak|Chín khách sạn: Sheraton, Pullman, Hilton…|Làng văn hóa Sarawak, kayak Semadang, đười ươi"},"tour.kch01.itin":{"en":"16:20 BKI → 17:45 KCH · airport pickup · Vivacity & The Spring · Sarawak dinner · hotel check-in|Sarawak Cultural Village · Damai Golf & Country Club · Damai Lagoon & Cove 55 · Kelab Golf Sarawak inspection|Semadang kayaking · Semenggoh Wildlife Centre (orangutans) · Malaysia–China Friendship Park · CHAGEE tea break|B2B networking session · hotel inspections (Sheraton, Waterfront, Pullman, Hilton) · Main Bazaar & White Cat · sunset river cruise|Borneo Cultures Museum · Kuching airport · 1 BERS Tour 佣金","ja":"MEMBERS Tour 手数料","ru":"Комиссия MEMBERS Tour","es":"Comisión de MEMBERS Tour","vi":"Hoa hồng MEMBERS Tour"},"ph.formula":{"en":"Selling price = net ÷ (1 − rate). Commission = selling price − net.","ko":"판매가 = 공급가 ÷ (1 − 수수료율). 수수료 = 판매가 − 공급가.","zh":"销售价 = 供货价 ÷ (1 − 佣金率)，佣金 = 销售价 − 供货价。","ja":"販売価格 = 仕入価格 ÷ (1 − 手数料率)。手数料 = 販売価格 − 仕入価格。","ru":"Цена продажи = нетто ÷ (1 − ставка). Комиссия = цена − нетто.","es":"Precio = neto ÷ (1 − tasa). Comisión = precio − neto.","vi":"Giá bán = giá gốc ÷ (1 − tỷ lệ). Hoa hồng = giá bán − giá gốc."},"ph.preview":{"en":"Live preview","ko":"실시간 미리보기","zh":"实时预览","ja":"リアルタイムプレビュー","ru":"Живое превью","es":"Vista previa en vivo","vi":"Xem trước trực tiếp"},"ph.previewNote":{"en":"This is exactly how the card will look in the catalog.","ko":"카탈로그에 이 모습 그대로 노출됩니다.","zh":"目录中的展示效果如下。","ja":"カタログではこの通りに表示されます。","ru":"Так карточка будет выглядеть в каталоге.","es":"Así se verá la tarjeta en el catálogo.","vi":"Thẻ sẽ hiển thị như vậy trong danh mục."},"ph.publish":{"en":"Publish to the site","ko":"사이트에 등록 (미리보기 반영)","zh":"上架到网站（即时预览）","ja":"サイトに公開（プレビュー反映）","ru":"Опубликовать на сайте","es":"Publicar en el sitio","vi":"Đăng lên website"},"ph.publishNote":{"en":"This static site keeps partner products in your browser (localStorage) and shows them in the catalog immediately. Press the email button below to ask head office to publish globally in all seven languages — once a shared database is connected, publishing becomes one click for every visitor.","ko":"현재 정적 웹 버전에서는 등록한 상품이 이 브라우저(localStorage)에 저장되어 카탈로그에 바로 보입니다. 모든 방문자에게 7개 언어로 게시하려면 아래 메일 버튼으로 본사에 정식 등록을 요청해 주세요. 공유 DB(예: Supabase)가 연결되면 클릭 한 번으로 전체 게시됩니다.","zh":"当前静态版本将合作商品保存在本浏览器（localStorage），并在目录中即时显示。要让所有访客以七种语言看到，请用下方邮件按钮向总部申请正式上架；接入共享数据库后将可一键发布。","ja":"現在の静的版では、登録した商品はこのブラウザ（localStorage）に保存され、カタログにすぐ表示されます。全訪問者へ7言語で公開するには、下のメールボタンで本社に正式登録を依頼してください。共有DB接続後はワンクリック公開になります。","ru":"В статической версии товары партнёра хранятся в этом браузере (localStorage) "連絡先は審査のみに使用し、公開しません。","ru":"Контактные данные используются только для проверки и не публикуются.","es":"Los datos de contacto solo se usan para revisar el envío y no se publican.","vi":"Thông tin liên hệ chỉ dùng để duyệt và không hiển thị công khai."},"lv.form.thanksTitle":{"en":"Submission received","ko":"등록 신청이 접수되었습니다","zh":"已收到申请","ja":"申請を受け付けました","ru":"Заявка получена","es":"Solicitud recibida","vi":"Đã nhận đăng ký"},"lv.form.thanksBody":{"en":"It is waiting for the MEMBERS Tour team's approval. Once approved it appears on the public channel — usually within one or two working days.","ko":"멤버스 투어 담당자 승인을 기다리고 있습니다. 승인되면 공개 채널에 게시되며 보통 영업일 기준 1~2일 걸립니다.","zh":"正在等待 MEMBERS Tour 团队审核。通过后会发布在公开频道，通常需要 1~2 个工作日。","ja":"MEMBERS Tour 担当者の承認待ちです。承認後、通常 1〜2 営業日で公開チャンネルに掲載されます。","ru":"Ожидает проверки командой MEMBERS Tour. После одобрения появится на канале — обычно в течение 1–2 рабочих дней.","es":"Espera la aprobación del equipo de MEMBERS Tour. Una vez aprobado aparece en el canal, normalmente en uno o dos días laborables.","vi":"Đang chờ đội MEMBERS Tour duyệt. Khi được duyệt sẽ hiện trên kênh, thường trong 1–2 ngày làm việc."},"lv.form.mail":{"en":"Email the team at memberstour@kakao.com","ko":"memberstour@kakao.com 로 알림 메일 보내기","zh":"发送邮件至 memberstour@kakao.com","ja":"memberstour@kakao.com へメールを送る","ru":"Написать на memberstour@kakao.com","es":"Escribir a memberstour@kakao.com","vi":"Gửi email tới memberstour@kakao.com"},"lv.form.mailNote":{"en":"Opens your mail app with the submission already filled in.","ko":"메일 앱이 열리고 신청 내용이 자동으로 채워집니다.","zh":"将打开邮件应用并自动填写申请内容。","ja":"メールアプリが開き、申請内容が自動入力されます。","ru":"Откроется почтовое приложение с заполненной заявкой.","es":"Se abre tu correo con la solicitud ya rellenada.","vi":"Mở ứng dụng email với nội dung đã điền sẵn."},"lv.form.close":{"en":"Close","ko":"닫기","zh":"关闭","ja":"閉じる","ru":"Закрыть","es":"Cerrar","vi":"Đóng"},"lv.toast.pending":{"en":"Submitted — waiting for approval.","ko":"등록 신청을 접수했습니다 · 승인 대기","zh":"已 ta","vi":"Đang chờ trả lời"},"mrt.qa.mine":{"en":"Your question","ko":"내 질문","zh":"我的提问","ja":"自分の質問","ru":"Ваш вопрос","es":"Tu pregunta","vi":"Câu hỏi của bạn"},"mrt.qa.tips":{"en":"{n} local answers","ko":"현지 답변 {n}개","zh":"{n} 条当地解答","ja":"現地の回答 {n}件","ru":"Ответов гидов: {n}","es":"{n} respuestas locales","vi":"{n} câu trả lời địa phương"},"mrt.qa.empty":{"en":"No questions in this category yet.","ko":"이 분류에는 아직 질문이 없습니다.","zh":"该分类还没有问题。","ja":"このカテゴリの質問はまだありません。","ru":"В этой категории пока нет вопросов.","es":"Aún no hay preguntas en esta categoría.","vi":"Chưa có câu hỏi trong mục này."},"mrt.qa.errName":{"en":"Please enter your name.","ko":"이름을 입력해 주세요.","zh":"请输入姓名。","ja":"お名前を入力してください。","ru":"Введите имя.","es":"Escribe tu nombre.","vi":"Vui lòng nhập tên."},"mrt.qa.errQ":{"en":"Please write your question (5+ characters).","ko":"질문을 5자 이상 써주세요.","zh":"请写下问题（至少 5 个字）。","ja":"質問を5文字以上で書いてください。","ru":"Напишите вопрос (не менее 5 символов).","es":"Escribe tu pregunta (mínimo 5 caracteres).","vi":"Vui lòng viết câu hỏi (từ 5 ký tự)."},"mrt.qa.note":{"en":"Answered by our guide desk. Saved on this device for the demo.","ko":"가이드 데스크가 답변합니다. 데모용으로 이 기기에만 저장됩니다.","zh":"由导游团队解答，演示版仅保存在本设备。","ja":"ガイドデスクが回答します。デモのため端末にのみ保存されます。","ru":"Отвечает гид-служба. В демо хранится только на этом устройстве.","es":"Responde nuestro equipo de guías. En la demo se guarda solo en este dispositivo.","vi":"Do bộ phận HDV trả lời. Bản demo lưu trên thiết bị này."},"mrt.qa.t1.q":{"en":"What is the easiest way from Incheon Airport to downtown Seoul?","ko":"인천공항에서 서울 시내로 가장 편한 방법은?","zh":"从仁川机场到首尔市区最方便的方式？","ja":"仁川空港からソウル市内への一番楽な方法は？","ru":"Как проще всего добраться из аэропорта Инчхон в центр Сеула?","es":"¿Cuál es la forma más fácil de ir del aeropuerto de Incheon al centro de Seúl?","vi":"Cách thuận tiện nhất từ sân bay Incheon vào trung tâm Seoul?"},"mrt.qa.t1.a":{"en":"AREX express to Seoul Station (43 min, ₩9,500), then subway or taxi. With luggage or a group, a private transfer meets you at Gate 1 with a name board and waits 60 minutes free.","ko":"AREX 직통열차로 서울역까지 43분(9,500원), 이후 지하철이나 택시를 이용하세요. 짐이 많거나 단체라면 전용 차량이 1번 게이트에서 이름판을 들고 기다리며, 대기 60분이 무료입니다.","zh":"乘 AREX 直达列车到首尔站（43 分钟，9,500 韩元），再换地铁或出租车。行李多或团队出行时，专车会在 1 号门举牌等候，免费等待 60 分钟。","ja":"AREX直通列車でソウル駅まで43分（9,500ウォン）、そこから地下鉄かタクシー。荷物が多い方や団体なら、専用車が1番ゲートでネームボードを持って待ちます（60分無料待機）。","ru":"AREX-экспресс до станции Сеул (43 мин, 9 500 вон), далее метро или такси. С багажом или группой удобнее частный трансфер: водитель ждёт у выхода 1 с табличкой, 60 минут бесплатно.","es":"AREX exprés a la estación de Seúl (43 min, 9.500 KRW) y luego metro o taxi. Con equipaje o en grupo, un traslado privado te espera en la puerta 1 con un cartel y 60 minutos gratis.","vi":"Tàu AREX tốc hành đến ga Seoul (43 phút, 9.500 KRW), sau đó đi metro hoặc taxi. Nếu có nhiều hành lý hoặc đi theo đoàn, xe riêng đợi ở cổng 1 với bảng tên, miễn phí 60 phút chờ."},"mrt.qa.t2.q":{"en":"T-money or eSIM — what should I get first?","ko":"티머니와 유심, 무엇을 먼저 준비해야 하나요?","zh":"T-money 卡和 eSIM，先准备哪个？","ja":"T-moneyとeSIM、先に用意するのはどちら？","ru":"T-money или eSIM — что оформить сначала?","es":"¿T-money o eSIM? ¿Qué consigo primero?","vi":"T-money hay eSIM — nên chuẩn bị cái nào trước?"},"mrt.qa.t2.a":{"en":"Get the eSIM before you fly — data works the moment you land. Pick up a T-money card at any convenience store for buses and the subway (₩2,500–4,000, top up at every station).","ko":"유심은 출국 전에 준비하세요. 착륙하는 순간 데이터가 됩니다. 티머니 카드는 편의점에서 사면 버스·지하철 모두 이용 가능합니다(2,500~4,000원, 모든 역에서 충전).","zh":"eSIM 建议出发前办好，落地即可上网。T-money 卡在便利店就能买，公交和地铁通用（2,500–4,000 韩元，各站可充值）。","ja":"eSIMは出発前に。着陸した瞬間から通信できます。T-moneyカードはコンビニで購入でき、バスも地下鉄も使えます（2,500〜4,000ウォン、各駅でチャージ可）。","ru":"eSIM оформите до вылета — интернет заработает сразу после посадки. Карту T-money купите в любом магазине у дома: автобусы и метро (2 500–4 000 вон, пополнение на каждой станции).","es":"Consigue la eSIM antes de volar: los datos funcionan al aterrizar. La tarjeta T-money se compra en cualquier tienda de conveniencia para bus y metro (2.500–4.000 KRW, recarga en cada estación).","vi":"Nên mua eSIM trước khi bay — dữ liệu hoạt động ngay khi hạ cánh. Thẻ T-money mua ở cửa hàng tiện lợi, dùng cho xe bus và metro (2.500–4.000 KRW, nạp tại mọi ga)."},"mrt.qa.t3.q":{"en":"What should I pack for late November in Seoul?","ko":"11월 말 서울, 무엇을 챙겨야 하나요?","zh":"11 月底的首尔要带什么？","ja":"11月下旬のソウル、何を持っていく？","ru":"Что взять в Сеул в конце ноября?","es":"¿Qué llevo a Seúl a finales de noviembre?","vi":"Cuối tháng 11 ở Seoul nên mang gì?"},"mrt.qa.t3.a":{"en":"Days run 5–10°C and nights near 0°C, dry and windy. A padded coat, layers and comfortable shoes are enough; a mask helps on yellow-dust days. Our guide checks the air quality each morning and swaps outdoor stops when needed.","ko":"낮 5~10도, 밤은 0도 안팎으로 건조하고 바람이 붑니다. 패딩과 겹쳐 입을 옷, 편한 신발이면 충분하고 미세먼지 많은 날은 마스크가 도움이 됩니다. 가이드가 매일 아침 미세먼지를 확인해 실외 일정을 조정합니다.","zh":"白天 5–10°C，夜间接近 0°C，干燥多风。羽绒服、可叠穿衣物和舒适的鞋子就够；沙尘天建议戴口罩。导游每天早上查看空气质量，必要时替换户外行程。","ja":"日中5〜10°C、夜は0°C前後で乾燥して風が強いです。パディングと重ね着、歩きやすい靴で十分。黄砂の日はマスクがあると安心です。ガイドが毎朝大気の状態を確認し、必要なら屋外日程を入れ替えます。","ru":"Днём 5–10 °C, ночью около 0 °C, сухо и ветрено. Достаточно пуховика, слоёв и удобной обуви; в дни пыли поможет маска. Гид каждое утро проверяет качество воздуха и при необходимости меняет уличные остановки.","es":"De día 5–10 °C y de noche cerca de 0 °C, seco y con viento. Con un abrigo acolchado, capas y calzado cómodo basta; una mascarilla ayuda en días de polvo. El guía revisa la calidad del aire cada mañana y cambia paradas al aire libre si hace falta.","vi":"Ban ngày 5–10°C, ban đêm quanh 0°C, khô và nhiều gió. Áo phao, quần áo mặc lớp và giày thoải mái là đủ; ngày bụi mịn nên mang khẩu trang. HDV kiểm tra chất lượng không khí mỗi sáng và đổi điểm dừng ngoài trời khi cần."},"mrt.qa.t4.q":{"en":"Any must-try dishes near Myeongdong?","ko":"명동 근처에서 꼭 먹어야 할 음식은?","zh":"明洞附近有哪些必吃美食？","ja":"明洞近くで必ず食べたい料理は？","ru":"Что обязательно попробовать рядом с Мёндоном?","es":"¿Qué platos hay que probar cerca de Myeongdong?","vi":"Món gì nhất định phải thử gần Myeongdong?"},"mrt.qa.t4.a":{"en":"Gyoza at Myeongdong Kyoja, grilled galbi in the alleys behind the main street, and hotteok from the street carts after 6pm. Ask your guide for the ₩10,000 lunch map we give every guest.","ko":"명동교자 칼국수와 만두, 메인 거리 뒤 골목의 갈비, 저녁 6시 이후 노점 호떡을 추천합니다. 가이드에게 객실마다 드리는 '1만원 점심 지도'를 요청해 보세요.","zh":"推荐明洞饺子的饺子和刀削面、主街后巷的烤排骨，以及晚上 6 点后的街头糖饼。向导游索取我们送给每位客人的“一万韩元午餐地图”。","ja":"明洞餃子の餃子とカルグクス、メイン通りの裏路地の焼きカルビ、18時以降の屋台のホットク。ガイドに「1万ウォン昼食マップ」をもらってください。","ru":"Пельмени кёджа в Myeongdong Kyoja, кальби на гриле в переулках за главной улицей и хотток с уличных тележек после 18:00. Попросите у гида «карту обедов за 10 000 вон» — её получает каждый гость.","es":"Gyoza en Myeongdong Kyoja, galbi a la parrilla en los callejones tras la calle principal y hotteok de los puestos después de las 18:00. Pide a tu guía el «mapa de comidas por 10.000 KRW» que damos a cada cliente.","vi":"Sủi cảo ở Myeongdong Kyoja, galbi nướng trong các ngõ sau phố chính, và bánh hotteok ở xe đẩy sau 18h. Hỏi HDV để nhận “bản đồ ăn trưa 10.000 KRW” chúng tôi tặng mỗi khách."},"mrt.qa.t5.q":{"en":"Do I need to book KTX tickets in advance?","ko":"KTX 표는 미리 예약해야 하나요?","zh":"KTX 车票需要提前预订吗？","ja":"KTXの切符は事前予約が必要ですか？","ru":"Нужно ли заранее бронировать билеты KTX?","es":"¿Hay que reservar los billetes de KTX con antelación?","vi":"Có cần đặt vé KTX trước không?"},"mrt.qa.t5.a":{"en":"Yes for weekends and holidays — Seoul–Busan can sell out a day or two ahead. We hold group seats 30 days out; individual travellers can book on KORAIL 1–2 weeks ahead and collect at the station machine.","ko":"주말과 연휴에는 미리 예약하세요. 서울~부산은 하루 이틀 전에 매진되기도 합니다. 단체는 30일 전부터 좌석을 확보하고, 개인은 코레일에서 1~2주 전 예약 후 역 발권기에서 수령하면 됩니다.","zh":"周末和节假日务必提前订。首尔—釜山常常提前一两天售罄。团队席位我们提前 30 天锁定；个人可在 KORAIL 提前 1–2 周预订，到车站取票机取票。","ja":"週末・連休は事前予約を。ソウル〜釜山は1〜2日前に売り切れることもあります。団体は30日前から席を確保し、個人はKORAILで1〜2週間前に予約して駅の券売機で受け取れます。","ru":"На выходных и в праздники — да: Сеул–Пусан может разойтись за день-два. Для групп мы держим места за 30 дней; индивидуально можно бронировать на KORAIL за 1–2 недели и забрать в автомате на станции.","es":"Sí, fines de semana y festivos: Seúl–Busan puede agotarse uno o dos días antes. Para grupos reservamos plazas con 30 días de antelación; los individuales pueden reservar en KORAIL 1–2 semanas antes y recoger en la máquina de la estación.","vi":"Cuối tuần và ngày lễ thì nên đặt trước — tuyến Seoul–Busan có thể hết vé trước 1–2 ngày. Đoàn được giữ chỗ trước 30 ngày; khách lẻ đặt trên KORAIL trước 1–2 tuần và nhận vé tại máy ở ga."},"mrt.qa.t6.q":{"en":"Is Jeju doable without a car?","ko":"제주는 렌터카 없이도 다닐 수 있나요?","zh":"济州没有车能玩吗？","ja":"済州は車なしでも回れますか？","ru":"Можно ли обойтись на Чеджу без машины?","es":"¿Se puede recorrer Jeju sin coche?","vi":"Đi Jeju mà không có xe có được không?"},"mrt.qa.t6.a":{"en":"City buses and the 600 airport limousine reach the main sights, but a driver-guide saves two to three hours a day. For families we usually suggest a car with a guide from day two.","ko":"시내버스와 600번 공항 리무진으로 주요 명소는 갈 수 있지만, 기사 겸 가이드가 있으면 하루 2~3시간을 아낄 수 있습니다. 가족 여행이라면 둘째 날부터 차량과 가이드를 함께 쓰는 것을 권합니다.","zh":"市内公交和 600 路机场大巴能到主要景点，但有司机兼导游每天可省 2–3 小时。家庭出行我们一般建议从第二天起配车加导游。","ja":"市内バスと600番空港リムジンで主要名所へは行けますが、運転手兼ガイドがいると1日2〜3時間節約できます。家族旅行なら2日目から車＋ガイドをおすすめします。","ru":"Городские автобусы и лимузин 600 до аэропорта довезут до главных мест, но водитель-гид экономит 2–3 часа в день. Семьям мы обычно советуем машину с гидом со второго дня.","es":"Los buses urbanos y el limusina 600 del aeropuerto llegan a lo principal, pero un conductor-guía ahorra dos o tres horas al día. A las familias les sugerimos coche con guía desde el segundo día.","vi":"Xe bus nội thành và xe limousine sân bay 600 đến được các điểm chính, nhưng có tài xế kiêm HDV sẽ tiết kiệm 2–3 giờ mỗi ngày. Gia đình nên dùng xe kèm HDV từ ngày thứ hai."},"mrt.kl.title":{"en":"Ticket filters","ko":"티켓 필터","zh":"门票筛选","ja":"チケット絞り込み","ru":"Фильтры билетов","es":"Filtros de entr p."],["Sung-min L.","Singapore",4,"2026-08-22","Long drive from Seoul but worth it. Guide's English was clear and the bus was comfortable."]],"gj03":[["Sophie L.","France",5,"2026-10-11","The evening ceremony at the temple was the highlight of our two weeks in Korea. Room was simple but spotless, and the vegetarian dinner was excellent."],["Kenji T.","Japan",5,"2026-09-14","Pickup at Gyeongju KTX station was easy. Good balance of history and free time; the guide knew every question's answer."]],"jj04":[["Laura M.","Spain",5,"2026-10-02","The hanok room was beautiful and the breakfast table huge. Jeonju night market is a ten-minute walk — go hungry."],["Hannah W.","United Kingdom",4,"2026-09-19","Guide knew every alley. Only wish we had one more night in the hanok."]],"bs05":[["Marco P.","Italy",5,"2026-10-20","Gamcheon village early in the morning, before the crowds — worth the 7am start. The guide took us to a market stall we would never have found."],["Elena S.","Germany",5,"2026-09-27","Sky Capsule tickets were already booked for us, so no queue at all. Hotel was a short walk from the beach."]],"ys06":[["Peter H.","Netherlands",5,"2026-10-09","The night view from the cable car was stunning and the hotel sat right on the waterfront. Seafood dinner was included and generous."],["Yuki N.","Japan",4,"2026-08-30","Two nights felt right for Yeosu. Guide's English was excellent; the schedule had enough free time."]],"je07":[["Amy C.","Canada",5,"2026-10-15","Three days felt right. The Hallasan trail was adjusted for our kids without any fuss, and the driver-guide was wonderful with them."],["Raj S.","India",5,"2026-10-01","Very patient with our parents — slower pace, more rest stops. Seongsan sunrise is a must."]],"ul08":[["Tom B.","New Zealand",5,"2026-09-08","The ferry was rough but the island is unreal. Guide handed out seasickness pills before we even asked."],["Sofia G.","Argentina",4,"2026-08-17","Two nights is the minimum — the coastal walk deserves a full day. Simple guesthouse, great seafood."]],"gf09":[["James O.","United States",5,"2026-10-12","Greens were fast and the caddie spoke English. Tee times were exactly as quoted and the airport transfer was waiting."],["Hiroshi M.","Japan",5,"2026-09-24","Course condition was excellent for the price. Club rental was arranged in advance as requested."]],"pg10":[["Maria D.","Philippines",5,"2026-10-06","Mass at the shrine was arranged for our group and the schedule stayed respectful throughout. Our priest travelled with us and was impressed."],["John K.","Ireland",5,"2026-09-11","Quiet, well-paced pilgrimage. The guide knew the history of every site and gave us time to pray."]],"st11":[["Sarah J.","Teacher, 42 students",5,"2026-10-22","Three buses, zero problems. Safety briefing, room checks and the evening curfew were all organised before we arrived."],["David L.","Singapore",5,"2026-09-16","The university visit and the K-pop dance class were the parts our students still talk about."]],"md12":[["Anna V.","Russia",5,"2026-10-08","The interpreter stayed with us through every appointment and the clinic paperwork was handled for us."],["Grace T.","Taiwan",5,"2026-09-21","Recovery hotel was quiet and the follow-up call came the next morning. Very professional."]],"kch01":[["Nurul A.","Malaysia",5,"2026-09-05","Everything from the airport pickup to the farewell dinner was arranged. Our members are already asking about next year."]],"osk01":[["Chris D.","United Kingdom",5,"2026-10-13","Osaka and Kyoto in three nights is tight but the pacing worked. The guide's restaurant list was better than any blog."]],"dad01":[["Linh P.","Vietnam",5,"2026-10-19","Hoi An at lantern time was magic. The beach hotel was a good choice for our group of six."]]},"qaTips":[{"id":"t1","cat":"transfer","author":"Kim Ji-hoon · Seoul guide","date":"2026-11-02","verified":true,"key":"t1"},{"id":"t2","cat":"sim","author":"Park Seo-yeon · Jeju guide","date":"2026-10-27","verified":true,"key":"t2"},{"id":"t3","ca   function authModal(tab, fromRoute) {
    var key = tab === 'join' ? 'join' : (tab === 'account' ? 'account' : 'signin');
    if (key === 'account' && !authCurrent()) key = 'signin';
    var html = modalBar(t('auth.title.' + key));
    if (key === 'account') {
      html += '<div class="m-body">' + authAccountHTML() + '</div>';
    } else {
      html += '<div class="m-body">' + authTabs(key) + (key === 'join' ? authJoinHTML() : authSigninHTML()) + '</div>';
    }
    if (fromRoute) showModal('auth:' + key, function () { authModal(key, true); }, html);

  function authSignIn(m) {
    authSetSession(m);
    applyMemberToForms();
    renderAuthButton();
    renderView(state.tab);
    toast(t('auth.toastSignin', { name: m.name }));
    go('#' + state.tab, true);
  }

  function authErr(msg) {
    var box = $('#authErr');
    if (box) { box.style.display = 'block'; box.textContent = msg; }
  }

  function authSubmitSignin(form) {
    var email = String(form.elements.email ? form.elements.email.value : '').trim().toLowerCase();
    var pw = String(form.elements.password ? form.elements.password.value : '');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { authErr(t('form.errEmail')); return; }
    if (!pw) { authErr(t('auth.errPassword')); return; }
    var list = authMembers(), found = null;
    for (var i = 0; i < list.length; i++) {
      if (String(list[i].email).toLowerCase() === email) found = list[i];
    }
    if (!found || found.pw !== hashPw(pw)) { authErr(t('auth.errBadPw')); return; }
    authSignIn(found);
  }

  function authSubmitSignup(form) {
    var el = form.elements;
    var name = String(el.name ? el.name.value : '').trim();
    var email = String(el.email ? el.email.value : '').trim().toLowerCase();
    var pw = String(el.password ? el.password.value : '');
    var nat = el.nat ? el.nat.value : '';
    var phone = String(el.phone ? el.phone.value : '').trim();
    var type = state.authType || 'traveler';
    var company = String(el.company ? el.company.value : '').trim();
    var bizNo = String(el.bizNo ? el.bizNo.value : '').trim();
    if (name.length < 2) { authErr(t('form.errName')); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { authErr(t('form.errEmail')); return; }
    if (pw.length < 8) { authErr(t('auth.errPassword')); return; }
    if (!nat) { authErr(t('auth.errNat')); return; }
    if (type === 'agency' && (company.length < 2 || bizNo.length < 3)) { authErr(t('auth.errCompany')); return; }
    var list = authMembers();
    for (var i = 0; i < list.length; i++) {
      if (String(list[i].email).toLowerCase() === email) { authErr(t('auth.errExists')); return; }
    }
    var member = {
      id: 'mb' + Date.now(), name: name, email: email, pw: hashPw(pw), nat: nat, phone: phone,
      type: type, company: type === 'agency' ? company : '', bizNo: type === 'agency' ? bizNo : '',
      joinedAt: new Date().toISOString(), v: MEMBER_SCHEMA
    };
    list.push(member);
    writeStore(KEY_MEMBERS, list);
    authSetSession(member);
    applyMemberToForms();
    renderAuthButton();
    renderView(state.tab);
    pushModalStep(null,
      '<div class="success">' +
      '<div class="auth-avatar" style="width:64px;height:64px;font-size:21px">' + esc(initials(name)) + '</div>' +
      '<h3>' + t('auth.welcomeTitle') + '</h3><p>' + t('auth.welcomeSub') + '</p>' +
      '<div class="ref-box"><small>' + t('auth.email') + '</small><b style="font-size:14px;letter-spacing:.02em">' + esc(email) + '</b></div>' +
      '<div class="success-actions"><button type="button" class="btn btn-light" data-act="close-modal">' + t('common.close') + '</button>' +
      '<button type="button" class="btn btn-primary" data-act="auth-close">' + t('auth.continue') + '</button></div></div>');
    toast(t('auth.toastJoin', { name: name }));
  }

    authSetSession(null);

    go('#' + state.tab, true);
    toast(t('auth.toastSignout'));
  }

  /* ---------------------------------------------------------------- tours */
  var BADGE_ICON = { bus: 'bus', ktx: 'train', flight: 'plane', cruise: 'ship' };

  function tourCard(x) {
    var isP = !!x.partner;
    var badges = '';
    if (isP) badges += '<span class="badge partner">' + ic.star + t('badge.partner') + '</span>';
    else if (x.popular) badges += '<span class="badge accent">' + ic.star + t('badge.popular') + '</span>';
    if (x.deal === 'early') badges += '<span class="badge teal">' + ic.sparkle + t('sp.deals.early') + '</span>';
    (x.badges || []).forEach(function (b) {
      badges += '<span class="badge' + (b === 'flight' ? ' teal' : '') + '">' + ic[BADGE_ICON[b] || 'bus'] + t('badge.' + b) + '</span>';
    });
    badges += klBadges(x);
    var cat = isP ? (x.regionLabel || t('badge.partner')) : catLabel(x.cat);
    var meta = isP
      ? '<span class="p-sup">' + ic.user + esc(x.supplier && x.supplier.company || t('ph.supplier')) + '</span>'
      : (x.deps && x.deps.length ? '<span>' + ic.cal + depsText(x) + '</span>'
        : '<span>' + ic.compass + esc(I18N['ob.filter.' + x.region] ? t('ob.filter.' + x.region) : catLabel(x.cat)) + '</span>');
    var rating = (!isP && x.rating)
      ? '<span class="rating">' + ic.star + Number(x.rating).toFixed(1) + '<span>(' + x.reviews + ')</span></span>'
      : '';
    var priceNote = (x.priceLabel && I18N['tour.' + x.id + '.price'])
      ? '<b style="font-size:13px;line-height:1.3">' + t('tour.' + x.id + '.price') + '</b>'
      : '<b>' + money(x.price || 0) + '</b><em>' + t('tours.perPerson') + '</em>';
    return '<div class="card-shell">' +
      '<button type="button" class="tour-card" data-act="tour" data-id="' + x.id + '">' +
      '<span class="cover">' + (photo('tour:' + x.id) || scene(x.theme)) +
      '<span class="badges">' + badges + '</span>' +
      '<span class="code">' + esc(x.code) + '</span></span>' +
      '<span class="card-body">' +
      '<span class="card-top"><span>' + esc(cat) + '</span><span class="sep"></span><span>' + durText(x) + '</span></span>' +
      '<h3>' + esc(tourTitle(x)) + '</h3>' +
      '<span class="card-meta">' + meta + rating + '</span>' +
      '<span class="card-foot">' +
      '<span class="price"><small>' + (x.priceLabel ? '' : t('tours.from')) + '</small>' + priceNote + '</span>' +
      '<span class="arrow-btn">' + ic.arrow + '</span>' +
      '</span></span></button>' + wishBtn('tour', x.id) + '</div>';

  /* -------------------------------------------------------------- flights */
  function airport(code) {
    for (var i = 0; i < DATA.airports.length; i++) if (DATA.airports[i].code === code) return DATA.airports[i];
    return DATA.airports[0];
  }
  function airportOptions(sel) {
    return DATA.airports.map(function (a) {
      return '<option value="' + a.code + '"' + (a.code === sel ? ' selected' : '') + '>' +
        cityName(a.city) + ' (' + a.code + ')</option>';
    }).join('');
  }
  function distanceKm(a, b) {
    var R = 6371, dLat = (b.lat - a.lat) * Math.PI / 180, dLon = (b.lon - a.lon) * Math.PI / 180;
    var la1 = a.lat * Math.PI / 180, la2 = b.lat * Math.PI / 180;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(la1) * Math.cos(la2) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return Math.round(2 * R * Math.asin(Math.sqrt(h)));
  }
  function hash(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 100000;
    return h;
  }
  function flights() {
    var A = airport(state.f.from), B = airport(state.f.to);
    if (A.code === B.code) return [];
    var dist = distanceKm(A, B);
    var seed = hash(A.code + B.code);
    var pool = DATA.airlines.filter(function (al) {
      return al.regions.indexOf('*') >= 0 || al.regions.indexOf(A.region) >= 0 || al.regions.indexOf(B.region) >= 0;
    });
    if (!pool.length) pool = DATA.airlines.slice(0, 4);
    var cabin = { economy: 1, premium: 1.65, business: 2.9, first: 4.3 }[state.f.cabin] || 1;
    var n = dist > 3000 ? 6 : 5;
    var out = [];
    var baseMin = 45 + Math.round(dist / 800 * 60);
    for (var i = 0; i < n; i++) {
      var al = pool[(seed + i * 3) % pool.length];
      var stops = dist > 3500 && i % 3 === 1 ? 1 : 0;
      var mins = baseMin + (stops ? 105 : 0) + ((seed + i * 7) % 15);
      var dep = 420 + ((seed / 7 + i * 143) % 900);
      dep = Math.round(dep / 5) * 5;
      var price = (45000 + dist * 95) * al.factor * cabin * (stops ? 0.9 : 1);
      if (state.f.trip === 'round') price = price * 1.86;
      price = Math.round(price / 1000) * 1000;
      out.push({
        key: A.code + B.code + i,
        airline: al.name,
        code: al.code,
        no: al.code + ' ' + (100 + ((seed + i * 37) % 880)),
        from: A.code, to: B.code,
        dep: dep, arr: dep + mins, mins: mins, stops: stops,
        price: price, seats: 3 + ((seed + i * 11) % 6)
      });
    }
    out.sort(function (a, b) {
      if (state.f.sort === 'cheapest') return a.price - b.price;
      if (state.f.sort === 'fastest') return a.mins - b.mins;
      return (a.price * 0.7 + a.mins * 900) - (b.price * 0.7 + b.mins * 900);
    });
    return out;
  }

    var s = '';
    for (var i = a; i <= b; i++) s += '<option value="' + i + '"' + (i === sel ? ' selected' : '') + '>' + i + '</option>';

  /* ------------------------------------------------- custom ground quote */
  /* Demo tariff sheet — KRW per vehicle/room/group. Illustrative only; the
     MICE desk confirms the firm quotation against seasonal contracts. */
  var QUOTE = {
    vehicles: [
      { key: 'coach45', seats: 45, day: 650000 },
      { key: 'minibus25', seats: 25, day: 480000 },
      { key: 'solati15', seats: 15, day: 400000 },
      { key: 'sedan', seats: 3, day: 330000 }
    ],
    guideDay: 260000,
    hotels: [
      { key: 'lux5', room: 340000 },
      { key: 'biz4', room: 200000 },
      { key: 'std3', room: 130000 },
      { key: 'hanok', room: 150000 }
    ],
    mice: 1600000,
    galaPerPax: 95000,
    meet: 180000,
    regionDay: 130000
  };
  var QUOTE_REGIONS = ['seoul', 'gg', 'gw', 'gj', 'bs', 'jeju', 'custom'];

  function qVehicle(k) {
    for (var i = 0; i < QUOTE.vehicles.length; i++) if (QUOTE.vehicles[i].key === k) return QUOTE.vehicles[i];
    return QUOTE.vehicles[0];
  }
  function qHotel(k) {
    for (var i = 0; i < QUOTE.hotels.length; i++) if (QUOTE.hotels[i].key === k) return QUOTE.hotels[i];
    return null;
  }
  function qLangLabel(code) {
    for (var i = 0; i < LANGS.length; i++) if (LANGS[i].code === code) return LANGS[i].label;
    return LANGS[0].label;
  }
  function qPax() {
    var n = parseInt(state.q.pax, 10);
    if (isNaN(n) || n < 1) n = 1;
    return Math.min(n, 500);
  }
  function qSpan() {
    var q = state.q;
    var a = new Date((q.start || '') + 'T00:00:00'), b = new Date((q.end || '') + 'T00:00:00');
    var d = Math.round((b - a) / 86400000);
    if (!isFinite(d) || d < 0) d = 0;
    if (!q.start) return { days: 1, nights: 0 };
    return { days: d + 1, nights: d };
  }
  function qRegionsOf(rec) {
    return (rec.regions || []).map(function (r) {
      if (r === 'custom') return rec.custom || t('quote.region.custom');
      return t('quote.region.' + r);
    });
  }
  function qCalc() {
    var q = state.q, span = qSpan(), days = span.days, nights = span.nights;
    var pax = qPax(), lines = [], total = 0, vehCount = 0;
    if (q.svc.vehicle) {
      var v = qVehicle(q.veh);
      vehCount = Math.max(1, Math.ceil(pax / v.seats));
      var amt = v.day * vehCount * days;
      lines.push({ label: t('quote.line.vehicle', { name: t('quote.veh.' + v.key), v: vehCount, n: days }), amount: amt });
      total += amt;
    }
    if (q.svc.guide) {
      var gAmt = QUOTE.guideDay * days;
      lines.push({ label: t('quote.line.guide', { name: qLangLabel(q.glang), n: days }), amount: gAmt });
      total += gAmt;
    }
    var hotel = q.svc.hotel ? qHotel(q.hotel) : null;
    if (hotel && nights > 0) {
      var rooms = Math.ceil(pax / 2);
      var hAmt = hotel.room * rooms * nights;
      lines.push({ label: t('quote.line.hotel', { name: t('quote.hotel.' + hotel.key), r: rooms, m: nights }), amount: hAmt });
      total += hAmt;
    }
    var extra = (q.svc.vehicle || q.svc.guide) ? Math.max(0, (q.regions || []).length - 1) : 0;
    if (extra > 0) {
      var rAmt = QUOTE.regionDay * extra * days;
      lines.push({ label: t('quote.line.region', { n: q.regions.length }), amount: rAmt });
      total += rAmt;
    }
    if (q.mice) { lines.push({ label: t('quote.line.mice'), amount: QUOTE.mice }); total += QUOTE.mice; }
    if (q.gala) {
      var galaAmt = QUOTE.galaPerPax * pax;
      lines.push({ label: t('quote.line.gala', { n: pax }), amount: galaAmt });
      total += galaAmt;
    }
    if (q.meet) { lines.push({ label: t('quote.line.meet'), amount: QUOTE.meet }); total += QUOTE.meet; }
    /* attraction toppings: admission / experience / meal ground cost */
    var picks = topPicked().sort(function (a, b) { return a.day - b.day; });
    var topTotal = 0;
    picks.forEach(function (x) {
      var amt = topAmount(x.tp);
      lines.push({
        label: t('quote.line.topping', { name: t('topping.' + x.id), d: x.day }),
        amount: amt, day: x.day, top: x.id
      });
      topTotal += amt;
      total += amt;
    });
    return {
      lines: lines, total: total, days: days, nights: nights, pax: pax, vehicles: vehCount,
      tops: picks, topTotal: topTotal,
      perPax: Math.round(total / pax)
    };
  }

  /* ------------------------------------- attraction toppings & itinerary */
  /* A TATINTA-style builder: click a region, drop attractions into the plan
     like toppings, and the day-by-day schedule + ground cost follow. */
  var TOP_REGIONS = ['seoul', 'gg', 'gw', 'gj', 'bs', 'jeju'];
  var TOP_CAT_ICON = { landmark: 'pin', culture: 'compass', nature: 'sparkle', experience: 'ticket', food: 'coffee' };
  var TOP_DAY_START = 540;   /* 09:00 */
  var TOP_GAP = 30;          /* minutes between stops */
  var TOP_DAY_CAP = 330;     /* activity minutes we plan into one day */
  var TOP_MAX_ITEMS = 4;

  /* YOMO-style pacing: how much air the day keeps between stops */
  var PACE = {
    relaxed: { gap: 45, cap: 270, max: 3 },
    standard: { gap: 30, cap: 330, max: 4 },
    packed: { gap: 15, cap: 420, max: 5 }
  };
  function ymPace() { return PACE[state.q.pace] || PACE.standard; }

  function topFind(id) {
    for (var i = 0; i < DATA.toppings.length; i++) if (DATA.toppings[i].id === id) return DATA.toppings[i];
    return null;
  }
  function topRegionList(region) {
    return DATA.toppings.filter(function (x) { return x.region === region; });
  }
  function topDays() {
    return Math.max(1, Math.min(12, qSpan().days));
  }
  function topSel() { return state.q.topics || []; }
  function topPicked() {
    var days = topDays(), out = [];
    topSel().forEach(function (x) {
      var tp = topFind(x.id);
      if (!tp) return;
      if (!x.day || x.day < 1) x.day = 1;
      if (x.day > days) x.day = days;
      out.push({ id: tp.id, day: x.day, auto: x.auto !== false, tp: tp });
    });
    return out;
  }
  function topIsOn(id) {
    for (var i = 0; i < topSel().length; i++) if (topSel()[i].id === id) return true;
    return false;
  }
  function topDayOf(id) {
    for (var i = 0; i < topSel().length; i++) if (topSel()[i].id === id) return topSel()[i].day;
    return 0;
  }
  function topAmount(tp) { return tp.per === 'team' ? tp.krw : tp.krw * qPax(); }
  function topPriceHTML(tp) {
    if (!tp.krw) return '<b class="qtop-price">' + t('quote.top.free') + '</b>';
    return '<b class="qtop-price">+' + money(tp.krw) + '<small>' +
      t(tp.per === 'team' ? 'quote.top.perTeam' : 'quote.top.perPax') + '</small></b>';
  }
  function topLoad(list, day, except) {
    var mins = 0, items = 0;
    list.forEach(function (x) {
      if (x === except || x.day !== day) return;
      var tp = topFind(x.id);
      if (!tp) return;
      mins += tp.mins;
      items += 1;
    });
    return { mins: mins, items: items };
  }
  function topFit(list, tp, start, days, except) {
    var pace = ymPace();
    for (var i = 0; i < days; i++) {
      var d = ((start - 1 + i) % days) + 1, load = topLoad(list, d, except);
      if (load.mins + tp.mins <= pace.cap && load.items < pace.max) return d;
    }
    return start || days;
  }
  function topNextDay(list, tp) {
    var days = topDays(), anchor = 0, empty = 0, d;
    list.forEach(function (x) {
      if (!x.day) return;
      var other = topFind(x.id);
      if (other && other.region === tp.region && x.day <= days) anchor = x.day;
    });
    if (anchor) return topFit(list, tp, anchor, days, null);
    for (d = 1; d <= days; d++) if (!topLoad(list, d, null).items) { empty = d; break; }
    return topFit(list, tp, empty || 1, days, null);
  }
  function topPlanAll() {
    var days = topDays(), list = topSel(), regionDay = {};
    list.forEach(function (x) { x.day = 0; x.auto = true; });
    list.forEach(function (x) {
      var tp = topFind(x.id);
      if (!tp) return;
      var start = regionDay[tp.region];
      if (!start) {
        for (var d = 1; d <= days; d++) if (!topLoad(list, d, x).items) { start = d; break; }
      }
      var day = topFit(list, tp, start || 1, days, x);
      x.day = day;
      regionDay[tp.region] = day;
    });
  }
  function topToggle(id) {
    var tp = topFind(id);
    if (!tp) return;
    var idx = -1;
    topSel().forEach(function (x, i) { if (x.id === id) idx = i; });
    if (idx >= 0) {
      state.q.topics.splice(idx, 1);
      renderToppingsUI();
      toast(t('quote.top.removedToast'));
      return;
    }
    var entry = { id: id, day: topNextDay(topSel(), tp), auto: true };
    state.q.topics.push(entry);
    renderToppingsUI();
    toast(t('quote.top.addedToast', { n: entry.day }));
  }
  function topMove(id, day) {
    if (!day) return;
    topSel().forEach(function (x) { if (x.id === id) { x.day = day; x.auto = false; } });
    renderToppingsUI();
    toast(t('quote.top.movedToast', { n: day }));
  }
  function topDayDate(day) {
    if (!state.q.start) return '';
    var d = new Date(state.q.start + 'T00:00:00');
    if (isNaN(d.getTime())) return '';
    return fmtDate(iso(addDays(d, day - 1)));
  }
  function topSchedule() {
    var days = topDays(), picked = topPicked(), out = [], pace = ymPace();
    for (var d = 1; d <= days; d++) {
      var rows = [], cursor = TOP_DAY_START, mins = 0;
      picked.forEach(function (x) {
        if (x.day !== d) return;
        rows.push({ id: x.id, tp: x.tp, start: cursor, end: cursor + x.tp.mins });
        cursor += x.tp.mins + pace.gap;
        mins += x.tp.mins;
      });
      out.push({ day: d, date: topDayDate(d), rows: rows, mins: mins });
    }
    return out;
  }

    return topRegionList(state.q.topRegion).map(topCard).join('');

  function topSummaryBar() {
    var picked = topPicked(), cost = 0;
    picked.forEach(function (x) { cost += topAmount(x.tp); });
    return '<div class="qtop-sum"><div class="qtop-sum-txt"><b>' +
      t(picked.length === 1 ? 'quote.top.countOne' : 'quote.top.count', { n: picked.length }) +
      '</b><span>' + t('quote.top.cost') + ' · ' + money(cost) + '</span></div>' +
      '<div class="qtop-acts">' +
      (picked.length
        ? '<button type="button" class="qlink" data-act="q-top-plan">' + t('quote.top.plan') + '</button>' +
          '<button type="button" class="qlink danger" data-act="q-top-clear">' + t('quote.top.clear') + '</button>'
        : '') +
      '</div></div>';
  }

  function topRegionLabel(r) { return r === 'gg' ? t('quote.top.region.gg') : t('quote.region.' + r); }
  function topPlace(tp) { return t('topping.' + tp.id) + ', ' + topRegionLabel(tp.region); }
  function mapUrl(query) {
    return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query);
  }
  /* move a stop one place up/down inside its own day */
  function topShift(id, dir) {
    var sel = topSel(), idx = -1;
    sel.forEach(function (x, i) { if (x.id === id) idx = i; });
    if (idx < 0) return;
    var day = sel[idx].day, j = idx + dir;
    while (j >= 0 && j < sel.length && sel[j].day !== day) j += dir;
    if (j < 0 || j >= sel.length) return;
    var tmp = sel[idx];
    sel[idx] = sel[j];
    sel[j] = tmp;
    sel[idx].auto = false;
    sel[j].auto = false;
    renderToppingsUI();
    toast(t('quote.top.movedToast', { n: day }));
  }

  function itiHTML() {
    var sched = topSchedule(), any = false, days = topDays();
    sched.forEach(function (d) { if (d.rows.length) any = true; });
    if (!any) {
      return '<div class="qiti-empty">' + ic.sparkle + '<span>' + t('quote.iti.empty') + '</span></div>';
    }
    var html = '';
    sched.forEach(function (day) {
      var items = day.rows.map(function (r) {
        var opts = '';
        for (var d = 1; d <= days; d++) {
          opts += '<option value="' + d + '"' + (d === day.day ? ' selected' : '') + '>' +
            t('quote.top.day', { n: d }) + '</option>';
        }
        return '<li class="qiti-item" data-iti="' + r.id + '">' +
          '<span class="qiti-time">' + fmtTime(r.start) + '<small>' + fmtTime(r.end) + '</small></span>' +
          '<span class="qiti-main"><b>' + t('topping.' + r.id) + '</b><small>' + t('quote.top.cat.' + r.tp.cat) +

  /* -------------------------------------- share the plan with the group */
  var YM_SHARE_SCHEMA = 1;
  function ymPlan() {
    var q = state.q;
    return {
      v: YM_SHARE_SCHEMA, s: q.start, e: q.end, p: qPax(), r: q.regions.slice(), c: q.custom || '',
      vh: q.veh, g: q.glang, h: q.hotel, sv: q.svc,
      o: { priv: !!q.priv, no: !!q.threeNo, mice: !!q.mice, gala: !!q.gala, meet: !!q.meet },
      pace: q.pace, style: q.style, fl: q.flight, care: q.care, b: q.budget, n: ymSplitN(),
      t: topPicked().map(function (x) { return [x.id, x.day]; })
    };
  }
  function ymB64(str) {
    try {
      return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    } catch (e) { return ''; }
  }
  function ymUnb64(str) {
    try {
      var s = String(str).replace(/-/g, '+').replace(/_/g, '/');
      while (s.length % 4) s += '=';
      return atob(s);
    } catch (e) { return ''; }
  }
  function ymShareCode() { return ymB64(JSON.stringify(ymPlan())); }
  function ymShareUrl() {
    return (BRAND.siteUrl || 'https://memberstourkorea.com/').replace(/\/+$/, '') + '/#quote/plan=' + ymShareCode();
  }
  function ymApplyPlan(code) {
    var raw = ymUnb64(code), d = null;
    try { d = JSON.parse(raw); } catch (e) { d = null; }
    if (!d || d.v !== YM_SHARE_SCHEMA) return false;
    var q = state.q;
    q.start = d.s || q.start; q.end = d.e || q.end;
    if (d.p) q.pax = d.p;
    if (Array.isArray(d.r) && d.r.length) q.regions = d.r;
    q.custom = d.c || '';
    if (d.vh) q.veh = d.vh;
    if (d.g) q.glang = d.g;
    if (d.h) q.hotel = d.h;
    if (d.sv) q.svc = d.sv;
    if (d.o) { q.priv = !!d.o.priv; q.threeNo = !!d.o.no; q.mice = !!d.o.mice; q.gala = !!d.o.gala; q.meet = !!d.o.meet; }
    if (d.pace) q.pace = d.pace;
    if (d.style) q.style = d.style;
    if (d.fl) q.flight = d.fl;
    if (d.care) q.care = d.care;
    if (d.b) q.budget = d.b;
    if (d.n) q.splitN = d.n;
    if (Array.isArray(d.t)) {
      q.topics = d.t.filter(function (x) { return x && topFind(x[0]); })
        .map(function (x) { return { id: x[0], day: x[1] || 1, auto: false }; });
    }
    return true;
  }
  function ymShareCopy() {
    var url = ymShareUrl();
    var ok = function () { toast(t('ym.share.copied')); };
    var bad = function () {
      var ta = $('#qShare');
      if (ta) { ta.hidden = false; ta.value = url; ta.focus(); ta.select(); }
      toast(t('ym.share.fail'));
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(ok, bad);
      return;
    }
    try {
      var ta2 = document.createElement('textarea');
      ta2.value = url;
      ta2.setAttribute('readonly', 'readonly');
      ta2.style.position = 'fixed';
      ta2.style.left = '-9999px';
      document.body.appendChild(ta2);
      ta2.select();
      var done = document.execCommand('copy');
      document.body.removeChild(ta2);
      if (done) ok(); else bad();
    } catch (e2) { bad(); }
  }
  /* 1/N split of the same estimate */
  function ymSplitN() {
    var pax = qPax();

    if (n < 2 || n > pax) n = pax;
    return n;
  }

  /* A whole tour product as one printable sheet. photoUri is a data: URI for the
     saved file, or the relative images/ path the page itself can print. */
  function tourSheet(x, photoUri) {
    var title = tourTitle(x);
    var hls = tourHl(x);
    var meta = [x.code, I18N['ob.filter.' + x.region] ? t('ob.filter.' + x.region) : catLabel(x.cat), durText(x)];
    if (!x.partner && x.rating) meta.push('★ ' + Number(x.rating).toFixed(1) + ' (' + x.reviews + ')');
    if (x.partner) meta.push(t('badge.partner'));
    if (x.popular) meta.push(t('badge.popular'));
    (x.badges || []).forEach(function (b) { meta.push(t('badge.' + b)); });
    var facts = [
      [t('detail.duration'), durText(x)],
      [t('detail.region'), I18N['ob.filter.' + x.region] ? t('ob.filter.' + x.region) : (x.regionLabel || '')],
      [t('detail.group'), t('detail.groupSize', { n: x.group || 0 })],
      [x.partner ? t('detail.supplier') : t('detail.pickup'), x.partner ? ((x.supplier && x.supplier.company) || '') : tourPickup(x)]
    ];
    if (x.priceLabel) facts.push([t('tours.from'), tourPriceText(x)]);
    var factsHtml = facts.map(function (row) {
      return '<div><dt>' + esc(row[0]) + '</dt><dd>' + esc(row[1]) + '</dd></div>';

      ? '<div class="ps-hero"><img class="ps-hero-img" src="' + photoUri + '" alt=""></div>'

    var itin = '';
    var days = tourItin(x);
    if (days.length) {
      itin = '<section class="ps-sec"><h2>' + esc(t('detail.itinerary')) + '</h2><ol class="ps-itin">' +
        days.map(function (d, i) {
          var body = d.title ? d.title + (d.items && d.items.length ? ' — ' + d.items.join(' · ') : '') : (d.items || []).join(' · ');
          return '<li><span class="ps-d">D' + (d.n || i + 1) + '</span><span>' + esc(body) + '</span></li>';
        }).join('') + '</ol></section>';

    var flights = (x.flights && x.flights.length)
      ? '<section class="ps-sec"><h2>' + esc(t('ph.f.flights')) + '</h2><ul class="ps-list">' +
        x.flights.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul></section>'
      : '';
    var incList = tourIncList(x);
    var inc = incList.map(function (v) { return '<li>' + esc(v) + '</li>'; }).join('');
    var exc = (x.excludeText && x.excludeText.length)

      '<div class="ps-title"><span class="ps-eyebrow">' + esc(meta.join(' · ')) + '</span>' +

      hero +

      '<p>' + esc(tourDesc(x)) + '</p></section>' +
      '<dl class="ps-facts">' + factsHtml + '</dl></div>' +
      (hls.length ? '<section class="ps-sec"><h2>' + esc(t('detail.highlights')) + '</h2><ul class="ps-list">' +
        hls.map(function (h) { return '<li>' + esc(h) + '</li>'; }).join('') + '</ul></section>' : '') +
      flights + itin +

      '<ul class="ps-list">' + inc + '</ul></section>' +
      '<section class="ps-sec"><h2>' + esc(t('print.notIncluded')) + '</h2>' +
      '<ul class="ps-list exc">' + exc + '</ul></section></div>' +
      '<div class="ps-price"><div><small>' + esc(x.priceLabel ? '' : t('tours.from')) + '</small><b>' + esc(tourPriceText(x)) + '</b>' +
      '<em>' + esc(x.priceLabel ? '' : t('tours.perPerson')) + '</em></div>' +

      psFoot() + '</div>';

  /* The custom TATINTA-style plan: scope, dates, the day-by-day schedule built
     from the selected toppings, and the itemised estimate. */
  function quoteSheet() {
    var q = state.q, c = qCalc(), sched = topSchedule();
    var scope = [];
    if (q.svc.vehicle) {
      var v = qVehicle(q.veh);
      var vn = Math.max(1, Math.ceil(c.pax / v.seats));
      scope.push(t('quote.svc.vehicle') + ' — ' + t('quote.veh.' + v.key) + ' × ' + vn);
    }
    if (q.svc.guide) scope.push(t('quote.svc.guide') + ' — ' + qLangLabel(q.glang));
    if (q.svc.hotel && c.nights > 0) {
      scope.push(t('quote.svc.hotel') + ' — ' + t('quote.hotel.' + q.hotel) + ' · ' +
        t('unit.nights', { n: c.nights }));
    }
    ['mice', 'gala', 'meet'].forEach(function (opt) { if (q[opt]) scope.push(t('quote.opt.' + opt)); });
    var scopeHtml = scope.length
      ? '<ul class="ps-list">' + scope.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul>'
      : '<p>' + esc(t('quote.est.empty')) + '</p>';
    var daysHtml = sched.map(function (d) {
      var rows = d.rows.map(function (r) {
        return '<tr><td class="ps-t">' + fmtTime(r.start) + '–' + fmtTime(r.end) + '</td>' +
          '<td>' + esc(t('topping.' + r.id)) + '</td>' +
          '<td>' + esc(t('quote.top.cat.' + r.tp.cat)) + '</td>' +
          '<td class="num">' + (r.tp.krw ? money(topAmount(r.tp)) : esc(t('quote.top.free'))) + '</td></tr>';
      }).join('');
      var head = '<div class="ps-day-h"><b>' + esc(t('quote.top.day', { n: d.day })) + '</b>' +
        (d.date ? '<span>' + esc(d.date) + '</span>' : '') +
        (d.rows.length
          ? '<span>' + esc(t(d.rows.length === 1 ? 'quote.iti.dayTotalOne' : 'quote.iti.dayTotal',
              { n: d.rows.length, d: fmtDur(d.mins) })) + '</span>'
          : '') + '</div>';
      return '<div class="ps-day">' + head +
        (d.rows.length ? '<table class="ps-tbl"><tbody>' + rows + '</tbody></table>'
          : '<p class="ps-free">' + esc(t('quote.iti.freeDay')) + '</p>') + '</div>';
    }).join('');
    var estRows = c.lines.map(function (l) {
      return '<tr><td>' + esc(l.label) + '</td><td class="num">' + money(l.amount) + '</td></tr>';
    }).join('');
    var estHtml = c.lines.length
      ? '<table class="ps-tbl ps-est"><tbody>' + estRows + '</tbody>' +
        '<tfoot><tr><td>' + esc(t('quote.est.total')) + '</td><td class="num">' + money(c.total) + '</td></tr></tfoot></table>' +
        '<p class="ps-per">' + esc(t('quote.est.perPax', { v: money(c.perPax) })) + '</p>' +
        '<p class="ps-note">' + esc(t('quote.est.note')) + '</p>'
      : '<p>' + esc(t('quote.est.empty')) + '</p><p class="ps-note">' + esc(t('quote.est.note')) + '</p>';
    var meta = [t('quote.sum.dates') + ': ' + (q.start ? fmtDate(q.start, true) : '—') + ' → ' +
      (q.end ? fmtDate(q.end, true) : '—') + ' (' + t('quote.days', { n: c.days }) + ' · ' +
      t('quote.nights', { n: c.nights }) + ')',
      t('quote.sum.pax') + ': ' + c.pax + ' ' + t('quote.paxUnit'),
      t('quote.sum.regions') + ': ' + qRegionsOf(q).join(', ')];
    var contact = [q.agency, q.name, q.email, q.phone].filter(function (s) {
      return s && String(s).trim();
    }).join(' · ');
    return '<div class="ps">' + psHead(t('print.doc.quote')) +
      '<div class="ps-title"><span class="ps-eyebrow">' + esc(t('print.doc.quote')) + '</span>' +
      '<h1>' + esc(t('quote.bookingTitle')) + '</h1>' +
      '<p class="ps-sub">' + esc(meta.join('  ·  ')) + '</p></div>' +
      '<div class="ps-cols"><section class="ps-sec"><h2>' + esc(t('quote.sum.scope')) + '</h2>' + scopeHtml +
      '</section><section class="ps-sec"><h2>' + esc(t('quote.sum.contact')) + '</h2>' +
      '<p>' + (contact ? esc(contact) : esc(t('print.web') + ': ' + siteHost())) + '</p>' +
      (q.notes ? '<p class="ps-note">' + esc(q.notes) + '</p>' : '') + '</section></div>' +
      '<section class="ps-sec"><h2>' + esc(t('quote.iti.title')) + '</h2>' + daysHtml + '</section>' +
      '<section class="ps-sec"><h2>' + esc(t('quote.est.title')) + '</h2>' + estHtml + '</section>' +
      psFoot() + '</div>';
  }

  function fileSlug(s) {
    var out = String(s == null ? '' : s).replace(/[^A-Za-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
    if (out.length > 48) {
      out = out.slice(0, 48);
      out = out.replace(/_+[^_]*$/, '');
    }
    return out || 'MEMBERS_Tour';
  }

  /* Fill #printSheet with the current product or plan, then hand over to the
     browser's own print dialogue (where "Save as PDF" lives). The screen is
     never touched: #printSheet only exists inside @media print. */
  function printDoc(kind, id) {
    var sheet = $('#printSheet');
    if (!sheet) return;
    var title, html;
    if (kind === 'tour') {
      var x = findTour(id);
      if (!x) return;
      title = tourTitle(x);
      html = tourSheet(x, PHOTOS['tour:' + x.id] || '');
    } else {
      title = t('quote.bookingTitle');
      html = quoteSheet();
    }
    sheet.innerHTML = html;
    var img = sheet.querySelector('img.ps-hero-img');
    var fired = false;
    var fire = function () {
      if (fired) return;
      fired = true;
      var prev = document.title;
      document.title = title + ' · MEMBERS Tour';
      try { window.print(); } catch (e) { /* printing blocked — the sheet stays for later */ }
      document.title = prev;
      toast(t('print.toast'));
    };
    if (img && !img.complete) {
      img.onload = fire;
      img.onerror = fire;
      setTimeout(fire, 1400);
    } else {
      fire();
    }
  }

  function saveFile(name, text) {
    try {
      var blob = new Blob([text], { type: 'text/html;charset=utf-8' });
      if (window.navigator && window.navigator.msSaveOrOpenBlob) {
        window.navigator.msSaveOrOpenBlob(blob, name);
        return true;
      }
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      a.rel = 'noopener';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        if (a.parentNode) a.parentNode.removeChild(a);
        URL.revokeObjectURL(url);
      }, 5000);
      return true;
    } catch (e) {
      return false;
    }
  }

  /* Embed the tour photograph so the downloaded file stays whole offline.
     If the browser refuses (file://, CORS, no network) we fall back to the
     clean gradient header — the file must always download. */
  function embedPhoto(src, cb) {
    if (!src) { cb(''); return; }
    /* file:// blocks XHR (the browser calls it cross-origin), so a locally saved
       copy simply gets the clean gradient header instead of a broken image. */
    if (location.protocol !== 'http:' && location.protocol !== 'https:') { cb(''); return; }
    var done = false;
    var finish = function (uri) {
      if (done) return;
      done = true;
      cb(uri || '');
    };
    var timer = setTimeout(function () { finish(''); }, 1600);
    try {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', src, true);
      xhr.responseType = 'blob';
      xhr.onload = function () {
        clearTimeout(timer);
        var blob = xhr.response;
        if (!blob || (xhr.status && xhr.status !== 200)) { finish(''); return; }
        /* the server may hand .webp back as octet-stream — label it so the
           data URI is an image the saved file can actually render */
        var typed = blob;
        try { typed = new Blob([blob], { type: 'image/webp' }); } catch (e2) { typed = blob; }
        var fr = new FileReader();
        fr.onload = function () {
          var uri = String(fr.result || '');
          finish(uri.indexOf('data:image/') === 0 ? uri : '');
        };
        fr.onerror = function () { finish(''); };
        fr.readAsDataURL(typed);
      };
      xhr.onerror = function () { clearTimeout(timer); finish(''); };
      xhr.send();
    } catch (e) {
      clearTimeout(timer);
      finish('');
    }
  }

  /* The tour photograph is fetched once per product while the guest is reading
     the detail sheet, so the saved brochure can embed it without breaking the
     tap-triggered download that iOS and Android browsers insist on. */
  var PHOTO_URI = {};
  function prefetchPhoto(id) {
    var src = PHOTOS['tour:' + id];
    if (!src) { PHOTO_URI[id] = ''; return; }
    PHOTO_URI[id] = '';
    embedPhoto(src, function (uri) { PHOTO_URI[id] = uri || ''; });
  }
  function photoUri(id) {
    var v = PHOTO_URI[id];
    return typeof v === 'string' ? v : '';
  }

  function downloadDoc(kind, id) {
    var x = null, title, name, uri = '';
    if (kind === 'tour') {
      x = findTour(id);
      if (!x) return;
      title = tourTitle(x);
      name = 'MEMBERS_Tour_' + fileSlug(tourTitle(x)) + '.html';
      uri = photoUri(x.id);
      if (PHOTO_URI[x.id] === undefined) prefetchPhoto(x.id);  /* ready for the next tap */
    } else {
      title = t('quote.bookingTitle');
      name = 'MEMBERS_Tour_Custom_Itinerary_' + (state.q.start || iso(new Date())) + '.html';
    }
    /* saved inside the tap itself, so mobile browsers keep the user gesture */
    var ok = saveFile(name, docHTML(kind === 'tour' ? tourSheet(x, uri) : quoteSheet(), title));
    toast(ok ? t('dl.toast', { name: name }) : t('dl.fail'));
  }

  function toolsCard(kind, tourId) {
    var note = t(kind === 'tour' ? 'print.tools.tour' : 'print.tools.quote');
    var act1 = kind === 'tour' ? 'print-tour' : 'print-quote';

  /* ------------------------------------------------- travel insurance */
  /* Demo tariff sheet — KRW per person per day. Illustrative only: the insurer
     confirms the final premium and terms when the certificate is issued. */
  var INS_PLANS = [
    { key: 'standard', base: 2900, ben: [['medical', 30000000], ['baggage', 1000000]] },
    { key: 'premium', base: 4800, popular: true, ben: [['medical', 50000000], ['liability', 100000000], ['delay', 100000]] },
    { key: 'activity', base: 6500, ben: [['medical', 50000000], ['liability', 100000000], ['activity', 0]] }
  ];

  function insPlan(key) {
    for (var i = 0; i < INS_PLANS.length; i++) if (INS_PLANS[i].key === key) return INS_PLANS[i];
    return INS_PLANS[0];
  }
  /* inclusive cover period: arrival day + every day up to the departure day */
  function insDays() {
    var a = state.ins.arrive, d = state.ins.depart;
    if (!a || !d) return 0;
    var t1 = new Date(a + 'T00:00:00'), t2 = new Date(d + 'T00:00:00');
    if (isNaN(t1.getTime()) || isNaN(t2.getTime())) return 0;
    var n = Math.round((t2.getTime() - t1.getTime()) / 86400000) + 1;
    return n >= 1 ? n : 0;
  }
  function insCalc() {
    var p = insPlan(state.ins.plan);
    var days = insDays();
    var pax = Math.max(1, Math.min(10, parseInt(state.ins.pax, 10) || 1));
    var disc = pax >= 10 ? 0.10 : (pax >= 5 ? 0.05 : 0);
    var perPerson = days > 0 ? Math.round(p.base * days * (1 - disc)) : 0;
    return { plan: p, days: days, pax: pax, disc: disc, perPerson: perPerson, total: perPerson * pax };
  }

  function insPlanCard(p) {
    var on = state.ins.plan === p.key;
    var ben = p.ben.map(function (b) {

        (b[1] ? '<b>' + money(b[1]) + '</b>' : '') + '</li>';

    return '<button type="button" class="ins-plan' + (on ? ' on' : '') + '" data-act="ins-plan" data-p="' + p.key + '" aria-pressed="' + (on ? 'true' : 'false') + '">' +
      '<span class="ins-plan-top"><span class="adot">' + ic.check + '</span>' +
      '<h4>' + t('ins.plan.' + p.key) + '</h4>' +
      (p.popular ? '<span class="ins-tag">' + t('ins.plan.popular') + '</span>' : '') +
      '<span class="ins-rate"><b>' + money(p.base) + '</b><small>' + t('ins.rateUnit') + '</small></span></span>' +
      '<span class="ins-desc">' + t('ins.plan.' + p.key + '.d') + '</span>' +
      '<ul class="ins-ben">' + ben + '</ul></button>';
  }

  function copyIns(ref) {
    var b = null;
    for (var i = 0; i < state.bookings.length; i++) if (state.bookings[i].ref === ref) b = state.bookings[i];
    var text = b ? insSummary(b) : '';
    var reveal = function () {
      var ta = $('#insSumModal');
      if (ta) { ta.hidden = false; ta.value = text; ta.focus(); ta.select(); }
    };
    var ok = function () { toast(t('ins.copied')); };
    var bad = function () { reveal(); toast(t('quote.copyFail')); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, bad);
      return;
    }
    try {
      var ta2 = document.createElement("textarea");
      ta2.value = text;
      ta2.setAttribute('readonly', 'readonly');
      ta2.style.position = 'fixed';
      ta2.style.left = '-9999px';
      document.body.appendChild(ta2);
      ta2.select();
      var done = document.execCommand('copy');
      document.body.removeChild(ta2);
      if (done) ok(); else bad();
    } catch (e2) { bad(); }
  }

  function pApplyExtract(ex, res) {
    var p = state.p;
    p.detected = ex.scope;
    p.scope = ex.scope;
    p.region = ex.region;
    if (ex.title) p.title = ex.title;
    if (ex.days || ex.nights) { p.nights = ex.nights; p.days = ex.days || ex.nights + 1; }
    p.flights = (ex.flights || []).join('\n');
    p.daysItin = (ex.itinerary || []).slice(0, 15).map(function (d) {
      return { title: d.title || '', items: (d.items || []).slice(0, 14) };
    });
    if (!p.daysItin.length) p.daysItin = [{ title: '', items: [] }];
    p.inc = (ex.includes || []).join('\n');
    p.exc = (ex.excludes || []).join('\n');
    if (ex.photo) p.photo = ex.photo;
    p.net = ex.price ? String(ex.price) : '';
    if (!p.code) p.code = 'PT-' + iso(new Date()).replace(/-/g, '') + '-01';
    p.fileName = (res && res.name) || p.fileName;
    p.chars = (res && res.chars) || 0;
  }
  function pHandleFile(file) {
    if (!file) return;
    pStatus(t('ph.reading', { name: file.name }), false);
    if (!window.MTA_PARSE) { pStatus(t('ph.readFail'), true); return; }
    window.MTA_PARSE.readFile(file).then(function (res) {
      var ex = window.MTA_PARSE.extract(res.text);
      pApplyExtract(ex, res);
      renderView('partner');
      pStatus(t('ph.readOk', { n: res.chars, name: res.name }), false);
      pPaintMoney();
    }).catch(function (err) {
      var code = (err && err.code) || 'readFail';
      pStatus(code === 'tooBig' ? t('ph.tooBig') : code === 'xls' ? t('ph.readXls')
        : code === 'type' ? t('ph.err.file') : t('ph.readFail'), true);
    });
  }
  function pLoadSample(id) {
    var sm = null, list = DATA.samples || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) sm = list[i];
    if (!sm || !window.MTA_PARSE) return;
    var ex = window.MTA_PARSE.extract(sm.text);
    pApplyExtract(ex, { name: t('ph.sample.' + sm.id), chars: sm.text.length });
    renderView('partner');
    pStatus(t('ph.readOk', { n: sm.text.length, name: t('ph.sample.' + sm.id) }), false);
    pPaintMoney();

  /* ---- storage adapter (localStorage now, Supabase-ready) ---- */
  function lvSbOn() { return !!(SUPABASE_CONFIG.url && SUPABASE_CONFIG.anonKey); }
  function lvSbUrl(path) {
    return String(SUPABASE_CONFIG.url).replace(/\/+$/, '') + '/rest/v1/' + SUPABASE_CONFIG.table + (path || '');
  }
  function lvSbSend(method, path, body, prefer) {
    if (!lvSbOn() || !window.fetch) return;
    try {
      fetch(lvSbUrl(path), {
        method: method,
        headers: {
          'apikey': SUPABASE_CONFIG.anonKey,
          'Authorization': 'Bearer ' + SUPABASE_CONFIG.anonKey,
          'Content-Type': 'application/json',
          'Prefer': prefer || 'return=minimal'
        },
        body: body ? JSON.stringify(body) : undefined
      }).catch(function () { /* offline cache keeps working */ });
    } catch (e) { /* ignore */ }
  }
  /* item (camelCase, used by the UI) <-> row (snake_case, the Supabase table) */
  function lvRow(x) {
    return {
      id: x.id, status: x.status, type: x.type, cat: x.cat, creator: x.creator || '',
      contact: x.contact || '', title: x.title || '', desc: x.desc || '',
      url: x.url || '', yt: x.yt || '', platform: x.platform || '',
      title_key: x.titleKey || null, desc_key: x.descKey || null,
      upcoming: !!x.upcoming, source: x.source || '', seed: !!x.seed,
      created_at: x.createdAt || new Date().toISOString(), decided_at: x.decidedAt || null
    };
  }
  function lvItem(r) {
    return {
      id: r.id, status: r.status, type: r.type, cat: r.cat, creator: r.creator || '',
      contact: r.contact || '', title: r.title || '', desc: r.desc || '',
      url: r.url || '', yt: r.yt || '', platform: r.platform || '',
      titleKey: r.title_key || '', descKey: r.desc_key || '',
      upcoming: !!r.upcoming, source: r.source || '', seed: !!r.seed,
      createdAt: r.created_at || '', decidedAt: r.decided_at || ''
    };
  }
  function lvStoreRead() {
    var raw = readStore(VIDEO_KEY, null);
    if (!raw || !raw.list || !raw.list.length) {
      var seed = { schema: VIDEO_SCHEMA, list: lvSeeds() };
      writeStore(VIDEO_KEY, seed);
      return seed.list;
    }
    return raw.list;
  }
  function lvStoreWrite(list) { writeStore(VIDEO_KEY, { schema: VIDEO_SCHEMA, list: list }); }
  function lvAll() { return lvStoreRead().slice(); }
  function lvById(id) {
    var list = lvAll();
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function lvByStatus(status) {
    return lvAll().filter(function (x) { return x.status === status; });
  }
  function lvApproved() { return lvByStatus('approved'); }
  function lvPut(item) {
    var list = lvAll(), hit = false;
    for (var i = 0; i < list.length; i++) if (list[i].id === item.id) { list[i] = item; hit = true; }
    if (!hit) list.unshift(item);
    lvStoreWrite(list);
    lvSbSend('POST', '?on_conflict=id', lvRow(item), 'resolution=merge-duplicates,return=minimal');
  }
  function lvRemove(id) {
    var list = lvAll().filter(function (x) { return x.id !== id; });
    lvStoreWrite(list);
    lvSbSend('DELETE', '?id=eq.' + encodeURIComponent(id));
  }
  function lvPull() {
    if (!lvSbOn() || !window.fetch) return Promise.resolve(false);
    var ctrl = null;
    try { ctrl = new AbortController(); } catch (e) { /* older browser */ }
    return fetch(lvSbUrl('?select=*&order=created_at.desc'), {
      headers: { 'apikey': SUPABASE_CONFIG.anonKey, 'Authorization': 'Bearer ' + SUPABASE_CONFIG.anonKey }
    }).then(function (r) {
