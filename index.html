/* =====================================================================
   BRAND PALETTE — swap these values to match the company letterhead.
   Everything else in the design reads from these variables.

:root{

}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{

}
img,svg{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}

h1,h2,h3,h4,p{margin:0}
ul{margin:0;padding:0;list-style:none}
input,select,textarea{font:inherit;color:inherit}
.container{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 16px}

/* ---------------- header ---------------- */
.app-header{
  position:sticky;top:0;z-index:40;
  background:rgba(255,255,255,.94);

.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
/* logo slot: replaced by <img> when BRAND.logoImage is set */
.brand-mark{width:40px;height:40px;flex:0 0 40px;border-radius:50%;overflow:hidden;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 1px rgba(22,78,99,.10)}
.brand-mark svg{width:100%;height:100%}
.brand-mark img{width:100%;height:100%;object-fit:cover;background:#fff}
.brand-text{min-width:0;line-height:1.15}
.brand-text strong{display:block;font-size:16px;letter-spacing:-.02em;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

/* ---------------- channel bar (항공 · 호텔 · 투어 channel switcher) ---------------- */
.channel-bar{
  position:relative;z-index:30;
  background:linear-gradient(112deg,#08222F 0%,#0F3B4C 40%,#164E63 68%,#1B5E96 100%);

}

}
.channel-item{

.channel-item:hover{background:rgba(255,255,255,.15);color:#fff}

.channel-item .ch-s{display:none;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.channel-item .ch-sub{font-size:10px;font-weight:600;color:#9FBECC;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.channel-item.on{

.channel-item.on .ch-ico{background:linear-gradient(135deg,var(--teal-2),var(--teal));color:#fff}
.channel-item.on .ch-sub{color:#4B6B7C}

/* nine channels fill a five-column grid on desktop; on phones the ninth
   (My trips) lives in the bottom navigation instead, so the strip keeps its
   even four-by-two grid and stays above the fold. */

  .channel-inner{grid-template-columns:repeat(5,1fr)}
}

.grid{display:grid;gap:16px;grid-template-columns:1fr}

.card-body{padding:14px 15px 16px;display:flex;flex-direction:column;gap:9px;flex:1}

.card-top .sep{width:3px;height:3px;border-radius:50%;background:#C3CEDA}

/* ---------------- search panels ---------------- */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:14px}

.trip-toggle button.on{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(11,34,57,.14)}
.field-grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}

  padding-right:30px;

.field input[type=number]{-moz-appearance:textfield;appearance:textfield}.field input[type=number]::-webkit-outer-spin-button,.field input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.live-badge{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;max-width:100%;font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#CFF3EC;background:rgba(56,163,157,.22);border:1px solid rgba(56,163,157,.55);border-radius:999px;padding:4px 9px;line-height:1.3}
.live-badge svg{width:12px;height:12px;flex:0 0 12px}
.live-cta{display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;min-height:46px;padding:11px 13px;border-radius:13px;background:linear-gradient(135deg,#38A39D,#2A8C82);color:#fff;font-size:13.5px;font-weight:800;line-height:1.3;text-align:center;text-decoration:none;box-shadow:0 8px 20px rgba(14,124,123,.34)}
.live-cta span{min-width:0}
.live-cta:hover{filter:brightness(1.06)}
.live-cta svg{width:16px;height:16px;flex:0 0 16px}
.live-note{margin:0;font-size:10.5px;line-height:1.45;color:rgba(255,255,255,.62)}
.live-mini{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--teal);text-decoration:none;min-width:0;overflow-wrap:anywhere}
.live-mini svg{width:13px;height:13px;flex:0 0 13px}
.live-mini:hover{color:var(--navy)}
.live-strip{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;padding:10px 12px;border:1px solid #CFE7E2;background:#F1FAF8;border-radius:12px;min-width:0}
.live-strip .ls-t{display:flex;align-items:center;gap:6px;min-width:0;font-size:12px;font-weight:700;color:var(--navy)}
.live-strip .ls-t svg{width:14px;height:14px;flex:0 0 14px;color:var(--teal)}
.live-strip .btn svg{width:14px;height:14px}
.results-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 10px;flex-wrap:wrap}
.results-head h3{font-size:15px;color:var(--navy);letter-spacing:-.01em}
.results-head .sub{font-size:12px;color:var(--muted);margin-top:2px}
.sort-row{display:flex;gap:6px}
.sort-row button{font-size:12px;font-weight:700;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted)}
.sort-row button.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* ---------------- flight card ---------------- */
.flight{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:14px;display:flex;flex-direction:column;gap:12px}
.flight-top{display:flex;align-items:center;gap:10px}
.airline-logo{width:34px;height:34px;border-radius:10px;background:#EEF3F8;display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--navy);letter-spacing:.02em;flex:0 0 34px}
.flight-top .airline{font-size:13px;font-weight:700;color:var(--navy)}
.flight-top .fno{font-size:11px;color:var(--muted);margin-top:1px}
.flight-top .tag{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--teal);background:#E9F5F2;padding:4px 8px;border-radius:999px}
.route{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.route .t{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-.02em;line-height:1.1}
.route .ap{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.route .mid{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);font-weight:600}
.route .line{width:100%;height:2px;background:linear-gradient(90deg,#D7E1EC,#9FB6C9,#D7E1EC);border-radius:2px;position:relative}
.route .line::before,.route .line::after{content:"";position:absolute;top:50%;width:5px;height:5px;border-radius:50%;background:#8FA9BF;transform:translateY(-50%)}
.route .line::before{left:0}.route .line::after{right:0}
.route .arr{text-align:right}
.flight-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px dashed var(--line);padding-top:11px}
.flight-bottom .price b{font-size:19px}
.btn-sm{height:40px;padding:0 16px;border-radius:12px;font-size:13.5px;font-weight:700}

/* ---------------- hotel card ---------------- */
.hotel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);display:flex;flex-direction:column}
.hotel-cover{position:relative;aspect-ratio:16/7;background:var(--navy)}
.hotel-cover .art{width:100%;height:100%;object-fit:cover;display:block}
.hotel-cover img.art{transition:transform .5s cubic-bezier(.2,.6,.2,1)}
.hotel:hover .hotel-cover img.art{transform:scale(1.04)}
.hotel-cover .stars{position:absolute;top:10px;left:12px;display:flex;gap:2px}
.hotel-cover .stars svg{width:13px;height:13px;color:var(--accent);filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.hotel-body{padding:13px 15px 15px;display:flex;flex-direction:column;gap:10px}
.hotel-body h3{font-size:16px;color:var(--navy);letter-spacing:-.015em;font-weight:800;line-height:1.3}
.hotel-area{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.hotel-area svg{width:12px;height:12px}
.amenities{display:flex;flex-wrap:wrap;gap:6px}
.amenity{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#4A5A72;background:#F3F6FA;border-radius:999px;padding:4px 8px}
.amenity svg{width:12px;height:12px;color:var(--teal)}
.hotel-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-top:1px dashed var(--line);padding-top:11px;margin-top:auto}
.breakfast-flag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--ok);background:#EAF7F1;border-radius:8px;padding:4px 8px;width:max-content}
.breakfast-flag svg{width:12px;height:12px}

/* ---------------- rooms / modal content ---------------- */
.room-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.room-row:last-child{border-bottom:0}
.room-row .rn{font-size:14px;font-weight:700;color:var(--navy)}
.room-row .rd{font-size:11.5px;color:var(--muted);margin-top:2px}
.room-row .rp{text-align:right;flex:0 0 auto}
.room-row .rp b{display:block;font-size:15px;color:var(--navy)}
.room-row .rp small{font-size:10.5px;color:var(--muted)}
.m-hd{position:relative}
.m-hd .cover{aspect-ratio:16/8;border-radius:0}
.m-hd .m-close{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;color:var(--navy);box-shadow:var(--shadow-sm);z-index:3}
.m-hd .m-close svg{width:17px;height:17px}
/* back button: one tap returns to the previous screen (and the browser history too) */
.m-back{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 12px 0 9px;border-radius:999px;background:#EEF3F8;color:var(--navy);font-size:12.5px;font-weight:800;letter-spacing:-.01em}
.m-back svg{width:16px;height:16px}
.m-back:active{transform:scale(.97)}
.m-back-float{position:absolute;top:12px;left:12px;z-index:3;background:rgba(255,255,255,.96);box-shadow:var(--shadow-sm)}
.m-bar{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:8px;padding:9px 12px;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.m-bar-t{flex:1 1 auto;min-width:0;font-size:12.5px;font-weight:800;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.m-close-lite{width:34px;height:34px;border-radius:50%;background:#EEF3F8;display:grid;place-items:center;color:var(--navy);flex:0 0 34px}
.m-close-lite svg{width:16px;height:16px}
.itin-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.itin-list li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.45;color:#2B3A4C;background:#F6F9FB;border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.itin-list .d{flex:0 0 34px;font-size:11px;font-weight:800;letter-spacing:.04em;color:#fff;background:linear-gradient(135deg,var(--teal-2),var(--teal));border-radius:8px;padding:3px 0;text-align:center;margin-top:1px}
.m-body{padding:18px 18px 22px}
.m-title{font-size:20px;line-height:1.3;letter-spacing:-.02em;color:var(--navy);font-weight:800}
.m-sub{font-size:12.5px;color:var(--muted);margin-top:5px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.m-sub span{display:inline-flex;align-items:center;gap:4px}
.m-sub svg{width:13px;height:13px}
.m-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 4px}
.m-meta div{background:#F5F8FB;border-radius:12px;padding:10px 12px}
.m-meta dt{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 3px}
.m-meta dd{margin:0;font-size:13px;font-weight:700;color:var(--navy);line-height:1.35}
.m-sec{margin-top:18px}
.m-sec h4{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.hl-list li{display:flex;gap:9px;padding:5px 0;font-size:13.5px;color:#2B3A4C;line-height:1.45}
.hl-list svg{width:15px;height:15px;color:var(--teal);flex:0 0 15px;margin-top:2px}
.inc-chips{display:flex;flex-wrap:wrap;gap:6px}
.inc-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:#2B3A4C;background:#F3F6FA;border-radius:9px;padding:6px 9px}
.inc-chip svg{width:12px;height:12px;color:var(--teal)}
.m-footer{position:sticky;bottom:0;z-index:2;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;flex:0 0 auto}
.m-footer .price{flex:1}
.m-footer .btn{height:46px}
/* print / save-as-PDF and file download — a quiet pair of tools in the detail modal
   and next to the live quote, styled as secondary actions */
.m-tools,.qtools{margin-top:14px;padding:12px 13px;border:1px solid var(--line);border-radius:14px;background:#F6FAFB}
.qtools{background:#fff;box-shadow:var(--shadow-sm);margin-top:12px}
.qtools + .qcard{margin-top:12px}
.m-tools-note,.qtools-note{font-size:11.5px;line-height:1.45;color:var(--muted);margin:0 0 9px}
.m-tools-row,.qtools-row{display:flex;gap:8px}
.btn-tool{flex:1 1 0;min-width:0;height:42px;font-size:12.5px;font-weight:700;padding:0 8px;border:1px solid var(--line);background:#fff;color:var(--navy);box-shadow:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-tool:hover{background:#EDF6F5;border-color:#BFDCD8}
.btn-tool:active{transform:scale(.985)}
.form-note{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:10px}
.summary{background:#F5F8FB;border-radius:14px;padding:12px 14px;margin-top:14px;font-size:13px}
.summary .row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;color:#43536B}
.summary .row.total{border-top:1px dashed #D8E1EB;margin-top:7px;padding-top:9px;font-weight:800;color:var(--navy);font-size:14.5px}
.success{text-align:center;padding:34px 22px 26px}
.success .tick{width:64px;height:64px;border-radius:50%;background:#E9F5F2;display:grid;place-items:center;margin:0 auto 16px;color:var(--ok)}
.success .tick svg{width:30px;height:30px}
.success h3{font-size:20px;color:var(--navy);letter-spacing:-.02em}
.success p{font-size:13.5px;color:var(--muted);margin-top:7px;line-height:1.5}
.ref-box{margin:18px auto 0;max-width:320px;border:1px dashed #C9D6E3;border-radius:12px;padding:11px;background:#FBFCFE}
.ref-box small{display:block;font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.ref-box b{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:19px;letter-spacing:.12em;color:var(--navy);margin-top:3px}
.success-actions{display:flex;gap:9px;margin-top:20px}
.success-actions .btn{flex:1}

/* ---------------- bookings ---------------- */
.booking{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:14px;display:flex;flex-direction:column;gap:10px}
.booking-top{display:flex;align-items:center;gap:8px}
.type-badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:#EEF3F8;color:var(--navy)}
.type-badge svg{width:12px;height:12px}
.type-badge.quote{background:#EEF0FB;color:#39407F}
.type-badge.flight{background:#E9F1FB;color:#1D4F8C}
.type-badge.hotel{background:#FDF1E4;color:#96601B}
.type-badge.tour{background:#E9F5F2;color:#0A6A5F}
.status{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ok);display:inline-flex;align-items:center;gap:5px}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.status.cancelled{color:var(--danger)}
.booking h3{font-size:15.5px;color:var(--navy);font-weight:800;letter-spacing:-.01em;line-height:1.3}
.booking .bk-meta{display:flex;flex-wrap:wrap;gap:5px 14px;font-size:12px;color:var(--muted)}
.booking .bk-meta span{display:inline-flex;align-items:center;gap:5px}
.booking .bk-meta svg{width:12px;height:12px}
.booking-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px dashed var(--line);padding-top:10px}
.ref-mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--muted);letter-spacing:.06em}
.link-danger{font-size:12.5px;font-weight:700;color:var(--danger);padding:7px 10px;border-radius:9px;background:#FCF1F0}
.empty{text-align:center;padding:44px 20px;background:#fff;border:1px dashed #D5DFEA;border-radius:var(--radius)}
.empty .ico{width:64px;height:64px;border-radius:50%;background:#EEF3F8;display:grid;place-items:center;margin:0 auto 14px;color:#8FA5BC}
.empty .ico svg{width:28px;height:28px}
.empty h3{font-size:17px;color:var(--navy)}
.empty p{font-size:13px;color:var(--muted);margin:6px 0 16px}

/* ---------------- custom ground / MICE quote ---------------- */
.qhero{
  position:relative;overflow:hidden;color:#fff;background-color:#0B2E3C;
  background-image:
    radial-gradient(620px 300px at 88% -20%, rgba(232,130,107,.30), transparent 62%),
    radial-gradient(760px 340px at 8% -10%, rgba(56,163,157,.34), transparent 66%),
    linear-gradient(96deg, #0A2A38 0%, #10414F 56%, #16545C 100%);
}
.qhero-inner{max-width:var(--maxw);margin:0 auto;padding:30px 16px 26px;display:grid;gap:18px}
.qhero .kicker{color:#9FE3D7}
.qhero h1{font-size:25px;line-height:1.24;letter-spacing:-.03em;margin:10px 0 8px;font-weight:800;max-width:640px}
.qhero p{color:#C6D6E4;font-size:13.5px;line-height:1.6;max-width:600px}
.qhero-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.qhero-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#D7ECE8;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 10px}
.qhero-chip svg{width:12px;height:12px;color:#9FE3D7}
.qhero .btn{margin-top:18px;width:max-content}
.qwrap{display:grid;gap:16px}
.qmain{display:flex;flex-direction:column;gap:14px;min-width:0}
.qcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:15px}
.qcard-head{margin-bottom:12px}
.qstep{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.qcard h3{font-size:16px;color:var(--navy);letter-spacing:-.015em;margin-top:4px;font-weight:800}
.qhint{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45}
.qsvc{display:flex;flex-direction:column;gap:9px}
.qsvc-row{border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:#FBFCFE;transition:border-color .15s, background .15s}
.qsvc-row.on{border-color:#BFE4DD;background:#F4FAF8}
.qsvc-top{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.qbox{width:22px;height:22px;border-radius:7px;border:1.6px solid #C6D3E1;background:#fff;display:grid;place-items:center;flex:0 0 22px;color:#fff}
.qbox svg{width:14px;height:14px;opacity:0;transition:opacity .15s}
.qsvc-row.on .qbox{background:var(--teal);border-color:var(--teal)}
.qsvc-row.on .qbox svg{opacity:1}
.qsvc-top .txt{flex:1 1 auto;min-width:0}
.qsvc-top b{display:block;font-size:14px;color:var(--navy);font-weight:800;line-height:1.3}
.qsvc-top small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.qsvc-state{font-size:10.5px;font-weight:800;letter-spacing:.04em;color:#8A9AAE;white-space:nowrap;padding-top:2px}
.qsvc-row.on .qsvc-state{color:var(--teal)}
.qsvc-body{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line)}
.qsvc-body[hidden]{display:none}
.qsub-label{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.qopt-grid{display:grid;gap:7px;grid-template-columns:1fr}
.qopt{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 11px;transition:.15s}
.qopt:active{transform:scale(.99)}
.qopt.on{border-color:var(--teal);background:#EDF7F5;box-shadow:inset 0 0 0 1px rgba(42,140,130,.22)}
.qopt .qdot{width:17px;height:17px;border-radius:50%;border:1.6px solid #C6D3E1;background:#fff;flex:0 0 17px;margin-top:1px;display:grid;place-items:center;color:#fff}
.qopt .qdot svg{width:10px;height:10px;opacity:0}
.qopt.on .qdot{border-color:var(--teal);background:var(--teal)}
.qopt.on .qdot svg{opacity:1}
.qopt .otxt{flex:1 1 auto;min-width:0}
.qopt b{display:block;font-size:13px;color:var(--navy);font-weight:700;line-height:1.3}
.qopt small{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.35}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchip{font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:#40506A;white-space:nowrap}
.qchip.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 5px 12px rgba(11,34,57,.16)}
.qchip:active{transform:scale(.97)}
.qside{display:flex;flex-direction:column;gap:12px;min-width:0}
.qest{background:linear-gradient(158deg,#0F3D4B 0%,#0A2A36 100%);color:#fff;border-radius:var(--radius);padding:16px;box-shadow:0 14px 30px rgba(8,32,44,.22)}
.qest-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.qest-head h3{font-size:14px;font-weight:800;letter-spacing:-.01em}
.qest-head span{font-size:10.5px;color:#9FE3D7;font-weight:700}
.qest-lines{display:flex;flex-direction:column;gap:6px;margin:12px 0 10px;font-size:11.5px;color:#C6D6E4;line-height:1.4}
.qest-line{display:flex;justify-content:space-between;gap:10px}
.qest-line span:first-child{min-width:0}
.qest-line b{font-weight:700;color:#fff;white-space:nowrap}
.qest-total{border-top:1px solid rgba(255,255,255,.18);padding-top:10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.qest-total small{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#9FE3D7}
.qest-total b{font-size:21px;letter-spacing:-.02em}
.qest-per{font-size:11.5px;color:#9FE3D7;margin-top:3px}
.qest-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:#A9BFCE;margin-top:8px}
.qest-note{display:flex;gap:6px;font-size:10.5px;line-height:1.5;color:#A9BFCE;background:rgba(255,255,255,.06);border-radius:10px;padding:8px 10px;margin-top:12px}
.qest-note svg{width:13px;height:13px;flex:0 0 13px;color:#9FE3D7;margin-top:1px}
.qest-empty{font-size:12.5px;color:#C6D6E4;padding:8px 0}
.qsend{padding-bottom:8px}
.qsend .field-grid{grid-template-columns:1fr 1fr}
.qsend .field.full{grid-column:1/-1}
.qsend .btn{margin-top:12px}
.qbtn-pair{display:flex;gap:8px;margin-top:9px}
.qbtn-pair .btn{flex:1 1 0;min-width:0;height:42px;font-size:12.5px;padding:0 10px}
.qcard .field[hidden]{display:none}
.success .qsum{min-height:0;margin-top:14px;text-align:left;font-size:11px;line-height:1.55;resize:none;overflow:auto}
.qsum{width:100%;margin-top:10px;min-height:96px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.5;border:1px dashed #C9D6E3;border-radius:12px;background:#FBFCFE;color:#3A4A5F;padding:10px;resize:vertical}

/* ---------------- attraction toppings & day-by-day itinerary ---------------- */
.qtop-regions{padding-top:2px;margin-bottom:4px}
.qtop-grid{display:grid;gap:9px;grid-template-columns:1fr}
.qtop-card{border:1px solid var(--line);background:#FBFCFE;border-radius:14px;padding:11px 12px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .15s,background .15s}
.qtop-card.on{border-color:var(--teal);background:#F2FAF8;box-shadow:inset 0 0 0 1px rgba(42,140,130,.18)}
.qtop-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.qtop-cat{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 8px;background:#EEF3F8;color:#40506A;white-space:nowrap}
.qtop-cat svg{width:11px;height:11px}
.qtop-cat.landmark{background:#E9F1FB;color:#1D4F8C}
.qtop-cat.culture{background:#EEF0FB;color:#39407F}
.qtop-cat.nature{background:#E7F5EA;color:#1F6B3A}
.qtop-cat.experience{background:#FDEDE8;color:#9A4B32}
.qtop-cat.food{background:#FDF3E3;color:#8A5A16}
.qtop-dur{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--muted);margin-left:auto;white-space:nowrap}
.qtop-dur svg{width:11px;height:11px}
.qtop-card h4{font-size:13.5px;font-weight:800;color:var(--navy);line-height:1.3;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere}
.qtop-bot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;flex-wrap:wrap}
.qtop-price{font-size:13px;font-weight:800;color:var(--navy);display:inline-flex;align-items:baseline;gap:1px;white-space:nowrap}
.qtop-price small{font-size:10px;font-weight:700;color:var(--muted)}
.qtop-btn{flex:0 0 auto;height:32px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:800;background:#fff;border:1px solid var(--line);color:var(--navy);white-space:nowrap}
.qtop-btn.on{background:var(--teal);border-color:var(--teal);color:#fff}
.qtop-days{display:flex;flex-wrap:wrap;gap:5px;padding-top:8px;border-top:1px dashed var(--line)}
.qday{font-size:10.5px;font-weight:800;padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:#fff;color:#5A6B82;white-space:nowrap}
.qday.on{background:var(--navy);border-color:var(--navy);color:#fff}
.qtop-sum{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:11px;padding-top:10px;border-top:1px dashed var(--line)}
.qtop-sum-txt{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.qtop-sum-txt b{font-size:12.5px;color:var(--navy)}
.qtop-sum-txt span{font-size:11.5px;color:var(--muted)}
.qtop-acts{display:flex;gap:6px;flex-wrap:wrap}
.qlink{font-size:11px;font-weight:800;color:var(--teal);padding:6px 10px;border-radius:999px;background:#EDF7F5}
.qlink.danger{color:var(--danger);background:#FCF1F0}
.qiti-day{border:1px solid var(--line);border-radius:14px;padding:10px 11px;background:#FBFCFE;min-width:0}
.qiti-day + .qiti-day{margin-top:8px}
.qiti-day.free{background:transparent;border-style:dashed;padding:7px 11px}
.qiti-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.qiti-d{font-size:11px;font-weight:800;letter-spacing:.04em;color:#fff;background:linear-gradient(135deg,var(--teal-2),var(--teal));border-radius:8px;padding:3px 9px;white-space:nowrap}
.qiti-date{font-size:11px;font-weight:700;color:var(--navy);white-space:nowrap}
.qiti-tot{font-size:10.5px;font-weight:700;color:var(--muted);margin-left:auto;white-space:nowrap}
.qiti-warn{font-size:10px;font-weight:800;color:#9A4B32;background:var(--accent-soft);border-radius:999px;padding:3px 7px;white-space:nowrap}
.qiti-list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.qiti-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.qiti-time{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;font-weight:700;color:var(--teal);display:flex;flex-direction:column;line-height:1.25;white-space:nowrap}
.qiti-time small{color:var(--muted);font-weight:600}
.qiti-main{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.qiti-main b{font-size:12.5px;color:var(--navy);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qiti-main small{font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qiti-rm{width:26px;height:26px;border-radius:50%;background:#FCF1F0;color:var(--danger);display:grid;place-items:center;flex:0 0 26px}
.qiti-rm svg{width:12px;height:12px}
.qiti-empty{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);background:#FBFCFE;border:1px dashed #D5DFEA;border-radius:12px;padding:11px 12px;line-height:1.45}
.qiti-empty svg{width:15px;height:15px;flex:0 0 15px;color:var(--teal);margin-top:1px}
.qiti-note{display:flex;gap:6px;align-items:flex-start;font-size:10.5px;color:var(--muted);line-height:1.45;margin-top:9px}
.qiti-note svg{width:13px;height:13px;flex:0 0 13px;color:var(--teal);margin-top:1px}
@media (min-width:620px){ .qtop-grid{grid-template-columns:1fr 1fr} }

/* ---------------- member sign-up / sign-in ---------------- */
.auth-tabs{display:flex;gap:6px;background:#EEF3F8;border-radius:14px;padding:4px;margin:14px 0 16px}
.auth-tabs button{flex:1 1 0;height:38px;border-radius:11px;font-size:13.5px;font-weight:800;color:var(--muted)}
.auth-tabs button.on{background:#fff;color:var(--navy);box-shadow:0 1px 5px rgba(11,34,57,.14)}
.auth-types{display:grid;gap:8px;grid-template-columns:1fr}
.auth-type{display:flex;align-items:flex-start;gap:9px;text-align:left;border:1px solid var(--line);background:#FBFCFE;border-radius:13px;padding:10px 11px;transition:.15s}
.auth-type.on{border-color:var(--teal);background:#F2FAF8;box-shadow:inset 0 0 0 1px rgba(42,140,130,.2)}
.auth-type .adot{width:17px;height:17px;border-radius:50%;border:1.6px solid #C6D3E1;background:#fff;flex:0 0 17px;margin-top:1px;display:grid;place-items:center;color:#fff}
.auth-type .adot svg{width:10px;height:10px;opacity:0}
.auth-type.on .adot{background:var(--teal);border-color:var(--teal)}
.auth-type.on .adot svg{opacity:1}
.auth-type b{display:block;font-size:13px;color:var(--navy);font-weight:800;line-height:1.3}
.auth-type small{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.35}
.auth-avatar{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--teal-2),var(--teal));color:#fff;display:grid;place-items:center;font-size:18px;font-weight:800;letter-spacing:.02em;margin:0 auto 10px}
.acc-list{background:#F5F8FB;border-radius:14px;padding:6px 13px;margin-top:14px}
.cmt-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #E6EDF2;font-size:12.5px;color:#43536B}
.cmt-row:last-child{border-bottom:0}
.cmt-row b{color:var(--navy);font-weight:800;text-align:right;overflow-wrap:anywhere}
.m-form{margin-top:16px}
.m-form .field-grid{grid-template-columns:1fr 1fr}
.m-form .field.full{grid-column:1/-1}
.auth-switch{display:block;width:100%;text-align:center;font-size:12.5px;font-weight:800;color:var(--teal);padding:12px 4px 2px}
.auth-note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:12px}

/* ---------------- travel insurance ---------------- */
.ins-plans{display:grid;gap:9px;grid-template-columns:1fr}
.ins-plan{display:flex;flex-direction:column;gap:7px;text-align:left;border:1px solid var(--line);background:#FBFCFE;border-radius:14px;padding:11px 12px;transition:border-color .15s,background .15s;min-width:0}
.ins-plan.on{border-color:var(--teal);background:#F2FAF8;box-shadow:inset 0 0 0 1px rgba(42,140,130,.2)}
.ins-plan .adot{width:17px;height:17px;border-radius:50%;border:1.6px solid #C6D3E1;background:#fff;flex:0 0 17px;display:grid;place-items:center;color:#fff}
.ins-plan .adot svg{width:10px;height:10px;opacity:0}
.ins-plan.on .adot{background:var(--teal);border-color:var(--teal)}
.ins-plan.on .adot svg{opacity:1}
.ins-plan-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ins-plan-top h4{font-size:14px;font-weight:800;color:var(--navy);letter-spacing:-.01em}
.ins-tag{font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:#3B2506;border-radius:999px;padding:3px 6px;white-space:nowrap}
.ins-rate{margin-left:auto;text-align:right;line-height:1.15;white-space:nowrap}
.ins-rate b{display:block;font-size:14.5px;color:var(--navy);letter-spacing:-.02em}
.ins-rate small{font-size:9.5px;font-weight:700;color:var(--muted)}
.ins-desc{font-size:11.5px;color:var(--muted);line-height:1.4}
.ins-ben{display:flex;flex-direction:column;gap:3px;margin:0;padding:0;list-style:none;font-size:11.5px;color:#43536B;line-height:1.35}
.ins-ben li{display:flex;align-items:flex-start;gap:6px;min-width:0}
.ins-ben svg{width:12px;height:12px;color:var(--teal);flex:0 0 12px;margin-top:2px}
.ins-ben b{margin-left:auto;font-weight:800;color:var(--navy);white-space:nowrap;padding-left:6px}
.ins-passport-note{font-size:10.5px;color:var(--muted);line-height:1.45;margin-top:7px;display:flex;gap:6px}
.ins-passport-note svg{width:12px;height:12px;flex:0 0 12px;color:var(--teal);margin-top:1px}
@media (min-width:620px){ .ins-plans{grid-template-columns:repeat(3,1fr)} .auth-types{grid-template-columns:1fr 1fr} }
.type-badge.insurance{background:#EAF4F2;color:#0A6A5F}

/* ---------------- footer ---------------- */
.site-footer{background:#fff;border-top:1px solid var(--line);padding:26px 0 30px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.site-footer .fgrid{display:grid;gap:18px}
.site-footer .fbrand{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.site-footer .fbrand .brand-mark{width:34px;height:34px;flex:0 0 34px;border-radius:50%}
.site-footer .fbrand strong{font-size:15px;color:var(--navy);letter-spacing:-.01em}
.site-footer .fbrand span.ko{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.site-footer h5{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--navy);margin:0 0 8px}
.site-footer p{line-height:1.6}
.site-footer .fcol{display:flex;flex-direction:column;gap:4px}
.site-footer .fcol a,.site-footer .fcol .site-url{color:var(--ink);font-weight:600}
.site-footer .fcol a.site-url{color:#1F6B63;cursor:pointer;text-decoration:none;border-bottom:1px solid rgba(42,140,130,.45);width:max-content}
.site-footer .partner-link{font-size:11px;color:#9AA8B8;font-weight:700;letter-spacing:.02em;text-decoration:none;border-bottom:1px dotted #C6D2DE;padding-bottom:1px}
.site-footer .partner-link:hover{color:var(--navy);border-bottom-color:var(--navy)}
.site-footer .legal{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;line-height:1.6}
.site-footer .fspec{margin-top:18px}
.site-footer .spec-chips{display:flex;flex-wrap:wrap;gap:6px}
.site-footer .spec-chips span{font-size:11px;font-weight:700;color:#1F6B63;background:#E8F4F1;border:1px solid #CDE6E1;border-radius:999px;padding:4px 10px}

/* ---------------- bottom nav ---------------- */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:35;
  background:rgba(255,255,255,.97);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(5,1fr);gap:1px;
}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 1px;border-radius:12px;color:#8697AB;font-size:10px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.bn-item svg{width:22px;height:22px}
.bn-item.on{color:var(--teal)}
.bn-item.on svg{filter:drop-shadow(0 3px 6px rgba(18,163,148,.25))}
.bn-item .dot{width:4px;height:4px;border-radius:50%;background:var(--teal);opacity:0}
.bn-item.on .dot{opacity:1}

/* ---------------- toast ---------------- */
.toast{
  position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,12px);
  background:var(--navy);color:#fff;font-size:13px;font-weight:600;padding:11px 16px;border-radius:12px;
  box-shadow:0 14px 34px rgba(11,34,57,.3);z-index:80;opacity:0;pointer-events:none;transition:.25s;
  max-width:calc(100% - 32px);text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------------- modal ---------------- */
.modal{position:fixed;inset:0;z-index:70;display:none;background:rgba(8,22,36,.56);backdrop-filter:blur(3px);align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal-card{background:#fff;width:100%;max-width:560px;max-height:93vh;overflow:hidden;display:flex;flex-direction:column;border-radius:24px 24px 0 0;animation:sheetUp .3s cubic-bezier(.2,.8,.2,1);position:relative}
.m-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0}
@keyframes sheetUp{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}
body.modal-open{overflow:hidden}

/* ---------------- desktop ---------------- */
@media (min-width:620px){
  .field-grid{grid-template-columns:repeat(4,1fr)}
  .field.full{grid-column:span 2}
  .grid{grid-template-columns:repeat(2,1fr)}
  .hero h1{font-size:36px}
  .grid.flights{grid-template-columns:1fr}
  .site-footer .fgrid{grid-template-columns:1.4fr 1fr 1fr}
}
@media (min-width:620px){
  .qopt-grid{grid-template-columns:1fr 1fr}
  .qsend .field-grid{grid-template-columns:1fr 1fr}
}
/* =====================================================================
   OVERSEAS (outbound) — hero, destination switcher, PARTNER badge
   ===================================================================== */
#view-outbound{padding-top:0}
.scope-tabs{display:inline-flex;gap:4px;padding:4px;background:#EAF1F5;border-radius:999px;margin-bottom:14px}
.scope-tabs button{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 15px;border-radius:999px;font-size:12.5px;font-weight:800;color:#3E5A6B;letter-spacing:-.01em}
.scope-tabs button.on{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(11,34,57,.14)}
.scope-tabs svg{width:15px;height:15px}
.hero.hero--outbound{background-image:
    radial-gradient(880px 400px at 88% -18%, rgba(232,130,107,.36), transparent 62%),
    linear-gradient(94deg, rgba(4,19,30,.95) 0%, rgba(6,27,39,.82) 38%, rgba(7,34,47,.42) 72%, rgba(9,43,55,.20) 100%),
    url("images/outbound-osaka.webp");
  background-size:cover, cover, cover; background-position:center, center, center 46%; background-repeat:no-repeat}
.hero--outbound .kicker{color:#FFD4C6}
.hero--outbound .kicker .dot{background:#9FE3D7}
.hero--outbound .hero-stats span{color:#E4C8BE}
.ob-link{display:inline-flex;align-items:center;gap:7px;margin-top:14px;font-size:12.5px;font-weight:800;color:#BFF0E6;border-bottom:1px solid rgba(191,240,230,.45);padding-bottom:2px}
.ob-link svg{width:15px;height:15px}
.badge.partner{background:#0B1F3A;color:#fff;letter-spacing:.10em;font-weight:900}
.badge.partner svg{width:11px;height:11px}
.price em.pnote{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-top:2px;white-space:normal}

/* =====================================================================
   PARTNER HUB (#partner) — upload, extract, commission, preview, publish
   ===================================================================== */
#view-partner{padding-top:0}
.phero{position:relative;overflow:hidden;color:#fff;background-color:#0A2436;
  background-image:radial-gradient(760px 360px at 84% -10%, rgba(56,163,157,.45), transparent 62%),
    linear-gradient(100deg, rgba(4,19,30,.97) 0%, rgba(7,31,45,.92) 46%, rgba(9,45,58,.72) 100%)}
.phero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1px, transparent 1px);background-size:22px 22px;opacity:.35;pointer-events:none}
.phero-inner{position:relative;z-index:2;max-width:var(--maxw);margin:0 auto;padding:26px 16px 28px}
.phero h1{font-size:23px;line-height:1.26;letter-spacing:-.03em;margin:10px 0 9px;font-weight:800;max-width:720px}
.phero p{color:#C6D9E2;font-size:13.5px;line-height:1.62;max-width:700px}
.pstats{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.pstats div{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:9px 13px;min-width:104px}
.pstats b{display:block;font-size:19px;letter-spacing:-.02em}
.pstats span{font-size:10.5px;color:#A8C4D2;font-weight:700;letter-spacing:.04em}
.pstats .ptrust{background:rgba(159,227,215,.14);border-color:rgba(159,227,215,.38);display:flex;align-items:center;gap:8px;font-size:11.5px;color:#DFF3EF;font-weight:700;max-width:420px}
.pstats .ptrust svg{width:18px;height:18px;flex:0 0 18px;color:#9FE3D7}
.pwrap{max-width:var(--maxw);margin:0 auto;padding:20px 16px 40px;display:grid;gap:16px;grid-template-columns:1fr;align-items:start}
.pmain{display:flex;flex-direction:column;gap:14px;min-width:0}
.pcard{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-sm);padding:16px}
.pcard-h{display:flex;align-items:flex-start;gap:11px;margin-bottom:14px}
.pnum{flex:0 0 30px;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--teal-2),var(--teal));color:#fff;font-size:13px;font-weight:900}
.pnum svg{width:16px;height:16px}
.pcard-h .pt{min-width:0}
.pcard-h b{display:block;font-size:14.5px;color:var(--navy);letter-spacing:-.015em}
.pcard-h small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.pdrop{position:relative;border:2px dashed #C7D8E4;border-radius:16px;background:#F7FBFD;padding:26px 16px;text-align:center;cursor:pointer;transition:background .16s,border-color .16s}
.pdrop.over{border-color:var(--teal);background:#EAF7F4}
.pdrop .pdico{width:52px;height:52px;border-radius:16px;background:#E4F2EF;color:var(--teal);display:grid;place-items:center;margin:0 auto 10px}
.pdrop .pdico svg{width:26px;height:26px}
.pdrop b{display:block;font-size:14px;color:var(--navy);letter-spacing:-.01em}
.pdrop small{display:block;font-size:11.5px;color:var(--muted);margin-top:4px}
.pdrop .pfmt{display:inline-flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:10px}
.pdrop .pfmt span{font-size:10.5px;font-weight:800;color:#2A6E66;background:#E8F4F1;border:1px solid #CFE6E1;border-radius:999px;padding:3px 8px}
.pdrop input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.pst{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;font-weight:700;color:#1F6B63;background:#EAF7F3;border:1px solid #CDE9E2;border-radius:12px;padding:9px 11px;line-height:1.45}
.pst.err{color:#A43A31;background:#FDF0EE;border-color:#F3CEC9}
.pst svg{width:16px;height:16px;flex:0 0 16px}
.pst[hidden]{display:none}
.psamples{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.psamples small{display:block;font-size:11.5px;color:var(--muted);margin-bottom:8px;line-height:1.5}
.psample-row{display:flex;flex-wrap:wrap;gap:7px}
.psample-row button{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid #CFE0EA;background:#fff;font-size:11.5px;font-weight:800;color:var(--navy)}
.psample-row button:hover{background:#EDF6F5;border-color:#BFDCD8}
.psample-row svg{width:14px;height:14px}
.pscope{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.pscope button{display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border-radius:13px;border:1px solid #D5E2EC;background:#fff;font-size:12.5px;font-weight:800;color:#3E5A6B}
.pscope button.on{background:linear-gradient(135deg,var(--teal-2),var(--teal));border-color:transparent;color:#fff;box-shadow:0 8px 18px rgba(14,124,123,.28)}
.pscope svg{width:16px;height:16px}
.pdet{font-size:11.5px;color:#1F6B63;background:#EAF7F3;border-radius:999px;padding:4px 10px;display:inline-block;margin-top:8px;font-weight:700}
.pdet[hidden]{display:none}
/* ---------------- partner access gate (private page) ---------------- */
.pgate{max-width:520px;margin:0 auto;padding:40px 16px 60px}
.pgate-card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:26px 22px;text-align:center}
.pgate-ico{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,var(--teal-2),var(--teal));color:#fff;display:grid;place-items:center;margin:0 auto 14px}
.pgate-ico svg{width:28px;height:28px}
.pgate h2{font-size:19px;color:var(--navy);letter-spacing:-.02em;font-weight:800}
.pgate p{font-size:13px;color:var(--muted);line-height:1.6;margin-top:8px}
.pgate form{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.pgate input{height:46px;border:1px solid #D5E2EC;border-radius:13px;padding:0 14px;font-size:14px;font-weight:700;color:var(--navy);text-align:center;letter-spacing:.12em}
.pgate .btn{height:46px}
.pgate-note{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:14px}
.pgate-link{margin-top:10px;font-size:12px;font-weight:800;color:#176B62;word-break:break-all}
.paccess{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between;background:#F2F7FA;border:1px solid #DCE7EF;border-radius:12px;padding:8px 12px;margin-bottom:14px;font-size:11.5px;color:#456;line-height:1.45}
.paccess b{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#176B62}
.paccess svg{width:13px;height:13px}
.paccess .paccess-a{display:flex;gap:6px;flex-wrap:wrap}
.paccess button{font-size:11px;font-weight:800;padding:5px 9px;border-radius:8px;border:1px solid #CFE0EA;background:#fff;color:var(--navy)}
.paccess code{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:#5A6B7C}
.pgate[hidden]{display:none}

.pdays{display:flex;flex-direction:column;gap:9px}
.pday{border:1px solid #E1EAF1;border-radius:14px;padding:11px 12px;background:#F9FCFD}
.pday-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.pday-h b{font-size:11.5px;font-weight:900;letter-spacing:.06em;color:#2A6E66;text-transform:uppercase}
.pday-h button{font-size:11px;color:#9A5A52;font-weight:800;padding:3px 7px;border-radius:8px}
.pday-h button:hover{background:#FBEAE8}
.pday input{width:100%;border:1px solid #DCE6EE;border-radius:10px;padding:8px 10px;font-size:12.5px;font-weight:700;color:var(--navy);background:#fff;margin-bottom:6px}
.pday textarea{width:100%;border:1px solid #DCE6EE;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.5;color:#33465C;background:#fff;min-height:70px;resize:vertical}
.pgall{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.pgall button{position:relative;aspect-ratio:16/10;border-radius:10px;overflow:hidden;border:2px solid transparent;background:#EAF1F5}
.pgall button.on{border-color:var(--teal);box-shadow:0 0 0 3px rgba(42,140,130,.18)}
.pgall img{width:100%;height:100%;object-fit:cover}
.pgall button span{position:absolute;left:0;right:0;bottom:0;font-size:9px;font-weight:800;color:#fff;background:linear-gradient(transparent,rgba(4,20,30,.82));padding:9px 3px 2px;text-align:center;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pside{position:relative;display:flex;flex-direction:column;gap:12px;min-width:0;align-self:stretch}
.pside-sticky{position:sticky;top:calc(var(--header-h) + 84px);display:flex;flex-direction:column;gap:12px}
.pprev{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:13px;min-width:0}
.pprev-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.pprev-h b{font-size:12px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:#2A6E66;white-space:nowrap}
.pprev-h span{font-size:10.5px;color:var(--muted);font-weight:700}
.pcard-mini{border:1px solid #E3ECF2;border-radius:14px;overflow:hidden;background:#fff}
.pcard-mini .cover{aspect-ratio:16/9}
.pcard-mini .pc-b{padding:11px 12px 12px}
.pcard-mini .pc-cat{font-size:10.5px;font-weight:800;color:var(--teal);letter-spacing:.05em;text-transform:uppercase;display:flex;gap:6px;align-items:center}
.pcard-mini h3{font-size:14.5px;line-height:1.32;color:var(--navy);font-weight:800;margin:5px 0 7px;letter-spacing:-.015em;overflow-wrap:anywhere}
.pcard-mini .pc-meta{font-size:11px;color:var(--muted);font-weight:700;display:flex;flex-wrap:wrap;gap:4px 9px;align-items:center}
.pcard-mini .pc-meta svg{width:13px;height:13px;flex:0 0 13px}
.pcard-mini .pc-meta span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pcard-mini .pc-price{display:flex;align-items:baseline;gap:5px;margin-top:9px}
.pcard-mini .pc-price small{font-size:10px;color:var(--muted);font-weight:700}
.pcard-mini .pc-price b{font-size:17px;color:var(--navy);letter-spacing:-.02em}
.pcard-mini .pc-price em{font-size:10.5px;color:var(--muted);font-style:normal;font-weight:700}
.pmoney{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.pmoney div{background:#F4F8FB;border-radius:12px;padding:10px 11px;min-width:0}
.pmoney small{display:block;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pmoney b{display:block;font-size:16px;color:var(--navy);letter-spacing:-.02em;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmoney div.hi{background:#E9F6F3}
.pmoney div.hi b{color:#176B62}
.pformula{font-size:10.5px;color:var(--muted);line-height:1.5;margin-top:8px}
.prate{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.prate button{height:32px;padding:0 12px;border-radius:999px;border:1px solid #D5E2EC;background:#fff;font-size:12px;font-weight:800;color:var(--navy)}
.prate button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.pnote{background:#FFF7E8;border:1px solid #F2DFB6;border-radius:14px;padding:12px 13px;font-size:11.5px;line-height:1.55;color:#6B5323}
.pnote b{display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:5px;color:#7A5A15}
.pnote svg{width:15px;height:15px;flex:0 0 15px}
.pactions{display:flex;flex-direction:column;gap:8px}
.pactions .btn{width:100%}
.pactions svg,.pinstall svg,.pnote svg,.pclearsvg{width:16px;height:16px;flex:0 0 16px}
.pactions .btn-ghost2 svg{width:16px;height:16px;flex:0 0 16px}
.pactions .btn-ghost2{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 14px;border-radius:13px;border:1px solid #CFE0EA;background:#fff;color:var(--navy);font-size:12.5px;font-weight:800}
.pactions .btn-ghost2:hover{background:#EDF6F5}
.pactions .pclear{align-self:center;font-size:11.5px;font-weight:700;color:var(--muted);padding:5px}
.pmine{margin-top:14px}
.pmine-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.pmine-h b{font-size:12.5px;color:var(--navy);font-weight:800}
.pmine .prow{display:flex;align-items:center;gap:10px;border:1px solid #E4ECF3;border-radius:12px;padding:8px 10px;margin-bottom:7px;background:#fff;min-width:0}
.pmine .prow img{width:52px;height:36px;object-fit:cover;border-radius:7px;flex:0 0 52px;background:#EAF1F5}
.pmine .pr-t{min-width:0;flex:1 1 auto}
.pmine .pr-t b{display:block;font-size:12px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmine .pr-t small{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}
.pmine .pr-a{display:flex;gap:4px;flex:0 0 auto}
.pmine .pr-a button{font-size:11px;font-weight:800;padding:5px 8px;border-radius:8px;border:1px solid #DDE7EE;color:var(--navy);background:#fff}
.pmine .pr-a button.del{color:#A43A31;border-color:#F0D3CF}
.pmine .pempty{font-size:12px;color:var(--muted);line-height:1.55}
.pphoto-note{font-size:10.5px;color:var(--muted);margin-top:6px}
.pinstall{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:999px;background:#0B1F3A;color:#fff;font-size:12px;font-weight:800;margin-top:10px}
.pinstall svg{width:15px;height:15px}
.pinstall:hover{background:#12315A}
.pinstall[hidden]{display:none}
.pstep-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pstep-list span{font-size:10.5px;font-weight:800;color:#CFE9E4;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 10px}

@media (min-width:900px){
  .pwrap{grid-template-columns:minmax(0,1fr) 372px;gap:20px}
  .phero h1{font-size:31px}

  .phero-inner{padding:38px 16px 34px}

}

@media (max-width:899px){

}
@media (min-width:900px){
  .pprev-inline{display:none}
}

  .pgall{grid-template-columns:repeat(3,1fr)}
  .phero h1{font-size:20px}
  .pwrap{padding:14px 12px 34px}

@media (min-width:900px) and (max-width:1140px){
  .brand-text small{display:none}
}
@media (min-width:900px){
  :root{--header-h:72px}
  body{padding-bottom:0}
  .bottom-nav{display:none}
  .header-inner{height:72px}
  .brand-mark{width:42px;height:42px}
  .brand-text strong{font-size:17px}
  .channel-bar{position:sticky;top:var(--header-h)}
  .channel-inner{padding:10px 16px;gap:10px}
  .channel-item{padding:10px 14px;justify-content:flex-start}
  .channel-item .ch-l{font-size:14.5px}

  .hero-inner{grid-template-columns:1fr;padding:34px 16px 32px;gap:26px;max-width:1120px}
  .hero{background-image:
    radial-gradient(760px 320px at 90% -20%, rgba(56,163,157,.28), transparent 60%),
    linear-gradient(94deg, rgba(5,21,33,.93) 0%, rgba(6,27,39,.72) 34%, rgba(7,34,47,.32) 70%, rgba(9,43,55,.16) 100%),
    url("images/hero-seoul.webp");
    background-size:cover, cover, cover;
    background-position:center, center, 52% 42%;
  }
  .hero-copy{position:relative;z-index:2;max-width:600px}
  .hero h1{font-size:36px}
  .hero p{font-size:15.5px}
  .grid{grid-template-columns:repeat(3,1fr);gap:20px}
  .grid.flights{grid-template-columns:repeat(2,1fr)}
  .grid.hotels{grid-template-columns:repeat(3,1fr)}
  .grid.bookings{grid-template-columns:repeat(2,1fr)}
  .modal{align-items:center;padding:24px}
  .modal-card{border-radius:22px;max-height:88vh;box-shadow:0 30px 70px rgba(5,16,28,.4)}
  .m-hd .cover{aspect-ratio:16/7}
  .section-head h2{font-size:24px}
  .toast{bottom:34px}
  .view{padding:34px 0 46px}
  .panel{padding:18px}
  .m-meta{grid-template-columns:repeat(4,1fr)}
  .qwrap{grid-template-columns:minmax(0,1fr) 372px;gap:20px;align-items:start}
  .qside{position:sticky;top:calc(var(--header-h) + 18px)}
  .qhero-inner{padding:44px 16px 38px}
  .qhero h1{font-size:34px}
  .qhero p{font-size:15px}
  .qcard{padding:18px}
  .qopt-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:619px){
  .channel-inner{padding:8px 10px;gap:5px}
  .channel-item{flex-direction:column;gap:4px;padding:7px 4px;border-radius:12px}
  .channel-item .ch-ico{width:26px;height:26px;flex:0 0 26px;border-radius:9px}
  .channel-item .ch-ico svg{width:16px;height:16px}
  .channel-item .ch-txt{align-items:center;text-align:center}
  .channel-item .ch-l{display:none}

  .seg button .code{display:none}
  .icon-btn{padding:0 9px}

@media (max-width:899px){
  .channel-inner{grid-template-columns:repeat(4,1fr)}
  .channel-item .ch-sub{display:none}
  .pside{display:none}
  .pprev-inline{display:block}
}

  .pprev-inline{display:none}
}

/* =====================================================================
   TRAVEL TV & LIVE (#live) — public channel, submission form, approval queue
   ===================================================================== */
#view-live{padding-top:0}
.lvhero{position:relative;overflow:hidden;color:#fff;background-color:#08202E;
  background-image:
    radial-gradient(660px 320px at 92% -20%, rgba(200,50,42,.30), transparent 62%),
    radial-gradient(720px 340px at 4% -14%, rgba(56,163,157,.36), transparent 66%),
    linear-gradient(96deg,#071D2A 0%,#0D3746 56%,#14495A 100%);}
.lvhero-inner{max-width:var(--maxw);margin:0 auto;padding:26px 16px 24px;display:grid;gap:12px}
.lvhero .kicker{color:#9FE3D7}
.lvhero h1{font-size:25px;line-height:1.24;letter-spacing:-.03em;margin:8px 0 7px;font-weight:800;max-width:660px}
.lvhero p{color:#C6D6E4;font-size:13.5px;line-height:1.6;max-width:640px}
.lvhero-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.lvhero-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#D7ECE8;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 10px}
.lvhero-chip svg{width:12px;height:12px;color:#9FE3D7}
.lvhero-cta{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.lvhero-stats{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px}
.lvhero-stats div{display:flex;flex-direction:column}
.lvhero-stats b{font-size:19px;letter-spacing:-.02em}
.lvhero-stats span{font-size:10.5px;color:#9FB4C8;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.lvgrid{display:grid;gap:16px;grid-template-columns:1fr}
.lvcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow-sm);display:flex;flex-direction:column;text-align:left;width:100%;min-width:0;
  transition:transform .18s ease, box-shadow .2s ease}
.lvcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.lv-thumb{position:relative;display:block;width:100%;aspect-ratio:16/9;overflow:hidden;padding:0;
  background:linear-gradient(135deg,#0E3A4E,#164E63 58%,#1B5E96);text-align:left}
.lv-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.lv-thumb .lv-fallback{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.42)}
.lv-thumb .lv-fallback svg{width:46px;height:46px}
.lv-thumb .lv-playdot{position:absolute;inset:0;display:grid;place-items:center}
.lv-thumb .lv-playdot span{width:52px;height:52px;border-radius:50%;background:rgba(9,24,38,.55);border:1px solid rgba(255,255,255,.5);
  display:grid;place-items:center;color:#fff;backdrop-filter:blur(3px);transition:transform .18s ease, background .18s ease}
.lvcard:hover .lv-playdot span{transform:scale(1.06);background:rgba(42,140,130,.85)}
.lv-thumb .lv-playdot svg{width:22px;height:22px;margin-left:2px}
.lv-thumb .badges{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:82%}
.badge.live{background:#C8322A;color:#fff;letter-spacing:.08em}
.badge.live .pulse{width:6px;height:6px;border-radius:50%;background:#fff;animation:lvpulse 1.7s infinite}
@keyframes lvpulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.65)}70%{box-shadow:0 0 0 7px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.badge.yt{background:#fff;color:#B3261E;letter-spacing:.04em}
.badge.soon{background:rgba(9,24,38,.62);color:#fff}
.lv-body{padding:13px 15px 15px;display:flex;flex-direction:column;gap:7px;flex:1;min-width:0}
.lv-top{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--teal);min-width:0}
.lv-top .sep{width:3px;height:3px;border-radius:50%;background:#C3CEDA;flex:0 0 3px}
.lv-top .who{color:var(--muted);text-transform:none;letter-spacing:0;font-weight:600;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvcard h3{font-size:15.5px;line-height:1.32;letter-spacing:-.015em;color:var(--navy);font-weight:800}
.lv-desc{font-size:12px;line-height:1.5;color:var(--muted)}
.lv-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:auto;padding-top:8px;border-top:1px dashed var(--line)}
.lv-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 13px;border-radius:999px;
  font-size:12px;font-weight:800;background:#EEF3F8;color:var(--navy);min-width:0}
.lv-btn svg{width:14px;height:14px;flex:0 0 14px}
.lv-btn.primary{background:linear-gradient(135deg,var(--teal-2),var(--teal));color:#fff;box-shadow:0 6px 16px rgba(14,124,123,.28)}
.lv-btn:active{transform:scale(.98)}
.lvframe{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}
.lvframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.lvframe-note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
.lvsoon{border:1px dashed #CFDDE7;border-radius:14px;padding:18px 14px;text-align:center;background:#FBFCFE}

@media (min-width:620px){

/* ---------------- currency switcher (6 currencies) ---------------- */
.cur-wrap{position:relative;display:inline-flex}
.cur-sheet{position:fixed;top:calc(var(--header-h) + env(safe-area-inset-top));right:12px;z-index:46;
  background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  padding:6px;min-width:172px;display:none}
.cur-sheet.open{display:block;animation:pop .16s ease-out}
.cur-sheet button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:10px;font-size:14px;font-weight:700;color:var(--ink)}
.cur-sheet button span:first-child{width:18px;text-align:center;color:var(--teal);font-weight:800}
.cur-sheet button .code{color:var(--muted);font-size:12px;font-weight:700}
.cur-sheet button:hover{background:#F3F6FA}
.cur-sheet button.on{background:#EDF7F5;color:var(--teal)}

/* ---------------- all-in-one super search ---------------- */
.sp-wrap{position:relative;z-index:4;max-width:var(--maxw);margin:-30px auto 0;padding:0 16px 4px}
.sp-card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 46px rgba(11,34,57,.16);overflow:hidden}
.sp-tabs{display:flex;gap:2px;overflow-x:auto;background:#F1F6F8;padding:7px 7px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sp-tabs::-webkit-scrollbar{display:none}
.sp-tab{display:inline-flex;align-items:center;gap:6px;padding:10px 12px;border-radius:12px 12px 0 0;font-size:12.5px;font-weight:800;color:#5B6C80;white-space:nowrap;flex:0 0 auto}
.sp-tab svg{width:16px;height:16px}
.sp-tab.on{background:#fff;color:var(--navy);box-shadow:0 -2px 10px rgba(11,34,57,.07)}
.sp-body{padding:12px 12px 14px}
.sp-seg{display:inline-flex;background:#EEF3F8;border-radius:999px;padding:3px;margin-bottom:10px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.sp-seg::-webkit-scrollbar{display:none}
.sp-seg button{padding:6px 11px;border-radius:999px;font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.sp-seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(11,34,57,.12)}
.sp-go{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:46px;margin-top:10px;border-radius:13px;
  background:linear-gradient(135deg,#38A39D,#2A8C82);color:#fff;font-size:14.5px;font-weight:800;box-shadow:0 10px 22px rgba(14,124,123,.28)}
.sp-go svg{width:18px;height:18px}
.sp-go:active{transform:scale(.99)}
.sp-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.sp-link{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:11.5px;font-weight:700;color:#3E5A6B}
.sp-link svg{width:13px;height:13px;color:var(--teal)}
.sp-recent{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:12px}
.sp-recent .rt{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sp-chip{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:11.5px;font-weight:700;color:#3E5A6B;max-width:100%;text-align:left}
.sp-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-chip svg{width:12px;height:12px;color:var(--teal);flex:0 0 12px}
.sp-chip.ghost{border-style:dashed;color:var(--muted)}
.sp-note{font-size:11px;color:var(--muted);line-height:1.45;margin-top:8px}
.sp-tips{display:grid;gap:8px;margin-top:10px}
.sp-tip{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#FBFCFE;text-align:left;width:100%}
.sp-tip b{font-size:13px;color:var(--navy)}
.sp-tip small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.sp-tip .fare{font-size:13px;font-weight:800;color:var(--teal);white-space:nowrap}
.sp-deals{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.sp-deals::-webkit-scrollbar{display:none}
.sp-deal{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:#FFF4EF;border:1px solid #F8DCD2;color:#8A4C3C;font-size:11.5px;font-weight:800}
.sp-deal svg{width:13px;height:13px}
.sp-check{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:#3E5A6B;margin-top:2px}
.sp-check input{width:18px;height:18px;accent-color:var(--teal)}

/* ---------------- wishlist hearts ---------------- */
.card-shell{position:relative;display:flex;flex-direction:column;min-width:0}
.card-shell>.tour-card{flex:1 1 auto}
.wish-btn{position:absolute;top:9px;right:9px;z-index:3;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;

.acct-head{display:flex;gap:14px;align-items:center;padding:16px;border-radius:18px;

.acct-av{width:54px;height:54px;flex:0 0 54px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);font-size:18px;font-weight:800}

.acct-head p{font-size:12px;color:#B9D3DD;margin-top:3px;overflow-wrap:anywhere}

.acct-tag{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:rgba(56,163,157,.24);border:1px solid rgba(56,163,157,.5);border-radius:999px;padding:3px 8px}

.acct-sec .cnt{font-size:12px;font-weight:700;color:var(--teal);background:#E9F5F2;border-radius:999px;padding:3px 9px}

.acct-stat b{display:block;font-size:18px;color:var(--navy)}
.acct-stat span{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}

@media (max-width:619px){
  .sp-wrap{margin-top:2px}
  .sp-body{padding:11px 11px 13px}
}

   MyRealTrip + Klook feature layer
   companion curation · guide & reviews · travel Q&A · ticket filters ·
   combo passes · time slot & voucher · QR e-voucher wallet · stay filters
   ===================================================================== */
/* ---- companion curation: 누구와 떠나시나요? ---- */
.who-box{margin:4px 0 14px;padding:14px 14px 12px;border-radius:18px;
  background:linear-gradient(135deg,#F1F8F6,#EEF4FA 70%,#F6F1EC);border:1px solid var(--line)}
.who-head h2{font-size:17px;letter-spacing:-.02em;color:var(--navy)}
.who-head p{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
.who-chips{display:flex;gap:7px;overflow-x:auto;padding:11px 0 3px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.who-chips::-webkit-scrollbar{display:none}
.who-chip{flex:0 0 auto;display:inline-flex;flex-direction:column;align-items:center;gap:4px;min-width:68px;
  padding:9px 11px 8px;border-radius:14px;border:1px solid var(--line);background:#fff;
  font-size:11px;font-weight:700;color:#3D4F66;transition:.18s}
.who-chip svg{width:20px;height:20px;color:var(--teal)}
.who-chip.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 8px 18px rgba(11,34,57,.2)}
.who-chip.on svg{color:#8FE0D3}
.who-chip:active{transform:scale(.97)}
.who-count{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:#4B6076;margin-top:4px}
.who-count b{color:var(--teal)}
.who-count span{color:var(--muted);font-weight:600}
/* ---- Klook-style badges (cards and detail) ---- */
.badge.kl{background:#EEF6FF;color:#1B5E96;text-transform:none;letter-spacing:0;font-size:10px;padding:4px 8px}
.badge.kl.instant{background:#E9F7EE;color:#127C5B}
.badge.kl.fast{background:#FFF3E3;color:#9A5A00}
.badge.kl.combo{background:#F1ECFB;color:#5B3FA6}
/* ---- verified guide card ---- */
.guide-card{display:flex;gap:12px;padding:13px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:var(--shadow-sm)}
.g-av{flex:0 0 46px;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--teal),var(--navy));color:#fff;font-size:14px;font-weight:800;letter-spacing:.04em}
.g-main{min-width:0;flex:1}
.g-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.g-top b{font-size:14.5px;color:var(--navy);letter-spacing:-.01em}
.g-ver{display:inline-flex;align-items:center;gap:3px;font-size:9.5px;font-weight:800;color:#127C5B;
  background:#E9F7EE;border-radius:999px;padding:2px 7px}
.g-ver svg{width:10px;height:10px}
.g-role{font-size:11.5px;color:var(--muted);margin-top:3px}
.g-langs{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.g-lang{font-size:10px;font-weight:800;color:#31566E;background:#EEF3F8;border-radius:6px;padding:2px 7px;letter-spacing:.03em}
.g-stats{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:11px;color:#3D4F66;font-weight:700}
.g-stats span{display:inline-flex;align-items:center;gap:4px}
.g-stats svg{width:12px;height:12px;color:var(--teal)}
/* ---- traveller reviews ---- */
.rev-sum{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 13px;border-radius:14px;
  background:#F5F9FB;border:1px solid var(--line)}
.rev-score{display:flex;align-items:baseline;gap:5px}
.rev-score b{font-size:26px;letter-spacing:-.03em;color:var(--navy);line-height:1}
.rev-score span{font-size:11px;color:var(--muted);font-weight:700}
.rev-sum .rev-count{font-size:11.5px;color:var(--muted);font-weight:700}
.rev-sum .btn{margin-left:auto;height:36px;font-size:12px;padding:0 13px}
.rev-list{display:grid;gap:9px;margin-top:10px}
.rev-item{padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:#fff}
.rev-item.mine{background:#F4FBF9;border-color:#CBE7E1}
.rev-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.rev-top b{font-size:12.5px;color:var(--navy)}
.rev-top .rev-co{font-size:10.5px;color:var(--muted);font-weight:700}
.rev-top .rev-date{margin-left:auto;font-size:10px;color:#8A98A6;font-weight:700}
.rev-stars{display:inline-flex;gap:1px;color:#F0A63C}
.rev-stars svg{width:11px;height:11px}
.rev-text{font-size:12.5px;line-height:1.6;color:#3A4A5F;margin-top:6px}
.rev-tag{font-size:9.5px;font-weight:800;color:#127C5B;background:#E9F7EE;border-radius:999px;padding:2px 7px}
.rev-tag.you{color:#1B5E96;background:#E7F0FC}
.rev-form{margin-top:11px;padding:13px;border:1px dashed #C9DCE4;border-radius:15px;background:#FBFDFE}
.rev-form .field{margin-bottom:9px}
.rev-stars-in{display:flex;align-items:center;gap:4px}
.rev-star{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--line);background:#fff;color:#D6DEE6}
.rev-star svg{width:17px;height:17px}
.rev-star.on{color:#F0A63C;border-color:#F5D6A8;background:#FFF8EC}
/* ---- travel Q&A board ---- */
.qa-wrap{margin-top:22px;padding:14px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.qa-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.qa-head h2{font-size:19px;letter-spacing:-.02em;color:var(--navy);display:flex;align-items:center;gap:7px}
.qa-head h2 svg{width:19px;height:19px;color:var(--teal)}
.qa-head p{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
.qa-count{font-size:11px;font-weight:800;color:var(--teal);background:#E9F5F2;border-radius:999px;padding:5px 10px;white-space:nowrap}
.qa-list{display:grid;gap:9px;margin-top:12px}
.qa-card{padding:12px;border:1px solid var(--line);border-radius:14px;background:#FCFDFE}
.qa-card.mine{background:#F4FBF9;border-color:#CBE7E1}
.qa-cat{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:800;letter-spacing:.04em;
  text-transform:uppercase;color:#1B5E96;background:#EEF6FF;border-radius:999px;padding:3px 8px}
.qa-q{display:flex;gap:7px;margin-top:7px;font-size:13.5px;font-weight:800;color:var(--navy);line-height:1.45}
.qa-q i{flex:0 0 18px;width:18px;height:18px;border-radius:6px;display:grid;place-items:center;
  background:var(--navy);color:#fff;font-style:normal;font-size:10.5px;font-weight:800;margin-top:1px}
.qa-a{display:flex;gap:7px;margin-top:6px;font-size:12.5px;color:#3A4A5F;line-height:1.6}
.qa-a i{flex:0 0 18px;width:18px;height:18px;border-radius:6px;display:grid;place-items:center;
  background:#E9F5F2;color:var(--teal);font-style:normal;font-size:10.5px;font-weight:800;margin-top:1px}
.qa-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:8px;font-size:10.5px;color:var(--muted);font-weight:700}
.qa-meta .rev-tag{font-size:9px}
.qa-desk{margin-left:auto;display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:999px;
  border:1px solid #CBE7E1;background:#fff;color:#0A6A5F;font-size:10.5px;font-weight:800}
.qa-desk svg{width:12px;height:12px}
.qa-ask{margin-top:11px;padding:12px;border:1px dashed #C9DCE4;border-radius:14px;background:#FBFDFE}
.qa-ask .qa-ask-h{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--navy);margin-bottom:8px}
.qa-ask .qa-ask-h svg{width:15px;height:15px;color:var(--teal)}
.qa-ask .field-grid{grid-template-columns:1fr}
.qa-pending{display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;white-space:nowrap;font-size:9.5px;font-weight:800;color:#9A5A00;
  background:#FFF3E3;border-radius:999px;padding:3px 8px}
.qa-meta>span{white-space:nowrap}
/* ---- Klook ticket filters & partner search ---- */
.kl-row{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.kl-row::-webkit-scrollbar{display:none}
.kl-chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;padding:8px 12px;border-radius:999px;
  border:1px solid var(--line);background:#fff;font-size:11.5px;font-weight:700;color:#40506A;white-space:nowrap}
.kl-chip svg{width:13px;height:13px;color:var(--teal)}
.kl-chip.on{background:#E9F5F2;border-color:#8FD3C7;color:#0A6A5F}
.kl-chip.on svg{color:#0A6A5F}
.kl-chip:active{transform:scale(.97)}
.ext-bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:10px;padding:9px 11px;
  border-radius:13px;background:#F5F9FB;border:1px solid var(--line)}
.ext-l{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#63728A}
.ext-link{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 11px;border-radius:999px;
  background:#fff;border:1px solid var(--line);font-size:11.5px;font-weight:800;color:#1B5E96;text-decoration:none;white-space:nowrap}
.ext-link svg{width:13px;height:13px}
.ext-link.klook{color:#0E9F6E;border-color:#BFE8D5}
.ext-link.mrt{color:#2B5BD7;border-color:#CBD9F8}
/* ---- combo passes ---- */
.pass-wrap{margin-top:12px;padding:13px;border-radius:16px;background:linear-gradient(135deg,#F6F9FC,#F2F8F6);border:1px solid var(--line)}
.pass-head h4{font-size:14.5px;color:var(--navy);letter-spacing:-.01em}
.pass-head p{font-size:11.5px;color:var(--muted);margin-top:3px}
.pass-grid{display:grid;gap:9px;margin-top:10px}
.pass-card{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;background:#fff;border:1px solid var(--line)}
.pass-ico{flex:0 0 38px;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:#EEF6FF;color:#1B5E96}
.pass-ico svg{width:19px;height:19px}
.pass-card.seoul .pass-ico{background:#E9F5F2;color:#0A6A5F}
.pass-card.busan .pass-ico{background:#EAF0FF;color:#2B5BD7}
.pass-card.jeju .pass-ico{background:#FFF3E3;color:#9A5A00}
.pass-main{min-width:0;flex:1}
.pass-name{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pass-name b{font-size:13px;color:var(--navy)}
.pass-save{font-size:9.5px;font-weight:800;color:#B4413A;background:#FDECEA;border-radius:999px;padding:2px 7px}
.pass-sub{font-size:11px;color:var(--muted);margin-top:2px}
.pass-meta{font-size:10.5px;color:#6B7C8C;font-weight:700;margin-top:3px}
.pass-btn{flex:0 0 auto;height:34px;padding:0 12px;border-radius:11px;background:var(--navy);color:#fff;
  font-size:11.5px;font-weight:800;white-space:nowrap}
.pass-btn:active{transform:scale(.97)}
.pb-list{display:grid;gap:7px;margin-top:10px}
.pb-item{display:flex;align-items:center;gap:10px;padding:10px 11px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left}
.pb-item.on{border-color:#8FD3C7;background:#F4FBF9}
.pb-box{flex:0 0 20px;width:20px;height:20px;border-radius:6px;border:1.5px solid #C6D4DE;display:grid;place-items:center;color:#fff;background:#fff}
.pb-item.on .pb-box{background:var(--teal);border-color:var(--teal)}
.pb-box svg{width:12px;height:12px;opacity:0}
.pb-item.on .pb-box svg{opacity:1}
.pb-t{min-width:0;flex:1;font-size:12.5px;color:#28384A;font-weight:700;line-height:1.4}
.pb-p{font-size:12px;font-weight:800;color:var(--navy);white-space:nowrap}
.pb-sum{margin-top:11px;padding:11px 12px;border-radius:13px;background:#F5F9FB;border:1px solid var(--line)}
.pb-row{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:#3D4F66;padding:3px 0}
.pb-row b{color:var(--navy)}
.pb-row.total{border-top:1px dashed var(--line);margin-top:5px;padding-top:7px;font-weight:800}
.pb-row.total b{font-size:16px;color:var(--teal)}
.pb-row .disc{color:#B4413A;font-weight:800}
/* ---- booking sheet: time slot & voucher ---- */
.vch-note{display:flex;gap:6px;align-items:flex-start;font-size:10.5px;color:#5A6B7C;line-height:1.5;margin-top:3px}
.vch-note svg{width:12px;height:12px;flex:0 0 12px;color:var(--teal);margin-top:2px}
/* ---- mobile voucher wallet ---- */
.wallet-grid{display:grid;gap:9px}
.vch-card{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--line);border-radius:15px;background:#fff}
.vch-qr{flex:0 0 56px;width:56px;height:56px;padding:4px;border-radius:11px;background:#fff;border:1px solid var(--line)}
.vch-qr svg{display:block;width:100%;height:100%}
.vch-main{min-width:0;flex:1}
.vch-badge{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:800;letter-spacing:.03em;
  border-radius:999px;padding:2px 7px;background:#EEF6FF;color:#1B5E96;text-transform:uppercase}
.vch-badge.open{background:#FFF3E3;color:#9A5A00}
.vch-badge svg{width:10px;height:10px}
.vch-title{font-size:12.8px;font-weight:800;color:var(--navy);line-height:1.35;margin-top:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vch-meta{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:3px;display:flex;gap:7px;flex-wrap:wrap}
.vch-meta b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#3D4F66;letter-spacing:.02em}
.vch-actions{flex:0 0 auto;display:flex;flex-direction:column;gap:5px}
.vch-btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:29px;padding:0 9px;
  border-radius:9px;border:1px solid var(--line);background:#fff;color:#1B5E96;font-size:10.5px;font-weight:800;white-space:nowrap}
.vch-btn svg{width:12px;height:12px}
.vch-btn.solid{background:var(--navy);border-color:var(--navy);color:#fff}
.vch-btn:active{transform:scale(.97)}
.big-qr{display:grid;place-items:center;gap:12px;padding:8px 0 4px}
.big-qr .bq{width:220px;height:220px;padding:10px;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.big-qr .bq svg{display:block;width:100%;height:100%}
.big-qr .bq-id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;font-weight:800;letter-spacing:.12em;color:var(--navy)}
.big-qr .bq-note{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.5;max-width:280px}
/* ---- hotel stay-type filters ---- */
.stay-badge{position:absolute;left:10px;bottom:10px;display:inline-flex;align-items:center;gap:4px;
  font-size:9.5px;font-weight:800;border-radius:999px;padding:3px 8px;background:rgba(255,255,255,.94);color:#0A6A5F}
.stay-badge.long{color:#2B5BD7}
.stay-badge svg{width:11px;height:11px}
@media (max-width:519px){
  .rev-sum .btn{margin-left:0;width:100%}
  .vch-card{flex-wrap:wrap}
  .vch-actions{flex-direction:row;width:100%}
  .vch-btn{flex:1}
  .pass-btn{height:32px;padding:0 10px}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>
