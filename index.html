  }

  function saveFile(name, text) {
    try {
      var blob = new Blob([text], { type: 'text/html;charset=utf-8' });
      if (window.navigator && window.navigator.msSaveOrOpenBlob) {
        window.navigator.msSaveOrOpenBlob(blob, name);
        return true;
      }
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      a.rel = 'noopener';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        if (a.parentNode) a.parentNode.removeChild(a);
        URL.revokeObjectURL(url);
      }, 5000);
      return true;
    } catch (e) {
      return false;
    }
  }

  /* Embed the tour photograph so the downloaded file stays whole offline.
     If the browser refuses (file://, CORS, no network) we fall back to the
     clean gradient header — the file must always download. */
  function embedPhoto(src, cb) {
    if (!src) { cb(''); return; }
    /* file:// blocks XHR (the browser calls it cross-origin), so a locally saved
       copy simply gets the clean gradient header instead of a broken image. */
    if (location.protocol !== 'http:' && location.protocol !== 'https:') { cb(''); return; }
    var done = false;
    var finish = function (uri) {
      if (done) return;
      done = true;
      cb(uri || '');
    };
    var timer = setTimeout(function () { finish(''); }, 1600);
    try {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', src, true);
      xhr.responseType = 'blob';
      xhr.onload = function () {
        clearTimeout(timer);
        var blob = xhr.response;
        if (!blob || (xhr.status && xhr.status !== 200)) { finish(''); return; }
        /* the server may hand .webp back as octet-stream — label it so the
           data URI is an image the saved file can actually render */
        var typed = blob;
        try { typed = new Blob([blob], { type: 'image/webp' }); } catch (e2) { typed = blob; }
        var fr = new FileReader();
        fr.onload = function () {
          var uri = String(fr.result || '');
          finish(uri.indexOf('data:image/') === 0 ? uri : '');
        };
        fr.onerror = function () { finish(''); };
        fr.readAsDataURL(typed);
      };
      xhr.onerror = function () { clearTimeout(timer); finish(''); };
      xhr.send();
    } catch (e) {
      clearTimeout(timer);
      finish('');
    }
  }

  /* The tour photograph is fetched once per product while the guest is reading
     the detail sheet, so the saved brochure can embed it without breaking the
     tap-triggered download that iOS and Android browsers insist on. */
  var PHOTO_URI = {};
  function prefetchPhoto(id) {
    var src = PHOTOS['tour:' + id];
    if (!src) { PHOTO_URI[id] = ''; return; }
    PHOTO_URI[id] = '';
    embedPhoto(src, function (uri) { PHOTO_URI[id] = uri || ''; });
  }
  function photoUri(id) {
    var v = PHOTO_URI[id];
    return typeof v === 'string' ? v : '';
  }

  /* ------------------------------------------------- travel insurance */
  /* Demo tariff sheet — KRW per person per day. Illustrative only: the insurer
     confirms the final premium and terms when the certificate is issued. */
  var INS_PLANS = [
    { key: 'standard', base: 2900, ben: [['medical', 30000000], ['baggage', 1000000]] },
    { key: 'premium', base: 4800, popular: true, ben: [['medical', 50000000], ['liability', 100000000], ['delay', 100000]] },
    { key: 'activity', base: 6500, ben: [['medical', 50000000], ['liability', 100000000], ['activity', 0]] }
  ];

  function insPlan(key) {
    for (var i = 0; i < INS_PLANS.length; i++) if (INS_PLANS[i].key === key) return INS_PLANS[i];
    return INS_PLANS[0];
  }
  /* inclusive cover period: arrival day + every day up to the departure day */
  function insDays() {
    var a = state.ins.arrive, d = state.ins.depart;
    if (!a || !d) return 0;
    var t1 = new Date(a + 'T00:00:00'), t2 = new Date(d + 'T00:00:00');
    if (isNaN(t1.getTime()) || isNaN(t2.getTime())) return 0;
    var n = Math.round((t2.getTime() - t1.getTime()) / 86400000) + 1;
    return n >= 1 ? n : 0;
  }
  function insCalc() {
    var p = insPlan(state.ins.plan);
    var days = insDays();
    var pax = Math.max(1, Math.min(10, parseInt(state.ins.pax, 10) || 1));
    var disc = pax >= 10 ? 0.10 : (pax >= 5 ? 0.05 : 0);
    var perPerson = days > 0 ? Math.round(p.base * days * (1 - disc)) : 0;
    return { plan: p, days: days, pax: pax, disc: disc, perPerson: perPerson, total: perPerson * pax };
  }

  function insPlanCard(p) {
    var on = state.ins.plan === p.key;

    return '<button type="button" class="ins-plan' + (on ? ' on' : '') + '" data-act="ins-plan" data-p="' + p.key + '" aria-pressed="' + (on ? 'true' : 'false') + '">' +
      '<span class="ins-plan-top"><span class="adot">' + ic.check + '</span>' +
      '<h4>' + t('ins.plan.' + p.key) + '</h4>' +
      (p.popular ? '<span class="ins-tag">' + t('ins.plan.popular') + '</span>' : '') +
      '<span class="ins-rate"><b>' + money(p.base) + '</b><small>' + t('ins.rateUnit') + '</small></span></span>' +
      '<span class="ins-desc">' + t('ins.plan.' + p.key + '.d') + '</span>' +
      '<ul class="ins-ben">' + ben + '</ul></button>';
  }

  function insEstimateHTML() {
    var c = insCalc();
    var head = '<div class="qest-head"><h3>' + t('ins.calc.title') + '</h3><span>' + t('ins.plan.' + c.plan.key) + '</span></div>';
    if (!c.days) {

        '<div class="qest-note">' + ic.info + '<span>' + t('ins.calc.note') + '</span></div>';

  function copyIns(ref) {

    for (var i = 0; i < state.bookings.length; i++) if (state.bookings[i].ref === ref) b = state.bookings[i];

      if (ta) { ta.hidden = false; ta.value = text; ta.focus(); ta.select(); }
    };
    var ok = function () { toast(t('ins.copied')); };
    var bad = function () { reveal(); toast(t('quote.copyFail')); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, bad);
      return;
    }
    try {
      var ta2 = document.createElement("textarea");
      ta2.value = text;
      ta2.setAttribute('readonly', 'readonly');
      ta2.style.position = 'fixed';
      ta2.style.left = '-9999px';
      document.body.appendChild(ta2);
      ta2.select();
      var done = document.execCommand('copy');
      document.body.removeChild(ta2);
      if (done) ok(); else bad();
    } catch (e2) { bad(); }
  }

  /* ------------------------------------------------------------- routing */
  /* Every channel tab and every detail sheet is a real history entry, so the
     browser Back button (and the iPhone swipe-back gesture) returns to the
     previous tab or closes the open sheet instead of leaving the site. */
  var TAB_LIST = ['tours', 'flights', 'hotels', 'quote', 'bookings', 'insurance'];
  var modalTrail = [];
  var openKey = '';
  var appliedHash = '';
  var pushCount = 0;

  function hashNow() {
    var h = location.hash || '';
    return h.charAt(0) === '#' ? h : '#' + h;
  }
  function parseRoute() {
    var parts = hashNow().replace(/^#/, '').split('/').filter(function (p) { return p; });
    var head = parts[0] || '';
    if (head === 'bookings' && parts[1] === 'cancel') return { tab: 'bookings', modal: { kind: 'cancel', id: parts[2] || '' } };
    if (head === 'auth') return { tab: state.tab, modal: { kind: 'auth', id: parts[1] || 'signin' } };
    if (head === 'signup') return { tab: state.tab, modal: { kind: 'auth', id: 'join' } };
    if (head === 'login') return { tab: state.tab, modal: { kind: 'auth', id: 'signin' } };
    if (TAB_LIST.indexOf(head) >= 0) return { tab: head, modal: null };
    if (head === 'tour' && parts[1]) return { tab: 'tours', modal: { kind: 'tour', id: parts[1] } };
    if (head === 'flight' && parts[1]) return { tab: 'flights', modal: { kind: 'flight', id: decodeURIComponent(parts.slice(1).join('/')) } };
    if (head === 'hotel' && parts[1]) return { tab: 'hotels', modal: { kind: 'hotel', id: parts[1] } };
    return { tab: state.tab, modal: null };
  }
  function writeHash(hash, replace) {
    try {
      if (replace) history.replaceState({ app: true }, '', hash);
      else history.pushState({ app: true }, '', hash);
      appliedHash = hash;
      if (!replace) pushCount += 1;
      return true;
    } catch (e) {
      /* local file:// previews reject pushState with a URL — a plain hash change is still a history entry */
      try { if (replace) location.replace(hash); else location.hash = hash.slice(1); } catch (e2) { /* ignore */ }
      appliedHash = hashNow();
      if (!replace) pushCount += 1;
      return false;
    }
  }
  function go(hash, replace) {
    if (!hash) return;
    if (hashNow() === hash && !replace) {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    writeHash(hash, replace);
    applyRoute();
  }
  function showTab(tab, opts) {
    opts = opts || {};
    state.tab = tab;
    TAB_LIST.forEach(function (v) { $('#view-' + v).hidden = v !== tab; });
    renderView(tab);
    applyChrome();
    if (!opts.keepScroll) window.scrollTo({ top: 0, behavior: opts.instant ? 'auto' : 'smooth' });
  }
  function applyRoute() {
    var r = parseRoute();
    if (state.tab !== r.tab) showTab(r.tab, { instant: true });
    var key = r.modal ? r.modal.kind + ':' + r.modal.id : '';
    if (key === openKey) {
      if (!key && $('#modal').classList.contains('open')) hideModal();
      return;
    }
    if (key) {
      var known = r.modal.kind === 'tour' ? !!findTour(r.modal.id)
        : r.modal.kind === 'hotel' ? !!findHotel(r.modal.id)
          : r.modal.kind === 'flight' ? !!findFlight(r.modal.id)
            : true;
      if (!known) { hideModal(); return; }
    }
    openKey = key;
    modalTrail = [];
    if (!key) { hideModal(); return; }
    if (r.modal.kind === 'tour') tourModal(r.modal.id, true);
    else if (r.modal.kind === 'flight') flightModal(r.modal.id, true);
    else if (r.modal.kind === 'hotel') hotelRoomsModal(r.modal.id, true);
    else if (r.modal.kind === 'cancel') cancelBookingModal(r.modal.id, true);
    else if (r.modal.kind === 'auth') authModal(r.modal.id, true);
    else hideModal();
  }
  function onHistoryNav() {
    var h = hashNow();
    if (h === appliedHash) return;
    appliedHash = h;
    if (pushCount > 0) pushCount -= 1;
    applyRoute();
  }

  /* ---- sheets: one renderer per step, so ← Back inside a sheet steps back ---- */
  function modalBar(title) {
    return '<div class="m-bar">' +
      '<button type="button" class="m-back" data-act="modal-back">' + ic.back + '<span>' + t('common.back') + '</span></button>' +
      '<span class="m-bar-t">' + (title || '') + '</span>' +
      '<button type="button" class="m-close-lite" data-act="close-modal" aria-label="' + t('common.close') + '">' + ic.close + '</button>' +
      '</div>';
  }
  function paintModal(html, footerHtml) {
    $('#modalCard').innerHTML = '<div class="m-scroll">' + html + '</div>' + (footerHtml || '');
    $('#modal').classList.add('open');
    $('#modal').setAttribute('aria-hidden', 'false');
    document.body.classList.add('modal-open');
    var sc = $('#modalCard .m-scroll');
    if (sc) sc.scrollTop = 0;
  }
  function showModal(key, render, html, footerHtml) {
    openKey = key;
    modalTrail = render ? [{ render: render }] : [];
    paintModal(html, footerHtml);
  }
  function pushModalStep(render, html, footerHtml) {
    if (render) modalTrail.push({ render: render });
    paintModal(html, footerHtml);
  }
  function hideModal() {
    $('#modal').classList.remove('open');
    $('#modal').setAttribute('aria-hidden', 'true');
    document.body.classList.remove('modal-open');
    openKey = '';
    modalTrail = [];
  }
  function closeModal() {
    if (openKey && pushCount > 0) { history.back(); return; }
    if (openKey) { go('#' + state.tab, true); return; }
    hideModal();
  }
  function modalBack() {
    if (modalTrail.length > 1) {
      modalTrail.pop();
      var top = modalTrail[modalTrail.length - 1];
      if (top && top.render) { top.render(); return; }
    }
    closeModal();
  }

  function newRef(prefix) {
    var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = '';
    for (var i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return prefix + '-' + s;
  }
  function addBooking(b) {
    b.id = 'bk' + Date.now() + Math.floor(Math.random() * 999);
    if (!b.status) b.status = 'confirmed';
    b.createdAt = new Date().toISOString();

    if (fromRoute) showModal('cancel:' + id, function () { cancelBookingModal(id, true); }, html);

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) {
      if (!e.target.closest || !e.target.closest('#langSheet, #langBtn')) {
        $('#langSheet').classList.remove('open');
        $('#langBtn').setAttribute('aria-expanded', 'false');
      }
      return;
    }
    var act = el.getAttribute('data-act');
    if (act === 'tab') { go('#' + el.getAttribute('data-tab')); }
    else if (act === 'modal-back') { modalBack(); }
    else if (act === 'cur') { state.cur = el.getAttribute('data-cur'); save(); renderAll(); }
    else if (act === 'lang') {
      state.lang = el.getAttribute('data-lang'); save();
      $('#langSheet').classList.remove('open');
      $('#langBtn').setAttribute('aria-expanded', 'false');
      renderAll();
    }
    else if (act === 'cat') { state.cat = el.getAttribute('data-cat'); $('#view-tours').innerHTML = viewTours(); }
    else if (act === 'scroll-tours') {
      var el2 = $('#tourList'); if (el2) el2.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    else if (act === 'tour') { tourModal(el.getAttribute('data-id')); }
    else if (act === 'book-tour') { tourBookingModal(el.getAttribute('data-id')); }
    else if (act === 'close-modal') { closeModal(); }
    else if (act === 'goto-bookings') { go('#bookings'); }
    else if (act === 'trip') { state.f.trip = el.getAttribute('data-trip'); $('#view-flights').innerHTML = viewFlights(); }
    else if (act === 'swap') {
      var a = state.f.from; state.f.from = state.f.to; state.f.to = a;
      $('#view-flights').innerHTML = viewFlights();
    }
    else if (act === 'flight-sort') { state.f.sort = el.getAttribute('data-sort'); $('#view-flights').innerHTML = viewFlights(); }
    else if (act === 'flight-select') { flightModal(el.getAttribute('data-key')); }
    else if (act === 'hotel-stars') { state.h.stars = parseInt(el.getAttribute('data-stars'), 10); $('#view-hotels').innerHTML = viewHotels(); }
    else if (act === 'hotel-rooms') { hotelRoomsModal(el.getAttribute('data-id')); }
    else if (act === 'hotel-select') { hotelBookingModal(el.getAttribute('data-id'), el.getAttribute('data-room')); }
    else if (act === 'q-start') {
      var wrap = $('#qWrap');
      if (wrap) wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    else if (act === 'q-svc') {
      var svc = el.getAttribute('data-svc');
      state.q.svc[svc] = !state.q.svc[svc];
      var row = el.closest('.qsvc-row');
      if (row) {
        row.classList.toggle('on', state.q.svc[svc]);
        var body = row.querySelector('.qsvc-body');
        if (body) body.hidden = !state.q.svc[svc];
        var st = row.querySelector('.qsvc-state');
        if (st) st.textContent = t(state.q.svc[svc] ? 'quote.included' : 'quote.notIncluded');
      }
      el.setAttribute('aria-pressed', state.q.svc[svc] ? 'true' : 'false');
      renderQuoteEstimate();
    }
    else if (act === 'q-veh') {
      state.q.veh = el.getAttribute('data-v');
      $$('#view-quote [data-act="q-veh"]').forEach(function (b) {
        b.classList.toggle('on', b.getAttribute('data-v') === state.q.veh);
      });
      renderQuoteEstimate();
    }
    else if (act === 'q-glang') {
      state.q.glang = el.getAttribute('data-lang');
      $$('#view-quote [data-act="q-glang"]').forEach(function (b) {
        b.classList.toggle('on', b.getAttribute('data-lang') === state.q.glang);
      });
      renderQuoteEstimate();
    }
    else if (act === 'q-hotel') {
      state.q.hotel = el.getAttribute('data-v');
      $$('#view-quote [data-act="q-hotel"]').forEach(function (b) {
        b.classList.toggle('on', b.getAttribute('data-v') === state.q.hotel);
      });
      renderQuoteEstimate();
    }
    else if (act === 'q-opt') {
      var opt = el.getAttribute('data-opt');
      state.q[opt] = !state.q[opt];
      el.classList.toggle('on', !!state.q[opt]);
      el.setAttribute('aria-pressed', state.q[opt] ? 'true' : 'false');
      renderQuoteEstimate();
    }
    else if (act === 'q-region') {
      var rg = el.getAttribute('data-r');
      var idx = state.q.regions.indexOf(rg);
      if (idx >= 0) {
        if (state.q.regions.length === 1) { toast(t('quote.regions.hint')); return; }
        state.q.regions.splice(idx, 1);
      } else {
        state.q.regions.push(rg);
      }
      el.classList.toggle('on', state.q.regions.indexOf(rg) >= 0);
      if (rg === 'custom') {
        var cw = $('#qCustomWrap');
        if (cw) cw.hidden = state.q.regions.indexOf('custom') < 0;
      }
      renderQuoteEstimate();
    }
    else if (act === 'q-top-region') {
      state.q.topRegion = el.getAttribute('data-r');
      renderToppingsUI();
    }
    else if (act === 'q-top-add') { topToggle(el.getAttribute('data-id')); }
    else if (act === 'q-top-day') { topMove(el.getAttribute('data-id'), parseInt(el.getAttribute('data-d'), 10)); }
    else if (act === 'q-top-plan') {
      topPlanAll();
      renderToppingsUI();
      toast(t('quote.top.planToast'));
    }
    else if (act === 'q-top-clear') {
      state.q.topics = [];
      renderToppingsUI();
      toast(t('quote.top.clearedToast'));
    }
    else if (act === 'q-copy') { copyQuote(el.getAttribute('data-ref')); }
    else if (act === 'print-tour') { printDoc('tour', el.getAttribute('data-id')); }
    else if (act === 'dl-tour') { downloadDoc('tour', el.getAttribute('data-id')); }
    else if (act === 'print-quote') { printDoc('quote'); }
    else if (act === 'dl-quote') { downloadDoc('quote'); }
    else if (act === 'cancel-booking') {
      cancelBookingModal(el.getAttribute('data-id'));
    }
    else if (act === 'cancel-yes') {
      var bid = el.getAttribute('data-id');
      state.bookings.forEach(function (b) { if (b.id === bid) b.status = 'cancelled'; });
      save();
      go('#bookings', true);
      renderView('bookings');
      toast(t('toast.cancelled'));
    }
    else if (act === 'ins-copy') { copyIns(el.getAttribute('data-ref')); }
    else if (act === 'auth') { go(authCurrent() ? '#auth/account' : '#auth/signin'); }
    else if (act === 'auth-tab') { go('#auth/' + el.getAttribute('data-t'), true); }
    else if (act === 'auth-type') {
      state.authType = el.getAttribute('data-type');
      $$('#modalCard [data-act="auth-type"]').forEach(function (b) {
        var on = b.getAttribute('data-type') === state.authType;
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      var co = $('#authCoWrap'), biz = $('#authBizWrap');
      if (co) co.hidden = state.authType !== 'agency';
      if (biz) biz.hidden = state.authType !== 'agency';
    }
    else if (act === 'auth-close') { go('#' + state.tab, true); }
    else if (act === 'logout') { authLogout(); }
    else if (act === 'ins-plan') {
      state.ins.plan = el.getAttribute('data-p');
      $$('#insPlans [data-act="ins-plan"]').forEach(function (b) {
        var on = b.getAttribute('data-p') === state.ins.plan;
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      renderInsEstimate();
    }
    else if (act === 'lang-toggle') {
      var open = $('#langSheet').classList.toggle('open');
      $('#langBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
    }
  });

  $('#langBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    var open = $('#langSheet').classList.toggle('open');
    this.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  document.addEventListener('input', function (e) {
    var el = e.target;
    var inf = el.getAttribute && el.getAttribute('data-ins-field');
    if (inf) {
      state.ins[inf] = el.value;
      if (inf === 'arrive' || inf === 'depart' || inf === 'pax') renderInsEstimate();
      return;
    }
    var qf = el.getAttribute && el.getAttribute('data-q-field');
    if (!qf) return;
    state.q[qf] = el.value;
    if (qf === 'pax' || qf === 'start' || qf === 'end') renderToppingsUI();
    else if (qf === 'custom') renderQuoteEstimate();
  });

  document.addEventListener('change', function (e) {
    var el = e.target;
    var inf = el.getAttribute && el.getAttribute('data-ins-field');
    if (inf) {
      state.ins[inf] = el.value;
      if (inf === 'arrive' && state.ins.depart && state.ins.depart < state.ins.arrive) {
        state.ins.depart = state.ins.arrive;
        var dep = $('#insDepart');
        if (dep) { dep.value = state.ins.depart; dep.min = state.ins.arrive; }
      }
      if (inf === 'arrive') { var dep2 = $('#insDepart'); if (dep2) dep2.min = state.ins.arrive; }
      if (inf === 'arrive' || inf === 'depart' || inf === 'pax') renderInsEstimate();
      return;
    }
    var f = el.getAttribute && el.getAttribute('data-field');
    if (!f) return;
    var form = el.closest('[data-form]');
    if (!form) return;
    var kind = form.getAttribute('data-form');
    if (kind === 'flight-search') {
      state.f[f] = (f === 'pax') ? parseInt(el.value, 10) : el.value;
      if (f === 'depart' && state.f.ret < state.f.depart) {
        state.f.ret = state.f.depart;
        $('#fRet').value = state.f.ret;
      }
    }
    if (kind === 'hotel-search') {
      state.h[f] = (f === 'guests' || f === 'rooms') ? parseInt(el.value, 10) : el.value;
      if (f === 'cin' && state.h.cout <= state.h.cin) {
        state.h.cout = iso(addDays(new Date(state.h.cin + 'T00:00:00'), 2));
        $('#hOut').value = state.h.cout;
      }
    }
  });

  document.addEventListener('submit', function (e) {
    var form = e.target.closest ? e.target.closest('form[data-form]') : null;
    if (!form) return;
    e.preventDefault();
    var kind = form.getAttribute('data-form');
    if (kind === 'flight-search') { $('#view-flights').innerHTML = viewFlights(); return; }
    if (kind === 'hotel-search') { $('#view-hotels').innerHTML = viewHotels(); return; }
    if (kind === 'signin') { authSubmitSignin(form); return; }
    if (kind === 'signup') { authSubmitSignup(form); return; }
    if (kind === 'insurance') { insSubmit(form); return; }
    var data = {};
    Array.prototype.forEach.call(form.elements, function (el) {
      if (el.name) data[el.name] = el.value.trim();
    });
    var err = $('#formErr');
    var problems = [];
    if (kind === 'quote' && (!data.agency || data.agency.length < 2)) problems.push(t('quote.errAgency'));
    if (kind === 'quote' && !qCalc().lines.length) problems.push(t('quote.est.empty'));
    if (!data.name || data.name.length < 2) problems.push(t('form.errName'));
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(data.email || '')) problems.push(t('form.errEmail'));
    if (!data.phone || data.phone.replace(/[^0-9]/g, '').length < 5) problems.push(t('form.errPhone'));
    if (problems.length) {
      if (err) { err.style.display = 'block'; err.textContent = problems.join(' '); }
      return;
    }
    if (kind === 'tour') {
      var tour = null;
      DATA.tours.forEach(function (x) { if (x.id === form.getAttribute('data-id')) tour = x; });
      var pax = parseInt(form.querySelector('[name=pax]').value, 10);
      var b = {
        type: 'tour', tourId: tour.id, date: data.date, pax: pax,
        pickup: data.pickup, total: tour.price * pax, ref: newRef('TR'),
        name: data.name, email: data.email, phone: data.phone, notes: data.notes
      };
      addBooking(b);
      successView(t('success.tour.title'), t('success.tour.sub'), b.ref);
      toast(t('toast.tour'));
    }
    if (kind === 'flight') {
      var fl = findFlight(form.getAttribute('data-key'));
      var total = fl.price * state.f.pax;
      var fb = {
        type: 'flight', from: fl.from, to: fl.to, airline: fl.airline, no: fl.no,
        date: state.f.depart, ret: state.f.trip === 'round' ? state.f.ret : '',
        pax: state.f.pax, cabin: state.f.cabin, total: total, ref: newRef('FL'),
        name: data.name, email: data.email, phone: data.phone
      };
      addBooking(fb);
      successView(t('success.flight.title'), t('success.flight.sub'), fb.ref);
      toast(t('toast.flight', { ref: fb.ref }));
    }
    if (kind === 'hotel') {
      var h = findHotel(form.getAttribute('data-id'));
      var rk = form.getAttribute('data-room');
      var room = null; h.rooms.forEach(function (r) { if (r.key === rk) room = r; });
      var n = diffDays(state.h.cin, state.h.cout);
      var hb = {
        type: 'hotel', hotelId: h.id, roomKey: rk, cin: state.h.cin, cout: state.h.cout,
        nights: n, rooms: state.h.rooms, guests: state.h.guests,
        total: roomPrice(h, room) * n * state.h.rooms, ref: newRef('HT'),
        name: data.name, email: data.email, phone: data.phone
      };
      addBooking(hb);
      successView(t('success.hotel.title'), t('success.hotel.sub'), hb.ref);
      toast(t('toast.hotel', { ref: hb.ref }));
    }
    if (kind === 'quote') {
      var qc = qCalc();
      var qb = {
        type: 'quote', status: 'requested', ref: newRef('QT'),
        start: state.q.start, end: state.q.end, days: qc.days, nights: qc.nights, pax: qc.pax,
        regions: state.q.regions.slice(), custom: state.q.custom,
        vehicle: state.q.svc.vehicle ? state.q.veh : '',
        guide: state.q.svc.guide ? state.q.glang : '',
        hotel: state.q.svc.hotel ? state.q.hotel : '',
        mice: !!state.q.mice, gala: !!state.q.gala, meet: !!state.q.meet,
        toppings: topSel().map(function (x) { return { id: x.id, day: x.day }; }),
        toppingTotal: qc.topTotal,
        total: qc.total, agency: data.agency, name: data.name, email: data.email,
        phone: data.phone, notes: data.notes
      };
      addBooking(qb);
      quoteSuccessModal(qb);
      toast(t('quote.toast'));
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeModal(); $('#langSheet').classList.remove('open'); }
  });
  $('#modal').addEventListener('click', function (e) {
    if (e.target === this) closeModal();
  });

  /* ----------------------------------------------------------------- boot */
  function boot() {
    load();
    if (!state._savedLang) state.lang = detectLang();
    var today = new Date();
    state.f.depart = iso(addDays(today, 14));
    state.f.ret = iso(addDays(today, 18));
    state.h.cin = iso(addDays(today, 14));
    state.h.cout = iso(addDays(today, 16));
    state.q.start = iso(addDays(today, 30));
    state.q.end = iso(addDays(today, 33));
    state.ins.arrive = iso(addDays(today, 14));
    state.ins.depart = iso(addDays(today, 18));
    state.session = authSessionGet();
    injectPrintCss();
    applyMemberToForms();
    renderLangSheet();
    renderAll();
    var startHash = hashNow();
    if (!startHash || startHash === '#' || startHash === '#/') startHash = '#' + state.tab;
    writeHash(startHash, true);   // the first entry is replaced, so Back still leaves the site only once
    pushCount = 0;
    applyRoute();
    window.addEventListener('popstate', onHistoryNav);
    window.addEventListener('hashchange', onHistoryNav);
    // expose a tiny hook for automated smoke tests
    window.__MK = {
      state: state,
      setLang: function (l) { state.lang = l; renderAll(); },
      setTab: function (tb) { go('#' + tb); },
      go: function (h) { go(h); },
      back: function () { history.back(); },
      route: function () { return { tab: state.tab, hash: hashNow(), modal: openKey, trail: modalTrail.length, depth: pushCount }; },
      tours: function () { return DATA.tours.length; },
      quoteSummary: function () { return qSummary(); },
      quoteTotal: function () { return qCalc().total; },
      quoteLines: function () { return qCalc().lines.length; },
      authSession: function () { return authCurrent(); },
      authMembers: function () { return authMembers().length; },
      signOut: function () { authLogout(); },
      insPremium: function () {
        var c = insCalc();
        return { plan: c.plan.key, days: c.days, pax: c.pax, disc: c.disc,
          perPerson: c.perPerson, total: c.total };
      },
      insPlans: function () { return INS_PLANS.length; },
      toppings: function () { return topPicked().length; },
      toppingTotal: function () { return qCalc().topTotal || 0; },
      toppingPlan: function () {
        return topSchedule().map(function (d) {
          return { day: d.day, ids: d.rows.map(function (r) { return r.id; }) };
        });
      },
      printSheet: function () { return $('#printSheet') ? $('#printSheet').innerHTML : ''; },
      printDoc: printDoc,
      downloadDoc: downloadDoc,
      brochure: function (kind, id) {
        return kind === 'tour' ? tourSheet(findTour(id), '') : quoteSheet();
      },
      fileNameFor: function (kind, id) {
        if (kind === 'tour') {
          var x = findTour(id);
          return x ? 'MEMBERS_Tour_' + fileSlug(I18N['tour.' + x.id + '.title'].en) + '.html' : '';
        }
        return 'MEMBERS_Tour_Custom_Itinerary_' + (state.q.start || iso(new Date())) + '.html';
      }
    };
  }
  boot();
})();

</script>
</body>
</html>
