/* =====================================================================

:root{
  --navy:#164E63;
  --navy-2:#1B5E96;
  --teal:#2A8C82;
  --teal-2:#38A39D;
  --accent:#E8826B;

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Hiragino Sans","PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,"Liberation Sans","Noto Sans",sans-serif;

}

button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}

h1,h2,h3,h4,p{margin:0}
ul{margin:0;padding:0;list-style:none}
input,select,textarea{font:inherit;color:inherit}
.container{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 16px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------------- header ---------------- */
.app-header{
  position:sticky;top:0;z-index:40;
  background:rgba(255,255,255,.94);
  backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);

}
.header-inner{display:flex;align-items:center;gap:12px;height:var(--header-h);max-width:var(--maxw);margin:0 auto;padding:0 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
/* logo slot: replaced by <img> when BRAND.logoImage is set */
.brand-mark{width:40px;height:40px;flex:0 0 40px;border-radius:50%;overflow:hidden;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 1px rgba(22,78,99,.10)}
.brand-mark svg{width:100%;height:100%}

.brand-text{min-width:0;line-height:1.15}
.brand-text strong{display:block;font-size:16px;letter-spacing:-.02em;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.header-tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.seg{display:inline-flex;background:#EEF3F8;border-radius:999px;padding:3px}

.icon-btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:999px;background:#EEF3F8;color:var(--navy);font-size:12px;font-weight:700}

/* member sign-up / sign-in button (header): icon + label, shrinks to an icon on phones */
.auth-btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 11px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--navy);font-size:12px;font-weight:800;letter-spacing:-.01em;box-shadow:var(--shadow-sm);max-width:190px;min-width:0}
.auth-btn .ab-ico{display:grid;place-items:center;width:18px;height:18px;flex:0 0 18px;color:var(--teal)}
.auth-btn .ab-ico svg{width:17px;height:17px}
.auth-btn .ab-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

.auth-btn .ab-b2b{font-size:8.5px;font-weight:800;letter-spacing:.06em;color:#8A4C3C;background:var(--accent-soft);border-radius:999px;padding:2px 5px;flex:0 0 auto}

.lang-sheet{
  position:fixed;top:calc(var(--header-h) + env(safe-area-inset-top));right:12px;z-index:45;

.lang-sheet button.on{color:var(--teal);background:#EDF7F5}
.lang-sheet .code{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em}

.channel-bar{

.channel-item{

.channel-item .ch-txt{min-width:0;display:flex;flex-direction:column;line-height:1.15}
.channel-item .ch-l{font-size:13.5px;font-weight:800;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.channel-item .ch-s{display:none;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.channel-item .ch-sub{font-size:10px;font-weight:600;color:#9FBECC;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.channel-item.on{

/* ---------------- section shell ---------------- */
.view{padding:26px 0 34px}

.chip-row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}

.chip{

}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 6px 14px rgba(11,34,57,.18)}
.chip:active{transform:scale(.97)}

/* ---------------- cards ---------------- */
.grid{display:grid;gap:16px;grid-template-columns:1fr}
.tour-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;

}

}

.badge.accent{background:var(--accent);color:#3B2506}
.badge.teal{background:var(--teal);color:#fff}
.cover .code{
  position:absolute;bottom:10px;right:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:10.5px;font-weight:700;letter-spacing:.06em;color:rgba(255,255,255,.9);
  background:rgba(9,24,38,.42);padding:4px 8px;border-radius:999px;backdrop-filter:blur(6px);
}
.card-body{padding:14px 15px 16px;display:flex;flex-direction:column;gap:9px;flex:1}
.card-top{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--teal)}

.card-top .loc svg{width:12px;height:12px}
.tour-card h3{font-size:16.5px;line-height:1.32;letter-spacing:-.015em;color:var(--navy);font-weight:800}

.rating svg{width:14px;height:14px;color:var(--accent)}

.swap-btn svg{width:15px;height:15px}
.demo-strip{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:11px;color:#8A4C3C;background:var(--accent-soft);border:1px solid #F6D6CD;border-radius:10px;padding:7px 10px;line-height:1.35}
.demo-strip svg{width:13px;height:13px;flex:0 0 13px;color:#C36A53}
/* ------------------------------------------- live partner booking (affiliate) */
.live-card{background:linear-gradient(135deg,#0E3A4E,#164E63 58%,#1B5E96);color:#fff;border-radius:var(--radius);padding:15px 16px;box-shadow:0 14px 30px rgba(14,58,78,.28);display:flex;flex-direction:column;gap:9px;min-width:0;margin-top:12px}
.live-card h3{font-size:16px;letter-spacing:-.01em;color:#fff;min-width:0}
.live-card p{font-size:12.5px;line-height:1.5;color:rgba(255,255,255,.8);margin:0;min-width:0;overflow-wrap:anywhere}
.live-badge{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;max-width:100%;font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#CFF3EC;background:rgba(56,163,157,.22);border:1px solid rgba(56,163,157,.55);border-radius:999px;padding:4px 9px;line-height:1.3}
.live-badge svg{width:12px;height:12px;flex:0 0 12px}
.live-cta{display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;min-height:46px;padding:11px 13px;border-radius:13px;background:linear-gradient(135deg,#38A39D,#2A8C82);color:#fff;font-size:13.5px;font-weight:800;line-height:1.3;text-align:center;text-decoration:none;box-shadow:0 8px 20px rgba(14,124,123,.34)}
.live-cta span{min-width:0}
.live-cta:hover{filter:brightness(1.06)}
.live-cta svg{width:16px;height:16px;flex:0 0 16px}
.live-note{margin:0;font-size:10.5px;line-height:1.45;color:rgba(255,255,255,.62)}
.live-mini{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--teal);text-decoration:none;min-width:0;overflow-wrap:anywhere}
.live-mini svg{width:13px;height:13px;flex:0 0 13px}
.live-mini:hover{color:var(--navy)}
.live-strip{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;padding:10px 12px;border:1px solid #CFE7E2;background:#F1FAF8;border-radius:12px;min-width:0}
.live-strip .ls-t{display:flex;align-items:center;gap:6px;min-width:0;font-size:12px;font-weight:700;color:var(--navy)}
.live-strip .ls-t svg{width:14px;height:14px;flex:0 0 14px;color:var(--teal)}
.live-strip .btn svg{width:14px;height:14px}
.results-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 10px;flex-wrap:wrap}
.results-head h3{font-size:15px;color:var(--navy);letter-spacing:-.01em}
.results-head .sub{font-size:12px;color:var(--muted);margin-top:2px}
.sort-row{display:flex;gap:6px}
.sort-row button{font-size:12px;font-weight:700;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted)}
.sort-row button.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* ---------------- flight card ---------------- */
.flight{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:14px;display:flex;flex-direction:column;gap:12px}
.flight-top{display:flex;align-items:center;gap:10px}
.airline-logo{width:34px;height:34px;border-radius:10px;background:#EEF3F8;display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--navy);letter-spacing:.02em;flex:0 0 34px}
.flight-top .airline{font-size:13px;font-weight:700;color:var(--navy)}
.flight-top .fno{font-size:11px;color:var(--muted);margin-top:1px}
.flight-top .tag{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--teal);background:#E9F5F2;padding:4px 8px;border-radius:999px}
.route{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.route .t{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-.02em;line-height:1.1}
.route .ap{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.route .mid{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);font-weight:600}
.route .line{width:100%;height:2px;background:linear-gradient(90deg,#D7E1EC,#9FB6C9,#D7E1EC);border-radius:2px;position:relative}
.route .line::before,.route .line::after{content:"";position:absolute;top:50%;width:5px;height:5px;border-radius:50%;background:#8FA9BF;transform:translateY(-50%)}
.route .line::before{left:0}.route .line::after{right:0}
.route .arr{text-align:right}
.flight-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px dashed var(--line);padding-top:11px}
.flight-bottom .price b{font-size:19px}
.btn-sm{height:40px;padding:0 16px;border-radius:12px;font-size:13.5px;font-weight:700}

/* ---------------- hotel card ---------------- */
.hotel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);display:flex;flex-direction:column}
.hotel-cover{position:relative;aspect-ratio:16/7;background:var(--navy)}
.hotel-cover .art{width:100%;height:100%;object-fit:cover;display:block}
.hotel-cover img.art{transition:transform .5s cubic-bezier(.2,.6,.2,1)}
.hotel:hover .hotel-cover img.art{transform:scale(1.04)}
.hotel-cover .stars{position:absolute;top:10px;left:12px;display:flex;gap:2px}
.hotel-cover .stars svg{width:13px;height:13px;color:var(--accent);filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.hotel-body{padding:13px 15px 15px;display:flex;flex-direction:column;gap:10px}
.hotel-body h3{font-size:16px;color:var(--navy);letter-spacing:-.015em;font-weight:800;line-height:1.3}
.hotel-area{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.hotel-area svg{width:12px;height:12px}
.amenities{display:flex;flex-wrap:wrap;gap:6px}
.amenity{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#4A5A72;background:#F3F6FA;border-radius:999px;padding:4px 8px}
.amenity svg{width:12px;height:12px;color:var(--teal)}
.hotel-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-top:1px dashed var(--line);padding-top:11px;margin-top:auto}
.breakfast-flag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--ok);background:#EAF7F1;border-radius:8px;padding:4px 8px;width:max-content}
.breakfast-flag svg{width:12px;height:12px}

/* ---------------- rooms / modal content ---------------- */
.room-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.room-row:last-child{border-bottom:0}
.room-row .rn{font-size:14px;font-weight:700;color:var(--navy)}
.room-row .rd{font-size:11.5px;color:var(--muted);margin-top:2px}
.room-row .rp{text-align:right;flex:0 0 auto}
.room-row .rp b{display:block;font-size:15px;color:var(--navy)}
.room-row .rp small{font-size:10.5px;color:var(--muted)}
.m-hd{position:relative}
.m-hd .cover{aspect-ratio:16/8;border-radius:0}
.m-hd .m-close{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;color:var(--navy);box-shadow:var(--shadow-sm);z-index:3}
.m-hd .m-close svg{width:17px;height:17px}
/* back button: one tap returns to the previous screen (and the browser history too) */
.m-back{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 12px 0 9px;border-radius:999px;background:#EEF3F8;color:var(--navy);font-size:12.5px;font-weight:800;letter-spacing:-.01em}
.m-back svg{width:16px;height:16px}
.m-back:active{transform:scale(.97)}
.m-back-float{position:absolute;top:12px;left:12px;z-index:3;background:rgba(255,255,255,.96);box-shadow:var(--shadow-sm)}
.m-bar{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:8px;padding:9px 12px;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.m-bar-t{flex:1 1 auto;min-width:0;font-size:12.5px;font-weight:800;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.m-close-lite{width:34px;height:34px;border-radius:50%;background:#EEF3F8;display:grid;place-items:center;color:var(--navy);flex:0 0 34px}
.m-close-lite svg{width:16px;height:16px}
.itin-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.itin-list li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.45;color:#2B3A4C;background:#F6F9FB;border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.itin-list .d{flex:0 0 34px;font-size:11px;font-weight:800;letter-spacing:.04em;color:#fff;background:linear-gradient(135deg,var(--teal-2),var(--teal));border-radius:8px;padding:3px 0;text-align:center;margin-top:1px}
.m-body{padding:18px 18px 22px}
.m-title{font-size:20px;line-height:1.3;letter-spacing:-.02em;color:var(--navy);font-weight:800}
.m-sub{font-size:12.5px;color:var(--muted);margin-top:5px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.m-sub span{display:inline-flex;align-items:center;gap:4px}
.m-sub svg{width:13px;height:13px}
.m-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 4px}
.m-meta div{background:#F5F8FB;border-radius:12px;padding:10px 12px}
.m-meta dt{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 3px}
.m-meta dd{margin:0;font-size:13px;font-weight:700;color:var(--navy);line-height:1.35}
.m-sec{margin-top:18px}
.m-sec h4{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.hl-list li{display:flex;gap:9px;padding:5px 0;font-size:13.5px;color:#2B3A4C;line-height:1.45}
.hl-list svg{width:15px;height:15px;color:var(--teal);flex:0 0 15px;margin-top:2px}
.inc-chips{display:flex;flex-wrap:wrap;gap:6px}
.inc-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:#2B3A4C;background:#F3F6FA;border-radius:9px;padding:6px 9px}
.inc-chip svg{width:12px;height:12px;color:var(--teal)}
.m-footer{position:sticky;bottom:0;z-index:2;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;flex:0 0 auto}
.m-footer .price{flex:1}
.m-footer .btn{height:46px}
/* print / save-as-PDF and file download — a quiet pair of tools in the detail modal
   and next to the live quote, styled as secondary actions */
.m-tools,.qtools{margin-top:14px;padding:12px 13px;border:1px solid var(--line);border-radius:14px;background:#F6FAFB}
.qtools{background:#fff;box-shadow:var(--shadow-sm);margin-top:12px}
.qtools + .qcard{margin-top:12px}
.m-tools-note,.qtools-note{font-size:11.5px;line-height:1.45;color:var(--muted);margin:0 0 9px}
.m-tools-row,.qtools-row{display:flex;gap:8px}
.btn-tool{flex:1 1 0;min-width:0;height:42px;font-size:12.5px;font-weight:700;padding:0 8px;border:1px solid var(--line);background:#fff;color:var(--navy);box-shadow:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-tool:hover{background:#EDF6F5;border-color:#BFDCD8}
.btn-tool:active{transform:scale(.985)}
.form-note{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:10px}
.summary{background:#F5F8FB;border-radius:14px;padding:12px 14px;margin-top:14px;font-size:13px}
.summary .row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;color:#43536B}
.summary .row.total{border-top:1px dashed #D8E1EB;margin-top:7px;padding-top:9px;font-weight:800;color:var(--navy);font-size:14.5px}
.success{text-align:center;padding:34px 22px 26px}
.success .tick{width:64px;height:64px;border-radius:50%;background:#E9F5F2;display:grid;place-items:center;margin:0 auto 16px;color:var(--ok)}
.success .tick svg{width:30px;height:30px}
.success h3{font-size:20px;color:var(--navy);letter-spacing:-.02em}
.success p{font-size:13.5px;color:var(--muted);margin-top:7px;line-height:1.5}
.ref-box{margin:18px auto 0;max-width:320px;border:1px dashed #C9D6E3;border-radius:12px;padding:11px;background:#FBFCFE}
.ref-box small{display:block;font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.ref-box b{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:19px;letter-spacing:.12em;color:var(--navy);margin-top:3px}
.success-actions{display:flex;gap:9px;margin-top:20px}
.success-actions .btn{flex:1}

/* ---------------- bookings ---------------- */
.booking{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:14px;display:flex;flex-direction:column;gap:10px}
.booking-top{display:flex;align-items:center;gap:8px}
.type-badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:#EEF3F8;color:var(--navy)}
.type-badge svg{width:12px;height:12px}
.type-badge.quote{background:#EEF0FB;color:#39407F}
.type-badge.flight{background:#E9F1FB;color:#1D4F8C}
.type-badge.hotel{background:#FDF1E4;color:#96601B}
.type-badge.tour{background:#E9F5F2;color:#0A6A5F}
.status{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ok);display:inline-flex;align-items:center;gap:5px}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.status.cancelled{color:var(--danger)}
.booking h3{font-size:15.5px;color:var(--navy);font-weight:800;letter-spacing:-.01em;line-height:1.3}
.booking .bk-meta{display:flex;flex-wrap:wrap;gap:5px 14px;font-size:12px;color:var(--muted)}
.booking .bk-meta span{display:inline-flex;align-items:center;gap:5px}
.booking .bk-meta svg{width:12px;height:12px}
.booking-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px dashed var(--line);padding-top:10px}
.ref-mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--muted);letter-spacing:.06em}
.link-danger{font-size:12.5px;font-weight:700;color:var(--danger);padding:7px 10px;border-radius:9px;background:#FCF1F0}
.empty{text-align:center;padding:44px 20px;background:#fff;border:1px dashed #D5DFEA;border-radius:var(--radius)}
.empty .ico{width:64px;height:64px;border-radius:50%;background:#EEF3F8;display:grid;place-items:center;margin:0 auto 14px;color:#8FA5BC}
.empty .ico svg{width:28px;height:28px}
.empty h3{font-size:17px;color:var(--navy)}
.empty p{font-size:13px;color:var(--muted);margin:6px 0 16px}

/* ---------------- custom ground / MICE quote ---------------- */
.qhero{
  position:relative;overflow:hidden;color:#fff;background-color:#0B2E3C;
  background-image:
    radial-gradient(620px 300px at 88% -20%, rgba(232,130,107,.30), transparent 62%),
    radial-gradient(760px 340px at 8% -10%, rgba(56,163,157,.34), transparent 66%),
    linear-gradient(96deg, #0A2A38 0%, #10414F 56%, #16545C 100%);
}
.qhero-inner{max-width:var(--maxw);margin:0 auto;padding:30px 16px 26px;display:grid;gap:18px}
.qhero .kicker{color:#9FE3D7}
.qhero h1{font-size:25px;line-height:1.24;letter-spacing:-.03em;margin:10px 0 8px;font-weight:800;max-width:640px}
.qhero p{color:#C6D6E4;font-size:13.5px;line-height:1.6;max-width:600px}
.qhero-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.qhero-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#D7ECE8;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 10px}
.qhero-chip svg{width:12px;height:12px;color:#9FE3D7}
.qhero .btn{margin-top:18px;width:max-content}
.qwrap{display:grid;gap:16px}
.qmain{display:flex;flex-direction:column;gap:14px;min-width:0}
.qcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:15px}
.qcard-head{margin-bottom:12px}
.qstep{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.qcard h3{font-size:16px;color:var(--navy);letter-spacing:-.015em;margin-top:4px;font-weight:800}
.qhint{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45}
.qsvc{display:flex;flex-direction:column;gap:9px}
.qsvc-row{border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:#FBFCFE;transition:border-color .15s, background .15s}
.qsvc-row.on{border-color:#BFE4DD;background:#F4FAF8}
.qsvc-top{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.qbox{width:22px;height:22px;border-radius:7px;border:1.6px solid #C6D3E1;background:#fff;display:grid;place-items:center;flex:0 0 22px;color:#fff}
.qbox svg{width:14px;height:14px;opacity:0;transition:opacity .15s}
.qsvc-row.on .qbox{background:var(--teal);border-color:var(--teal)}
.qsvc-row.on .qbox svg{opacity:1}
.qsvc-top .txt{flex:1 1 auto;min-width:0}
.qsvc-top b{display:block;font-size:14px;color:var(--navy);font-weight:800;line-height:1.3}
.qsvc-top small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.qsvc-state{font-size:10.5px;font-weight:800;letter-spacing:.04em;color:#8A9AAE;white-space:nowrap;padding-top:2px}
.qsvc-row.on .qsvc-state{color:var(--teal)}
.qsvc-body{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line)}
.qsvc-body[hidden]{display:none}
.qsub-label{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.qopt-grid{display:grid;gap:7px;grid-template-columns:1fr}
.qopt{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 11px;transition:.15s}
.qopt:active{transform:scale(.99)}
.qopt.on{border-color:var(--teal);background:#EDF7F5;box-shadow:inset 0 0 0 1px rgba(42,140,130,.22)}
.qopt .qdot{width:17px;height:17px;border-radius:50%;border:1.6px solid #C6D3E1;background:#fff;flex:0 0 17px;margin-top:1px;display:grid;place-items:center;color:#fff}
.qopt .qdot svg{width:10px;height:10px;opacity:0}
.qopt.on .qdot{border-color:var(--teal);background:var(--teal)}
.qopt.on .qdot svg{opacity:1}
.qopt .otxt{flex:1 1 auto;min-width:0}
.qopt b{display:block;font-size:13px;color:var(--navy);font-weight:700;line-height:1.3}
.qopt small{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.35}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchip{font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:#40506A;white-space:nowrap}
.qchip.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 5px 12px rgba(11,34,57,.16)}
.qchip:active{transform:scale(.97)}
.qside{display:flex;flex-direction:column;gap:12px;min-width:0}
.qest{background:linear-gradient(158deg,#0F3D4B 0%,#0A2A36 100%);color:#fff;border-radius:var(--radius);padding:16px;box-shadow:0 14px 30px rgba(8,32,44,.22)}
.qest-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.qest-head h3{font-size:14px;font-weight:800;letter-spacing:-.01em}
.qest-head span{font-size:10.5px;color:#9FE3D7;font-weight:700}
.qest-lines{display:flex;flex-direction:column;gap:6px;margin:12px 0 10px;font-size:11.5px;color:#C6D6E4;line-height:1.4}
.qest-line{display:flex;justify-content:space-between;gap:10px}
.qest-line span:first-child{min-width:0}
.qest-line b{font-weight:700;color:#fff;white-space:nowrap}
.qest-total{border-top:1px solid rgba(255,255,255,.18);padding-top:10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.qest-total small{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#9FE3D7}
.qest-total b{font-size:21px;letter-spacing:-.02em}
.qest-per{font-size:11.5px;color:#9FE3D7;margin-top:3px}
.qest-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:#A9BFCE;margin-top:8px}
.qest-note{display:flex;gap:6px;font-size:10.5px;line-height:1.5;color:#A9BFCE;background:rgba(255,255,255,.06);border-radius:10px;padding:8px 10px;margin-top:12px}
.qest-note svg{width:13px;height:13px;flex:0 0 13px;color:#9FE3D7;margin-top:1px}
.qest-empty{font-size:12.5px;color:#C6D6E4;padding:8px 0}
.qsend{padding-bottom:8px}
.qsend .field-grid{grid-template-columns:1fr 1fr}
.qsend .field.full{grid-column:1/-1}
.qsend .btn{margin-top:12px}
.qbtn-pair{display:flex;gap:8px;margin-top:9px}
.qbtn-pair .btn{flex:1 1 0;min-width:0;height:42px;font-size:12.5px;padding:0 10px}
.qcard .field[hidden]{display:none}
.success .qsum{min-height:0;margin-top:14px;text-align:left;font-size:11px;line-height:1.55;resize:none;overflow:auto}
.qsum{width:100%;margin-top:10px;min-height:96px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.5;border:1px dashed #C9D6E3;border-radius:12px;background:#FBFCFE;color:#3A4A5F;padding:10px;resize:vertical}

/* ---------------- attraction toppings & day-by-day itinerary ---------------- */
.qtop-regions{padding-top:2px;margin-bottom:4px}
.qtop-grid{display:grid;gap:9px;grid-template-columns:1fr}
.qtop-card{border:1px solid var(--line);background:#FBFCFE;border-radius:14px;padding:11px 12px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .15s,background .15s}
.qtop-card.on{border-color:var(--teal);background:#F2FAF8;box-shadow:inset 0 0 0 1px rgba(42,140,130,.18)}
.qtop-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.qtop-cat{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 8px;background:#EEF3F8;color:#40506A;white-space:nowrap}
.qtop-cat svg{width:11px;height:11px}
.qtop-cat.landmark{background:#E9F1FB;color:#1D4F8C}
.qtop-cat.culture{background:#EEF0FB;color:#39407F}
.qtop-cat.nature{background:#E7F5EA;color:#1F6B3A}
.qtop-cat.experience{background:#FDEDE8;color:#9A4B32}
.qtop-cat.food{background:#FDF3E3;color:#8A5A16}
.qtop-dur{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--muted);margin-left:auto;white-space:nowrap}
.qtop-dur svg{width:11px;height:11px}
.qtop-card h4{font-size:13.5px;font-weight:800;color:var(--navy);line-height:1.3;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere}
.qtop-bot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;flex-wrap:wrap}
.qtop-price{font-size:13px;font-weight:800;color:var(--navy);display:inline-flex;align-items:baseline;gap:1px;white-space:nowrap}
.qtop-price small{font-size:10px;font-weight:700;color:var(--muted)}
.qtop-btn{flex:0 0 auto;height:32px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:800;background:#fff;border:1px solid var(--line);color:var(--navy);white-space:nowrap}
.qtop-btn.on{background:var(--teal);border-color:var(--teal);color:#fff}
.qtop-days{display:flex;flex-wrap:wrap;gap:5px;padding-top:8px;border-top:1px dashed var(--line)}
.qday{font-size:10.5px;font-weight:800;padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:#fff;color:#5A6B82;white-space:nowrap}
.qday.on{background:var(--navy);border-color:var(--navy);color:#fff}
.qtop-sum{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:11px;padding-top:10px;border-top:1px dashed var(--line)}
.qtop-sum-txt{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.qtop-sum-txt b{font-size:12.5px;color:var(--navy)}
.qtop-sum-txt span{font-size:11.5px;color:var(--muted)}
.qtop-acts{display:flex;gap:6px;flex-wrap:wrap}
.qlink{font-size:11px;font-weight:800;color:var(--teal);padding:6px 10px;border-radius:999px;background:#EDF7F5}
.qlink.danger{color:var(--danger);background:#FCF1F0}
.qiti-day{border:1px solid var(--line);border-radius:14px;padding:10px 11px;background:#FBFCFE;min-width:0}
.qiti-day + .qiti-day{margin-top:8px}
.qiti-day.free{background:transparent;border-style:dashed;padding:7px 11px}
.qiti-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.qiti-d{font-size:11px;font-weight:800;letter-spacing:.04em;color:#fff;background:linear-gradient(135deg,var(--teal-2),var(--teal));border-radius:8px;padding:3px 9px;white-space:nowrap}
.qiti-date{font-size:11px;font-weight:700;color:var(--navy);white-space:nowrap}
.qiti-tot{font-size:10.5px;font-weight:700;color:var(--muted);margin-left:auto;white-space:nowrap}
.qiti-warn{font-size:10px;font-weight:800;color:#9A4B32;background:var(--accent-soft);border-radius:999px;padding:3px 7px;white-space:nowrap}
.qiti-list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.qiti-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.qiti-time{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;font-weight:700;color:var(--teal);display:flex;flex-direction:column;line-height:1.25;white-space:nowrap}
.qiti-time small{color:var(--muted);font-weight:600}
.qiti-main{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.qiti-main b{font-size:12.5px;color:var(--navy);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qiti-main small{font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qiti-rm{width:26px;height:26px;border-radius:50%;background:#FCF1F0;color:var(--danger);display:grid;place-items:center;flex:0 0 26px}
.qiti-rm svg{width:12px;height:12px}
.qiti-empty{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);background:#FBFCFE;border:1px dashed #D5DFEA;border-radius:12px;padding:11px 12px;line-height:1.45}
.qiti-empty svg{width:15px;height:15px;flex:0 0 15px;color:var(--teal);margin-top:1px}
.qiti-note{display:flex;gap:6px;align-items:flex-start;font-size:10.5px;color:var(--muted);line-height:1.45;margin-top:9px}
.qiti-note svg{width:13px;height:13px;flex:0 0 13px;color:var(--teal);margin-top:1px}
@media (min-width:620px){ .qtop-grid{grid-template-columns:1fr 1fr} }

/* ---------------- member sign-up / sign-in ---------------- */
.auth-tabs{display:flex;gap:6px;background:#EEF3F8;border-radius:14px;padding:4px;margin:14px 0 16px}
.auth-tabs button{flex:1 1 0;height:38px;border-radius:11px;font-size:13.5px;font-weight:800;color:var(--muted)}
.auth-tabs button.on{background:#fff;color:var(--navy);box-shadow:0 1px 5px rgba(11,34,57,.14)}
.auth-types{display:grid;gap:8px;grid-template-columns:1fr}
.auth-type{display:flex;align-items:flex-start;gap:9px;text-align:left;border:1px solid var(--line);background:#FBFCFE;border-radius:13px;padding:10px 11px;transition:.15s}
.auth-type.on{border-color:var(--teal);background:#F2FAF8;box-shadow:inset 0 0 0 1px rgba(42,140,130,.2)}
.auth-type .adot{width:17px;height:17px;border-radius:50%;border:1.6px solid #C6D3E1;background:#fff;flex:0 0 17px;margin-top:1px;display:grid;place-items:center;color:#fff}
.auth-type .adot svg{width:10px;height:10px;opacity:0}
.auth-type.on .adot{background:var(--teal);border-color:var(--teal)}
.auth-type.on .adot svg{opacity:1}
.auth-type b{display:block;font-size:13px;color:var(--navy);font-weight:800;line-height:1.3}
.auth-type small{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.35}
.auth-avatar{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--teal-2),var(--teal));color:#fff;display:grid;place-items:center;font-size:18px;font-weight:800;letter-spacing:.02em;margin:0 auto 10px}
.acc-list{background:#F5F8FB;border-radius:14px;padding:6px 13px;margin-top:14px}
.cmt-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #E6EDF2;font-size:12.5px;color:#43536B}
.cmt-row:last-child{border-bottom:0}
.cmt-row b{color:var(--navy);font-weight:800;text-align:right;overflow-wrap:anywhere}
.m-form{margin-top:16px}
.m-form .field-grid{grid-template-columns:1fr 1fr}
.m-form .field.full{grid-column:1/-1}
.auth-switch{display:block;width:100%;text-align:center;font-size:12.5px;font-weight:800;color:var(--teal);padding:12px 4px 2px}
.auth-note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:12px}

/* ---------------- travel insurance ---------------- */
.ins-plans{display:grid;gap:9px;grid-template-columns:1fr}
.ins-plan{display:flex;flex-direction:column;gap:7px;text-align:left;border:1px solid var(--line);background:#FBFCFE;border-radius:14px;padding:11px 12px;transition:border-color .15s,background .15s;min-width:0}
.ins-plan.on{border-color:var(--teal);background:#F2FAF8;box-shadow:inset 0 0 0 1px rgba(42,140,130,.2)}
.ins-plan .adot{width:17px;height:17px;border-radius:50%;border:1.6px solid #C6D3E1;background:#fff;flex:0 0 17px;display:grid;place-items:center;color:#fff}
.ins-plan .adot svg{width:10px;height:10px;opacity:0}
.ins-plan.on .adot{background:var(--teal);border-color:var(--teal)}
.ins-plan.on .adot svg{opacity:1}
.ins-plan-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ins-plan-top h4{font-size:14px;font-weight:800;color:var(--navy);letter-spacing:-.01em}
.ins-tag{font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:#3B2506;border-radius:999px;padding:3px 6px;white-space:nowrap}
.ins-rate{margin-left:auto;text-align:right;line-height:1.15;white-space:nowrap}
.ins-rate b{display:block;font-size:14.5px;color:var(--navy);letter-spacing:-.02em}
.ins-rate small{font-size:9.5px;font-weight:700;color:var(--muted)}
.ins-desc{font-size:11.5px;color:var(--muted);line-height:1.4}
.ins-ben{display:flex;flex-direction:column;gap:3px;margin:0;padding:0;list-style:none;font-size:11.5px;color:#43536B;line-height:1.35}
.ins-ben li{display:flex;align-items:flex-start;gap:6px;min-width:0}
.ins-ben svg{width:12px;height:12px;color:var(--teal);flex:0 0 12px;margin-top:2px}
.ins-ben b{margin-left:auto;font-weight:800;color:var(--navy);white-space:nowrap;padding-left:6px}
.ins-passport-note{font-size:10.5px;color:var(--muted);line-height:1.45;margin-top:7px;display:flex;gap:6px}
.ins-passport-note svg{width:12px;height:12px;flex:0 0 12px;color:var(--teal);margin-top:1px}
@media (min-width:620px){ .ins-plans{grid-template-columns:repeat(3,1fr)} .auth-types{grid-template-columns:1fr 1fr} }
.type-badge.insurance{background:#EAF4F2;color:#0A6A5F}

/* ---------------- footer ---------------- */
.site-footer{background:#fff;border-top:1px solid var(--line);padding:26px 0 30px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.site-footer .fgrid{display:grid;gap:18px}
.site-footer .fbrand{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.site-footer .fbrand .brand-mark{width:34px;height:34px;flex:0 0 34px;border-radius:50%}
.site-footer .fbrand strong{font-size:15px;color:var(--navy);letter-spacing:-.01em}
.site-footer .fbrand span.ko{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.site-footer h5{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--navy);margin:0 0 8px}
.site-footer p{line-height:1.6}
.site-footer .fcol{display:flex;flex-direction:column;gap:4px}
.site-footer .fcol a,.site-footer .fcol .site-url{color:var(--ink);font-weight:600}
.site-footer .fcol a.site-url{color:#1F6B63;cursor:pointer;text-decoration:none;border-bottom:1px solid rgba(42,140,130,.45);width:max-content}
.site-footer .legal{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;line-height:1.6}
.site-footer .fspec{margin-top:18px}
.site-footer .spec-chips{display:flex;flex-wrap:wrap;gap:6px}
.site-footer .spec-chips span{font-size:11px;font-weight:700;color:#1F6B63;background:#E8F4F1;border:1px solid #CDE6E1;border-radius:999px;padding:4px 10px}

/* ---------------- bottom nav ---------------- */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:35;
  background:rgba(255,255,255,.97);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(5,1fr);gap:1px;
}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 1px;border-radius:12px;color:#8697AB;font-size:10px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.bn-item svg{width:22px;height:22px}
.bn-item.on{color:var(--teal)}
.bn-item.on svg{filter:drop-shadow(0 3px 6px rgba(18,163,148,.25))}
.bn-item .dot{width:4px;height:4px;border-radius:50%;background:var(--teal);opacity:0}
.bn-item.on .dot{opacity:1}

/* ---------------- toast ---------------- */
.toast{
  position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,12px);
  background:var(--navy);color:#fff;font-size:13px;font-weight:600;padding:11px 16px;border-radius:12px;
  box-shadow:0 14px 34px rgba(11,34,57,.3);z-index:80;opacity:0;pointer-events:none;transition:.25s;
  max-width:calc(100% - 32px);text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------------- modal ---------------- */
.modal{position:fixed;inset:0;z-index:70;display:none;background:rgba(8,22,36,.56);backdrop-filter:blur(3px);align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal-card{background:#fff;width:100%;max-width:560px;max-height:93vh;overflow:hidden;display:flex;flex-direction:column;border-radius:24px 24px 0 0;animation:sheetUp .3s cubic-bezier(.2,.8,.2,1);position:relative}
.m-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0}
@keyframes sheetUp{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}
body.modal-open{overflow:hidden}

/* ---------------- desktop ---------------- */
@media (min-width:620px){
  .field-grid{grid-template-columns:repeat(4,1fr)}
  .field.full{grid-column:span 2}
  .grid{grid-template-columns:repeat(2,1fr)}
  .hero h1{font-size:36px}
  .grid.flights{grid-template-columns:1fr}
  .site-footer .fgrid{grid-template-columns:1.4fr 1fr 1fr}
}
@media (min-width:620px){
  .qopt-grid{grid-template-columns:1fr 1fr}
  .qsend .field-grid{grid-template-columns:1fr 1fr}
}
@media (min-width:900px) and (max-width:1140px){
  .brand-text small{display:none}
}
@media (min-width:900px){
  :root{--header-h:72px}
  body{padding-bottom:0}
  .bottom-nav{display:none}
  .header-inner{height:72px}
  .brand-mark{width:42px;height:42px}
  .brand-text strong{font-size:17px}
  .channel-bar{position:sticky;top:var(--header-h)}
  .channel-inner{padding:10px 16px;gap:10px}
  .channel-item{padding:10px 14px;justify-content:flex-start}
  .channel-item .ch-l{font-size:14.5px}
  .channel-item .ch-sub{font-size:10px}
  .hero-inner{grid-template-columns:1fr;padding:34px 16px 32px;gap:26px;max-width:1120px}
  .hero{background-image:
    radial-gradient(760px 320px at 90% -20%, rgba(56,163,157,.28), transparent 60%),
    linear-gradient(94deg, rgba(5,21,33,.93) 0%, rgba(6,27,39,.72) 34%, rgba(7,34,47,.32) 70%, rgba(9,43,55,.16) 100%),
    url("images/hero-seoul.webp");
    background-size:cover, cover, cover;
    background-position:center, center, 52% 42%;
  }
  .hero-copy{position:relative;z-index:2;max-width:600px}
  .hero h1{font-size:36px}
  .hero p{font-size:15.5px}
  .grid{grid-template-columns:repeat(3,1fr);gap:20px}
  .grid.flights{grid-template-columns:repeat(2,1fr)}
  .grid.hotels{grid-template-columns:repeat(3,1fr)}
  .grid.bookings{grid-template-columns:repeat(2,1fr)}
  .modal{align-items:center;padding:24px}
  .modal-card{border-radius:22px;max-height:88vh;box-shadow:0 30px 70px rgba(5,16,28,.4)}
  .m-hd .cover{aspect-ratio:16/7}
  .section-head h2{font-size:24px}
  .toast{bottom:34px}
  .view{padding:34px 0 46px}
  .panel{padding:18px}
  .m-meta{grid-template-columns:repeat(4,1fr)}
  .qwrap{grid-template-columns:minmax(0,1fr) 372px;gap:20px;align-items:start}
  .qside{position:sticky;top:calc(var(--header-h) + 18px)}
  .qhero-inner{padding:44px 16px 38px}
  .qhero h1{font-size:34px}
  .qhero p{font-size:15px}
  .qcard{padding:18px}
  .qopt-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:619px){
  .channel-inner{padding:8px 10px;gap:5px}
  .channel-item{flex-direction:column;gap:4px;padding:7px 4px;border-radius:12px}
  .channel-item .ch-ico{width:26px;height:26px;flex:0 0 26px;border-radius:9px}
  .channel-item .ch-ico svg{width:16px;height:16px}
  .channel-item .ch-txt{align-items:center;text-align:center}
  .channel-item .ch-l{display:none}
  .channel-item .ch-s{display:block;font-size:10.5px}
  .channel-item .ch-sub{display:none}
}
@media (max-width:430px){
  .brand-text strong{font-size:15px}
  .brand-text small{font-size:10px}
  .header-inner{gap:8px;padding:0 12px}
  .brand-mark{width:36px;height:36px;flex:0 0 36px}
  .seg button{padding:5px 8px;font-size:11px}
  .seg button .code{display:none}
  .icon-btn{padding:0 9px}
  .auth-btn{padding:0 9px;max-width:44px}
  .auth-btn .ab-txt{display:none}
}
/* phones and small tablets: the six channels sit in a tidy 3 × 2 grid */
@media (max-width:899px){
  .channel-inner{grid-template-columns:repeat(3,1fr)}
  .channel-item .ch-sub{display:none}
}
@media (max-width:619px){
  .auth-btn .ab-txt{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>
</head>
<body>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<header class="app-header">
  <div class="header-inner">
    <a class="brand" href="#" id="brandHome" aria-label="Home">
      <span class="brand-mark" id="brandMark"></span>
      <span class="brand-text">
        <strong data-brand="name">Morning Korea</strong>
        <small data-i18n="app.tagline">Korea, planned by locals</small>
      </span>
    </a>
    <div class="header-tools">
      <div class="seg" id="curSeg" role="group" aria-label="Currency">
        <button type="button" data-act="cur" data-cur="KRW" class="on">₩ <span class="code">KRW</span></button>
        <button type="button" data-act="cur" data-cur="USD">$ <span class="code">USD</span></button>
      </div>
      <button type="button" class="icon-btn" id="langBtn" aria-haspopup="true" aria-expanded="false" aria-label="Language">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18"/></svg>
        <span id="langLabel">EN</span>

|Bote en la cueva de Gwangcheon|Almuerzo de tortitas de trigo sarraceno|Grupo de máx. 40","vi":"Đường mòn sinh thái Olympic|Đi thuyền hang Gwangcheon|Bữa trưa bánh kiều mạch|Nhóm tối đa 40 khách"},"tour.ad02.title":{"en":"Andong Hahoe Village & Folk Market Day Tour","ko":"안동 하회마을 & 전통시장 당일투어","zh":"安东河回村与传统市场一日游","ja":"安東河回村＆伝統市場日帰りツアー","ru":"Андон: деревня Хахве и народный рынок","es":"Andong: aldea Hahoe y mercado tradicional","vi":"Andong: làng Hahoe & chợ truyền thống"},"tour.ad02.desc":{"en":"A UNESCO-listed hanok village, a mask dance stage and the food stalls of Andong's old market.","ko":"유네스코 하회마을의 한옥 골목과 탈춤 공연, 안동 구시장 먹거리를 하루에 담았습니다.","zh":"一天走遍联合国教科文组织河回韩屋村、假面舞表演与安东老市场小吃。","ja":"世界遺産の河回韓屋村、仮面舞踊、安東の旧市場グルメを一日で。","ru":"Деревня ханок из списка ЮНЕСКО, театр масок и еда на старом рынке Андона.","es":"Aldea hanok de la UNESCO, danza de máscaras y puestos del mercado antiguo de Andong.","vi":"Làng hanok di sản UNESCO, múa mặt nạ và chợ cũ Andong trong một ngày."},"tour.ad02.hl":{"en":"UNESCO Hahoe hanok alleys|Traditional mask dance|Andong jjimdak lunch|Buyongdae cliff view","ko":"유네스코 하회 한옥 골목|전통 탈춤 공연|안동찜닭 중식|부용대 절경","zh":"河回韩屋胡同|传统假面舞|安东炖鸡午餐|芙蓉台绝景","ja":"河回韓屋の路地|伝統仮面舞踊|アンドンジムダク昼食|芙蓉台の絶景","ru":"Переулки ханок Хахве|Традиционный танец масок|Обед ччимдак|Скала Пурёндэ","es":"Callejones hanok de Hahoe|Danza de máscaras|Almuerzo jjimdak|Mirador Buyongdae","vi":"Ngõ hanok Hahoe|Múa mặt nạ truyền thống|Trưa gà hầm Andong|Vách đá Buyongdae"},"tour.gj03.title":{"en":"Gyeongju UNESCO & Pohang Space Walk 1N2D","ko":"경주 유네스코 & 포항 스페이스워크 1박2일","zh":"庆州UNESCO与浦项天空步道 2天1晚","ja":"慶州UNESCO＆浦項スカイウォーク 1泊2日","ru":"Кёнджу (ЮНЕСКО) и смотровая в Пховане, 2 дня","es":"Gyeongju UNESCO y Pohang Space Walk, 2 días","vi":"Gyeongju UNESCO & Pohang Space Walk 2 ngày 1 đêm"},"tour.gj03.desc":{"en":"Bulguksa and Seokguram at first light, a steel skywalk over the East Sea, and a night among royal tombs.","ko":"새벽 불국사와 석굴암, 동해를 내려다보는 포항 스페이스워크, 왕릉 야경까지 담은 1박 2일입니다.","zh":"清晨的佛国寺与石窟庵、俯瞰东海的浦项天 set yacht cruise, Suncheon Bay reed fields and the Dolsan cable car.","ko":"남해안 3일, 여수 선셋 요트와 순천만 갈대밭, 돌산 케이블카를 함께 즐깁니다.","zh":"南海岸三日：丽水日落游艇、顺天湾芦苇荡与突山缆车。","ja":"南海岸3日間。麗水サンセットヨット、順天湾の葦原、突山ケーブルカー。","ru":"Три дня на южном побережье: яхта на закате, тростники Сунчхон и канатка Тольсан.","es":"Tres días en la costa sur: yate al atardecer, juncos de Suncheon y teleférico de Dolsan.","vi":"Ba ngày bờ biển phía nam: du thuyền hoàng hôn, lau sậy Suncheon và cáp treo Dolsan."},"tour.ys06.hl":{"en":"Sunset yacht around Yeosu islands|Suncheon Bay reed field|Dolsan cable car ridge|Two nights by the sea","ko":"여수 섬 투어 선셋 요트|순천만 갈대밭|돌산 케이블카|바닷가 2박","zh":"丽水群岛日落游艇|顺天湾芦苇荡|突山缆车|海边连住两晚","ja":"麗水の島めぐりサンセットヨット|順天湾の葦原|突山ケーブルカー|海辺に2泊","ru":"Яхта на закате вокруг островов Йосу|Тростники Сунчхона|Канатка Тольсан|Две ночи у моря","es":"Yate al atardecer por las islas|Juncos de Suncheon|Teleférico de Dolsan|Dos noches junto al mar","vi":"Du thuyền hoàng hôn quanh đảo Yeosu|Lau sậy Suncheon|Cáp treo Dolsan|Hai đêm bên biển"},"tour.je07.title":{"en":"Jeju Hallasan & Olle Trail 2N3D Flight Package","ko":"제주 한라산 & 올레길 2박3일 항공 패키지","zh":"济州汉拿山与偶来小路 3天2晚机票套餐","ja":"済州ハルラサン＆オルレ 2泊3日航空パック","ru":"Чеджу: Халласан и тропа Олле, 3 дня с перелётом","es":"Jeju: Hallasan y Olle, 3 días con vuelo","vi":"Jeju: Hallasan & đường Olle 3 ngày 2 đêm gồm vé bay"},"tour.je07.desc":{"en":"Fly to Jeju for a crater hike, a volcanic coastal walk and sunrise over Seongsan Ilchulbong.","ko":"제주로 떠나 한라산 분화구 트레킹, 화산 해안 올레길, 성산일출봉 일출을 만납니다.","zh":"飞往济州，登汉拿山火山口、走火山海岸偶来小路、看城山日出峰日出。","ja":"済州へ。ハルラサンの火口トレッキング、火山海岸のオルレ、城山日出峰の日の出。","ru":"Перелёт на Чеджу: кратер Халласан, вулканическое побережье Олле и рассвет на Сонсан-Ильчхульбон.","es":"Vuela a Jeju: cráter de Hallasan, costa volcánica de Olle y amanecer en Seongsan Ilchulbong.","vi":"Bay đến Jeju: leo miệng núi lửa Hallasan, đường Olle ven biển và bình minh Seongsan."},"tour.je07.hl":{"en":"Hallasan crater hike with a local guide|Olle trail along the volcanic coast|Seongsan Ilchulbong sunrise|Resort with ocean view","ko":"현지 가이드와 한라산 분화구 트레킹|화산 해안 올레길|성산일출봉 일출|오션뷰 리조트","zh":"当地向导带队登汉拿山|火山海岸偶来小路|城山日出峰日出|海景度假村","ja":"現地ガイドとハルラサン火口トレッキング|火山海岸のオルレ|城山日出峰の日の出|オーシャンビューリゾート","ru":"Треккинг к кратеру Халласан с гидом|Тропа Олле по вулканическому берегу|Рассвет на Сонсан|Курорт с видом на море","es":"Cráter de Hallasan con guía local|Costa volcánica de Olle|Amanecer en Seongsan|Resort con vistas al mar","vi":"Leo núi Hallasan cùng HDV địa phương|Đường Olle ven biển|Bình minh Seongsan|Resort view biển"},"tour.ul08.title":{"en":"Ulleungdo & Dokdo Cruise 2N3D","ko":"울릉도·독도 크루즈 2박3일","zh":"郁陵岛·独岛游船 3天2晚","ja":"鬱陵島・独島クルーズ 2泊3日","ru":"Уллындо и Токто: круиз, 3 дня","es":"Ulleungdo y Dokdo en crucero, 3 días","vi":"Ulleungdo & Dokdo 3 ngày 2 đêm"},"tour.ul08.desc":{"en":"A three-hour ferry to a volcanic island, a Dokdo landing when the sea allows, and quiet coastal trails.","ko":"3시간 여객선으로 떠나는 화산섬, 날씨가 허락하면 독도 상륙, 한적한 해안 산책로를 걷습니다.","zh":"乘三小时渡轮前往火山岛，海况允许时登独岛，漫步宁静海岸步道。","ja":"3時間のフェリーで火山島へ。海況が許せば独島上陸、静かな海岸遊歩道。","ru":"Трёхчасовой паром на вулканический остров, высадка на Токто при хорошей погоде и тихие тропы.","es":"Tres horas de ferri a una isla volcánica, desembarco en Dokdo si el mar lo permite y senderos tranquilos.","vi":"Ba giờ phà đến đảo núi lửa, lên đảo Dokdo nếu biển lặng và những lối ven biển yên bình."},"tour.ul08.hl":{"en":"Three-hour ferry across the East Sea|Dokdo landing (weather permitting)|Elephant Rock coastal trail|Fresh squid dinner","ko":"동해 3시간 여객선|독도 상륙 (기상 허락 시)|코끼리바위 해안 산책로|생오징어 회 저녁","zh":"横渡东海三小时渡轮|登独岛（视天气）|象岩海岸步道|新鲜鱿鱼晚餐","ja":"東海3時間フェリー|独島上陸（天候次第）|象岩の海岸遊歩道|新鮮イカの夕食","ru":"Трёхчасовой паром через Восточное море|Высадка на Токто (по погоде)|Тропа у скалы Слон|Ужин из свежего кальмара","es":"Ferri de tres horas por el mar del Este|Desembarco en Dokdo (según el tiempo)|Senda de Elephant Rock|Cena de calamar fresco","vi":"Phà ba giờ qua Biển Đông|Lên đảo Dokdo (tùy thời tiết)|Đường ven biển Đá Voi|Tối mực tươi"},"tour.gf09.title": ":"Паломничество по святыням Кореи, 3 дня","es":"Peregrinación católica y budista por Corea, 3 días","vi":"Hành hương Công giáo & Phật giáo Hàn Quốc 3 ngày 2 đêm"},"tour.pg10.desc":{"en":"Walk the martyr sites of Seoul and Chungcheong with a Catholic historian, then the Buddhist temples of Gyeongju — a quiet route through Korea's 200-year Catholic history.","ko":"서소문·절두산·솔뫼성지·해미읍성을 가톨릭 해설 가이드와 함께 순례하고, 경주 불국사·석굴암에서 불교 성지를 둘러보는 조용한 2박 3일 일정입니다.","zh":"由天主教历史向导陪同，走访西小门、切头山、松梅圣地与海美邑城，再到庆州佛国寺与石窟庵，静心感受韩国两百年的信仰之路。","ja":"カトリック史家ガイドと西小門・切頭山・松梅聖地・海美邑城を巡礼し、慶州の仏国寺・石窟庵へ。韓国の二百年の信仰の道を静かにたどります。","ru":"С молитвенными остановками в Сосомуне, Чольтусане и Солмэ, затем буддийские храмы Кёнджу — тихий маршрут по 200-летней истории веры в Корее.","es":"Peregrinación por Seosomun, Jeoldusan, Solmoe y Haemi con un guía historiador, y después los templos budistas de Gyeongju: un recorrido sereno por 200 años de fe.","vi":"Hành hương Seosomun · Jeoldusan · Solmoe · thành Haemi cùng HDV sử học Công giáo, rồi chùa Phật giáo Gyeongju — hành trình tĩnh lặng 200 năm đức tin."},"tour.pg10.hl":{"en":"Seosomun, Jeoldusan and Solmoe shrines|Haemi Fortress & the Catholic martyr road|Bulguksa and Seokguram with a temple guide|Mass and quiet reflection each day","ko":"서소문·절두산·솔뫼 성지|해미읍성·천주교 순교의 길|불국사·석굴암 사찰 해설|매일 미사·묵상 시간","zh":"西小门·切头山·松梅圣地|海美邑城与殉教之路|佛国寺·石窟庵寺院讲解|每日弥撒与默想时间","ja":"西小門・切頭山・松梅聖地|海美邑城と殉教の道|仏国寺・石窟庵の寺院解説|毎日のミサと黙想","ru":"Святыни Сосомун, Чольтусан и Солмэ|Крепость Хэми и путь мучеников|Пульгукса и Соккурам с гидом|Ежедневная месса и время тишины","es":"Santuarios de Seosomun, Jeoldusan y Solmoe|Fortaleza de Haemi y ruta de los mártires|Bulguksa y Seokguram con guía de templo|Misa y reflexión cada día","vi":"Thánh địa Seosomun · Jeoldusan · Solmoe|Thành Haemi & đường tử đạo|Bulguksa & Seokguram có HDV chùa|Thánh lễ & tĩnh tâm mỗi ngày"},"tour.pg10.itin":{"en":"Seoul: Seosomun shrine, Jeoldusan & Mass|Solmoe shrine and Haemi Fortress|Bulguksa & Seokguram, return by KTX","ko":"서울: 서소문성지·절두산 순례·미사|솔뫼성지·해미읍성|불국사·석굴암 · KTX 귀경","zh":"首尔：西小门圣地·切头山朝圣·弥撒|松梅圣地与海美邑城|佛国寺·石窟庵，KTX返程","ja":"ソウル：西小門聖地・切頭山巡礼・ミサ|松梅聖地と海美邑城|仏国寺・石窟庵、KTXで帰京","ru":"Сеул: Сосомун, Чольтусан и месса|Солмэ и крепость Хэми|Пульгукса и Соккурам, возвращение на KTX","es":"Seúl: Seosomun, Jeoldusan y misa|Solmoe y fortaleza de Haemi|Bulguksa y Seokguram, regreso en KTX","vi":"Seoul: Seosomun · Jeoldusan · thánh lễ|Solmoe & thành Haemi|Bulguksa · Seokguram, về bằng KTX"},"tour.st11.title":{"en":"K-Culture, Top Universities & DMZ Student Trip 3N4D","ko":"K-컬처 & 명문대·DMZ 학생단체 수학여행 3박 4일","zh":"K-文化·名校·DMZ 学生团体修学旅行 4天3晚","ja":"K-カルチャー・名門大学・DMZ 学生団体研修旅行 3泊4日","ru":"K-культура, ведущие вузы и ДМЗ: школьная поездка, 4 дня","es":"Viaje escolar K-culture, universidades y DMZ, 4 días","vi":"Du lịch học sinh K-culture · đại học · DMZ 4 ngày 3 đêm"},"tour.st11.desc":{"en":"Campus visits at Seoul National and Yonsei, a DMZ peace tour, Gyeongbokgung in hanbok and a K-POP dance class — with a safety manager for the whole group.","ko":"서울대·연세대 캠퍼스 탐방, DMZ 평화 투어, 한복 입고 경복궁, K-POP 댄스 클래스까지. 단체 전담 안전 매니저가 24시간 함께합니다.","zh":"首尔大学与延世大学校园交流、DMZ和平之旅、穿韩服游景福宫与K-POP舞蹈课，全程配备团体安全管理员。","ja":"ソウル大・延世大のキャンパス交流、DMZ平和ツアー、韓服で景福宮、K-POPダンス教室。安全管理スタッフが24時間同行します。","ru":"Кампусы SNU и Ёнсе, тур мира на ДМЗ, Кёнбоккун в ханбоке и урок K-POP танцев — с менеджером по безопасности на всю группу.","es":"Visitas a los campus de SNU y Yonsei, gira por la DMZ, Gyeongbokgung con hanbok y clase de baile K-POP, con gestor de seguridad.","vi":"Tham quan ĐH Quốc gia Seoul & Yonsei, tour hòa bình DMZ, Gyeongbokgung với áo hanbok và lớp nhảy K-POP, có quản lý an toàn theo đoàn."},"tour.st11.hl":{"en":"Seoul National Univ. & Yonsei campus visits|DMZ & Imjingak peace programme|Gyeongbokgung hanbok walk & K-POP dance class|Safety manager and 45-seat coach throughout","ko":"서울대·연세대 캠퍼스 탐방|DMZ·임진각 평화 프로그램|경복궁 한복 체험·K-POP 댄스 클래스|안전 매니저·45인승 버스 전일 동행","zh":"首尔大学·延世大学校园探访|DMZ·临津阁和平项目|景福宫韩服体验与K-POP舞蹈课|安全管理员与45座大巴全程随行","ja":"ソウル大・延世大キャンパス見学|DMZ・臨津閣平和プログラム|景福宮韓服体験・K-POPダンス教室|安全管理スタッフと45人乗りバスが終日同行","ru":"Кампусы SNU и Ёнсе|Программа мира на ДМЗ и в Имджингаке|Кёнбоккун в ханбоке и урок K-POP|Менеджер по безопасности и автобус на 45 мест","es":"Campus de SNU y Yonsei|Programa de paz en la DMZ e Imjingak|Gyeongbokgung en hanbok y clase de K-POP|Gestor de seguridad y autobús de 45 plazas","vi":"ĐH Quốc gia Seoul & Yonsei|Chương trình hòa bình DMZ · Imjingak|Gyeongbokgung áo hanbok & lớp nhảy K-POP|Quản lý an toàn & xe 45 chỗ"},"tour.st11.itin":{"en":"Arrival · Gyeongbokgung & hanbok walk|SNU & Yonsei campus visits · Hongdae K-POP class|DMZ & Imjingak peace programme|Departure · souvenir stop & airport transfer","ko":"도착 · 경복궁 한복 체험|서울대·연세대 탐방 · 홍대 K-POP 클래스|DMZ·임진각 평화 프로그램|출국 · 기념품 쇼핑 · 공항 이동","zh":"抵达·景福宫韩服体验|首尔大·延世大探访·弘大K-POP课|DMZ·临津阁和平项目|返程·纪念品购物·送往机场","ja":"到着・景福宮韓服体験|ソウル大・延世大見学・弘大K-POP教室|DMZ・臨津閣平和プログラム|帰国・お土産・空港送迎","ru":"Прилёт · Кёнбоккун в ханбоке|Кампусы SNU и Ёнсе · K-POP в Хондэ|ДМЗ и Имджингак|Отъезд · сувениры · трансфер в аэропорт","es":"Llegada · Gyeongbokgung con hanbok|Campus SNU y Yonsei · clase K-POP en Hongdae|DMZ e Imjingak|Salida · souvenirs · traslado al aeropuerto","vi":"Đến · Gyeongbokgung áo hanbok|ĐH Quốc gia Seoul & Yonsei · lớp K-POP Hongdae|DMZ & Imjingak|Khởi hành · mua quà · ra sân bay"},"tour.md12.title":{"en":"Seoul Gangnam Premium Health Check & Wellness 2N3D","ko":"서울 강남 프리미엄 건강검진 & 한방·뷰티 웰니스 2박 3일","zh":"首尔江南高端体检与韩方·美容养生 3天2晚","ja":"ソウル江南 プレミアム人間ドック＆韓方・ビューティーウェルネス 2泊3日","ru":"Чекап премиум-класса в Каннаме и велнес, 3 дня","es":"Chequeo premium en Gangnam y bienestar, 3 días","vi":"Khám sức khỏe cao cấp Gangnam & wellness 3 ngày 2 đêm"},"tour.md12.desc":{"en":"A JCI-accredited comprehensive screening in Gangnam with 1:1 medical interpretation, then Korea's answer to recovery: an oriental-medicine spa, beauty care and a 5-star hotel.","ko":"JCI 인증 종합검진과 1:1 의료 통역, 그리고 한방 스파·뷰티 케어와 5성급 호텔에서의 회복까지. 검진과 웰니스를 한 번에 담았습니다.","zh":"江南JCI认证综合体检、一对一医疗翻译，加上韩方水疗与美容护理、五星级酒店休养，一次完成体检与养生。","ja":"江南のJCI認証総合健康診断と1対1医療通訳、韓方スパ・ビューティーケア、5つ星ホテルでの休息まで。検診とウェルネスを一度に。","ru":"Комплексное обследование в клинике Каннама с аккредитацией JCI и переводчиком 1:1, затем спа восточной медицины, уход за собой и отель 5*.","es":"Chequeo completo en un centro acreditado JCI de Gangnam con intérprete 1:1, y después spa de medicina oriental, cuidado de belleza y hotel 5*.","vi":"Khám tổng quát tại trung tâm chuẩn JCI ở Gangnam với phiên dịch 1:1, sau đó spa đông y, chăm sóc sắc đẹp và khách sạn 5 sao."},"tour.md12.hl":{"en":"JCI-accredited full health screening|1:1 medical interpreter all day|Oriental medicine spa & beauty care|5-star Gangnam hotel, 2 nights","ko":"JCI 인증 종합 건강검진|전일 1:1 의료 통역|한방 스파·뷰티 케어|강남 5성급 호텔 2박","zh":"JCI认证综合体检|全程一对一医疗翻译|韩方水疗与美容护理|江南五星酒店2晚","ja":"JCI認証の総合健康診断|終日1対1医療通訳|韓方スパ・ビューティーケア|江南5つ星ホテル2泊","ru":"Полный чекап с аккредитацией JCI|Переводчик 1:1 весь день|Спа восточной медицины и уход за собой|Отель 5* в Каннаме, 2 ночи","es":"Chequeo completo acreditado JCI|Intérprete médico 1:1 todo el día|Spa de medicina oriental y belleza|Hotel 5* en Gangnam, 2 noches","vi":"Khám tổng quát chuẩn JCI|Phiên dịch y tế 1:1 cả ngày|Spa đông y & chăm sóc sắc đẹp|Khách sạn 5 sao Gangnam, 2 đêm"},"tour.md12.itin":{"en":"Arrival · hotel check-in · wellness consultation|Health screening · interpreter · oriental spa|Results briefing · beauty care · departure","ko":"도착 · 호텔 체크인 · 웰니스 상담|건강검진 · 의료 통역 · 한방 스파|결과 상담 · 뷰티 케어 · 출국","zh":"抵达·酒店入住·养生咨询|健康体检·医疗翻译·韩方水疗|结果说明·美容护理·返程","ja":"到着・ホテルチェックイン・ウェルネス相談|健康診断・医療通訳・韓方スパ|結果説明・ビューティーケア・帰国","ru":"Прилёт · заселение · велнес-консультация|Обследование · переводчик · спа|Разбор результатов · уход · отъезд","es":"Llegada · check-in · consulta de bienestar|Chequeo · intérprete · spa oriental|Resultados · cuidado de belleza · salida","vi":"Đến · nhận phòng · tư vấn wellness|Khám sức khỏe · phiên dịch · spa đông y|Tư vấn kết quả · chăm sóc sắc đẹp · khởi hành"},"hotel.lotte.desc":{"en":"Landmark five-star hotel above Myeongdong with a pool, spa and direct su       html += '<div class="m-body">' + authAccountHTML() + '</div>';
    } else {
      html += '<div class="m-body">' + authTabs(key) + (key === 'join' ? authJoinHTML() : authSigninHTML()) + '</div>';

    authSetSession(m);
    applyMemberToForms();
    renderAuthButton();
    renderView(state.tab);
    toast(t('auth.toastSignin', { name: m.name }));
    go('#' + state.tab, true);

  function authErr(msg) {
    var box = $('#authErr');
    if (box) { box.style.display = 'block'; box.textContent = msg; }
  }

  function authSubmitSignin(form) {
    var email = String(form.elements.email ? form.elements.email.value : '').trim().toLowerCase();
    var pw = String(form.elements.password ? form.elements.password.value : '');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { authErr(t('form.errEmail')); return; }
    if (!pw) { authErr(t('auth.errPassword')); return; }
    var list = authMembers(), found = null;
    for (var i = 0; i < list.length; i++) {
      if (String(list[i].email).toLowerCase() === email) found = list[i];
    }
    if (!found || found.pw !== hashPw(pw)) { authErr(t('auth.errBadPw')); return; }
    authSignIn(found);
  }

  function authSubmitSignup(form) {
    var el = form.elements;
    var name = String(el.name ? el.name.value : '').trim();
    var email = String(el.email ? el.email.value : '').trim().toLowerCase();
    var pw = String(el.password ? el.password.value : '');
    var nat = el.nat ? el.nat.value : '';
    var phone = String(el.phone ? el.phone.value : '').trim();
    var type = state.authType || 'traveler';
    var company = String(el.company ? el.company.value : '').trim();
    var bizNo = String(el.bizNo ? el.bizNo.value : '').trim();
    if (name.length < 2) { authErr(t('form.errName')); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { authErr(t('form.errEmail')); return; }
    if (pw.length < 8) { authErr(t('auth.errPassword')); return; }
    if (!nat) { authErr(t('auth.errNat')); return; }
    if (type === 'agency' && (company.length < 2 || bizNo.length < 3)) { authErr(t('auth.errCompany')); return; }
    var list = authMembers();
    for (var i = 0; i < list.length; i++) {
      if (String(list[i].email).toLowerCase() === email) { authErr(t('auth.errExists')); return; }
    }
    var member = {
      id: 'mb' + Date.now(), name: name, email: email, pw: hashPw(pw), nat: nat, phone: phone,
      type: type, company: type === 'agency' ? company : '', bizNo: type === 'agency' ? bizNo : '',
      joinedAt: new Date().toISOString(), v: MEMBER_SCHEMA
    };
    list.push(member);
    writeStore(KEY_MEMBERS, list);
    authSetSession(member);
    applyMemberToForms();
    renderAuthButton();
    renderView(state.tab);
    pushModalStep(null,
      '<div class="success">' +
      '<div class="auth-avatar" style="width:64px;height:64px;font-size:21px">' + esc(initials(name)) + '</div>' +
      '<h3>' + t('auth.welcomeTitle') + '</h3><p>' + t('auth.welcomeSub') + '</p>' +
      '<div class="ref-box"><small>' + t('auth.email') + '</small><b style="font-size:14px;letter-spacing:.02em">' + esc(email) + '</b></div>' +
      '<div class="success-actions"><button type="button" class="btn btn-light" data-act="close-modal">' + t('common.close') + '</button>' +
      '<button type="button" class="btn btn-primary" data-act="auth-close">' + t('auth.continue') + '</button></div></div>');
    toast(t('auth.toastJoin', { name: name }));
  }

  /* -------------------------------------------------------------- flights */
  function airport(code) {
    for (var i = 0; i < DATA.airports.length; i++) if (DATA.airports[i].code === code) return DATA.airports[i];
    return DATA.airports[0];
  }
  function airportOptions(sel) {
    return DATA.airports.map(function (a) {
      return '<option value="' + a.code + '"' + (a.code === sel ? ' selected' : '') + '>' +
        cityName(a.city) + ' (' + a.code + ')</option>';
    }).join('');
  }
  function distanceKm(a, b) {
    var R = 6371, dLat = (b.lat - a.lat) * Math.PI / 180, dLon = (b.lon - a.lon) * Math.PI / 180;
    var la1 = a.lat * Math.PI / 180, la2 = b.lat * Math.PI / 180;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(la1) * Math.cos(la2) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return Math.round(2 * R * Math.asin(Math.sqrt(h)));
  }
  function hash(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 100000;
    return h;
  }
  function flights() {
    var A = airport(state.f.from), B = airport(state.f.to);
    if (A.code === B.code) return [];
    var dist = distanceKm(A, B);
    var seed = hash(A.code + B.code);
    var pool = DATA.airlines.filter(function (al) {
      return al.regions.indexOf('*') >= 0 || al.regions.indexOf(A.region) >= 0 || al.regions.indexOf(B.region) >= 0;
    });
    if (!pool.length) pool = DATA.airlines.slice(0, 4);
    var cabin = { economy: 1, premium: 1.65, business: 2.9, first: 4.3 }[state.f.cabin] || 1;
    var n = dist > 3000 ? 6 : 5;
    var out = [];
    var baseMin = 45 + Math.round(dist / 800 * 60);
    for (var i = 0; i < n; i++) {
      var al = pool[(seed + i * 3) % pool.length];
      var stops = dist > 3500 && i % 3 === 1 ? 1 : 0;
      var mins = baseMin + (stops ? 105 : 0) + ((seed + i * 7) % 15);
      var dep = 420 + ((seed / 7 + i * 143) % 900);
      dep = Math.round(dep / 5) * 5;
      var price = (45000 + dist * 95) * al.factor * cabin * (stops ? 0.9 : 1);
      if (state.f.trip === 'round') price = price * 1.86;
      price = Math.round(price / 1000) * 1000;
      out.push({
        key: A.code + B.code + i,
        airline: al.name,
        code: al.code,
        no: al.code + ' ' + (100 + ((seed + i * 37) % 880)),
        from: A.code, to: B.code,
        dep: dep, arr: dep + mins, mins: mins, stops: stops,
        price: price, seats: 3 + ((seed + i * 11) % 6)
      });
    }
    out.sort(function (a, b) {
      if (state.f.sort === 'cheapest') return a.price - b.price;
      if (state.f.sort === 'fastest') return a.mins - b.mins;
      return (a.price * 0.7 + a.mins * 900) - (b.price * 0.7 + b.mins * 900);
    });
    return out;
  }

  /* ------------------------------------------------- custom ground quote */
  /* Demo tariff sheet — KRW per vehicle/room/group. Illustrative only; the
     MICE desk confirms the firm quotation against seasonal contracts. */
  var QUOTE = {
    vehicles: [
      { key: 'coach45', seats: 45, day: 650000 },
      { key: 'minibus25', seats: 25, day: 480000 },
      { key: 'solati15', seats: 15, day: 400000 },
      { key: 'sedan', seats: 3, day: 330000 }
    ],
    guideDay: 260000,
    hotels: [
      { key: 'lux5', room: 340000 },
      { key: 'biz4', room: 200000 },
      { key: 'std3', room: 130000 },
      { key: 'hanok', room: 150000 }
    ],
    mice: 1600000,
    galaPerPax: 95000,
    meet: 180000,
    regionDay: 130000
  };
  var QUOTE_REGIONS = ['seoul', 'gg', 'gw', 'gj', 'bs', 'jeju', 'custom'];

  function qVehicle(k) {
    for (var i = 0; i < QUOTE.vehicles.length; i++) if (QUOTE.vehicles[i].key === k) return QUOTE.vehicles[i];
    return QUOTE.vehicles[0];
  }
  function qHotel(k) {
    for (var i = 0; i < QUOTE.hotels.length; i++) if (QUOTE.hotels[i].key === k) return QUOTE.hotels[i];
    return null;
  }
  function qLangLabel(code) {
    for (var i = 0; i < LANGS.length; i++) if (LANGS[i].code === code) return LANGS[i].label;
    return LANGS[0].label;
  }
  function qPax() {
    var n = parseInt(state.q.pax, 10);
    if (isNaN(n) || n < 1) n = 1;
    return Math.min(n, 500);
  }
  function qSpan() {
    var q = state.q;
    var a = new Date((q.start || '') + 'T00:00:00'), b = new Date((q.end || '') + 'T00:00:00');
    var d = Math.round((b - a) / 86400000);
    if (!isFinite(d) || d < 0) d = 0;
    if (!q.start) return { days: 1, nights: 0 };
    return { days: d + 1, nights: d };
  }
  function qRegionsOf(rec) {
    return (rec.regions || []).map(function (r) {
      if (r === 'custom') return rec.custom || t('quote.region.custom');
      return t('quote.region.' + r);
    });
  }
  function qCalc() {
    var q = state.q, span = qSpan(), days = span.days, nights = span.nights;
    var pax = qPax(), lines = [], total = 0, vehCount = 0;
    if (q.svc.vehicle) {
      var v = qVehicle(q.veh);
      vehCount = Math.max(1, Math.ceil(pax / v.seats));
      var amt = v.day * vehCount * days;
      lines.push({ label: t('quote.line.vehicle', { name: t('quote.veh.' + v.key), v: vehCount, n: days }), amount: amt });
      total += amt;
    }
    if (q.svc.guide) {
      var gAmt = QUOTE.guideDay * days;
      lines.push({ label: t('quote.line.guide', { name: qLangLabel(q.glang), n: days }), amount: gAmt });
      total += gAmt;
    }
    var hotel = q.svc.hotel ? qHotel(q.hotel) : null;
    if (hotel && nights > 0) {
      var rooms = Math.ceil(pax / 2);
      var hAmt = hotel.room * rooms * nights;
      lines.push({ label: t('quote.line.hotel', { name: t('quote.hotel.' + hotel.key), r: rooms, m: nights }), amount: hAmt });
      total += hAmt;
    }
    var extra = (q.svc.vehicle || q.svc.guide) ? Math.max(0, (q.regions || []).length - 1) : 0;
    if (extra > 0) {
      var rAmt = QUOTE.regionDay * extra * days;
      lines.push({ label: t('quote.line.region', { n: q.regions.length }), amount: rAmt });
      total += rAmt;
    }
    if (q.mice) { lines.push({ label: t('quote.line.mice'), amount: QUOTE.mice }); total += QUOTE.mice; }
    if (q.gala) {
      var galaAmt = QUOTE.galaPerPax * pax;
      lines.push({ label: t('quote.line.gala', { n: pax }), amount: galaAmt });
      total += galaAmt;
    }
    if (q.meet) { lines.push({ label: t('quote.line.meet'), amount: QUOTE.meet }); total += QUOTE.meet; }
    /* attraction toppings: admission / experience / meal ground cost */
    var picks = topPicked().sort(function (a, b) { return a.day - b.day; });
    var topTotal = 0;
    picks.forEach(function (x) {
      var amt = topAmount(x.tp);
      lines.push({
        label: t('quote.line.topping', { name: t('topping.' + x.id), d: x.day }),
        amount: amt, day: x.day, top: x.id
      });
      topTotal += amt;
      total += amt;
    });
    return {
      lines: lines, total: total, days: days, nights: nights, pax: pax, vehicles: vehCount,
      tops: picks, topTotal: topTotal,
      perPax: Math.round(total / pax)
    };
  }

  /* ------------------------------------- attraction toppings & itinerary */
  /* A TATINTA-style builder: click a region, drop attractions into the plan
     like toppings, and the day-by-day schedule + ground cost follow. */
  var TOP_REGIONS = ['seoul', 'gg', 'gw', 'gj', 'bs', 'jeju'];
  var TOP_CAT_ICON = { landmark: 'pin', culture: 'compass', nature: 'sparkle', experience: 'ticket', food: 'coffee' };
  var TOP_DAY_START = 540;   /* 09:00 */
  var TOP_GAP = 30;          /* minutes between stops */
  var TOP_DAY_CAP = 330;     /* activity minutes we plan into one day */
  var TOP_MAX_ITEMS = 4;

  function topFind(id) {
    for (var i = 0; i < DATA.toppings.length; i++) if (DATA.toppings[i].id === id) return DATA.toppings[i];
    return null;
  }
  function topRegionList(region) {
    return DATA.toppings.filter(function (x) { return x.region === region; });
  }
  function topDays() {
    return Math.max(1, Math.min(12, qSpan().days));
  }
  function topSel() { return state.q.topics || []; }
  function topPicked() {
    var days = topDays(), out = [];
    topSel().forEach(function (x) {
      var tp = topFind(x.id);
      if (!tp) return;
      if (!x.day || x.day < 1) x.day = 1;
      if (x.day > days) x.day = days;
      out.push({ id: tp.id, day: x.day, auto: x.auto !== false, tp: tp });
    });
    return out;
  }
  function topIsOn(id) {
    for (var i = 0; i < topSel().length; i++) if (topSel()[i].id === id) return true;
    return false;
  }
  function topDayOf(id) {
    for (var i = 0; i < topSel().length; i++) if (topSel()[i].id === id) return topSel()[i].day;
    return 0;
  }
  function topAmount(tp) { return tp.per === 'team' ? tp.krw : tp.krw * qPax(); }
  function topPriceHTML(tp) {
    if (!tp.krw) return '<b class="qtop-price">' + t('quote.top.free') + '</b>';
    return '<b class="qtop-price">+' + money(tp.krw) + '<small>' +
      t(tp.per === 'team' ? 'quote.top.perTeam' : 'quote.top.perPax') + '</small></b>';
  }
  function topLoad(list, day, except) {
    var mins = 0, items = 0;
    list.forEach(function (x) {
      if (x === except || x.day !== day) return;
      var tp = topFind(x.id);
      if (!tp) return;
      mins += tp.mins;
      items += 1;
    });
    return { mins: mins, items: items };
  }
  function topFit(list, tp, start, days, except) {
    for (var i = 0; i < days; i++) {
      var d = ((start - 1 + i) % days) + 1, load = topLoad(list, d, except);
      if (load.mins + tp.mins <= TOP_DAY_CAP && load.items < TOP_MAX_ITEMS) return d;
    }
    return start || days;
  }
  function topNextDay(list, tp) {
    var days = topDays(), anchor = 0, empty = 0, d;
    list.forEach(function (x) {
      if (!x.day) return;
      var other = topFind(x.id);
      if (other && other.region === tp.region && x.day <= days) anchor = x.day;
    });
    if (anchor) return topFit(list, tp, anchor, days, null);
    for (d = 1; d <= days; d++) if (!topLoad(list, d, null).items) { empty = d; break; }
    return topFit(list, tp, empty || 1, days, null);
  }
  function topPlanAll() {
    var days = topDays(), list = topSel(), regionDay = {};
    list.forEach(function (x) { x.day = 0; x.auto = true; });
    list.forEach(function (x) {
      var tp = topFind(x.id);
      if (!tp) return;
      var start = regionDay[tp.region];
      if (!start) {
        for (var d = 1; d <= days; d++) if (!topLoad(list, d, x).items) { start = d; break; }
      }
      var day = topFit(list, tp, start || 1, days, x);
      x.day = day;
      regionDay[tp.region] = day;
    });
  }
  function topToggle(id) {
    var tp = topFind(id);
    if (!tp) return;
    var idx = -1;
    topSel().forEach(function (x, i) { if (x.id === id) idx = i; });
    if (idx >= 0) {
      state.q.topics.splice(idx, 1);
      renderToppingsUI();
      toast(t('quote.top.removedToast'));
      return;
    }
    var entry = { id: id, day: topNextDay(topSel(), tp), auto: true };
    state.q.topics.push(entry);
    renderToppingsUI();
    toast(t('quote.top.addedToast', { n: entry.day }));
  }
  function topMove(id, day) {
    if (!day) return;
    topSel().forEach(function (x) { if (x.id === id) { x.day = day; x.auto = false; } });
    renderToppingsUI();
    toast(t('quote.top.movedToast', { n: day }));
  }
  function topDayDate(day) {
    if (!state.q.start) return '';
    var d = new Date(state.q.start + 'T00:00:00');
    if (isNaN(d.getTime())) return '';
    return fmtDate(iso(addDays(d, day - 1)));
  }
  function topSchedule() {
    var days = topDays(), picked = topPicked(), out = [];
    for (var d = 1; d <= days; d++) {
      var rows = [], cursor = TOP_DAY_START, mins = 0;
      picked.forEach(function (x) {
        if (x.day !== d) return;
        rows.push({ id: x.id, tp: x.tp, start: cursor, end: cursor + x.tp.mins });
        cursor += x.tp.mins + TOP_GAP;
        mins += x.tp.mins;
      });
      out.push({ day: d, date: topDayDate(d), rows: rows, mins: mins });
    }
    return out;
  }

  function topRegionChips() {
    return TOP_REGIONS.map(function (r) {
      var label = r === 'gg' ? t('quote.top.region.gg') : t('quote.region.' + r);
      return '<button type="button" class="qchip qtop-region' + (state.q.topRegion === r ? ' on' : '') +
        '" data-act="q-top-region" data-r="' + r + '" aria-pressed="' +
        (state.q.topRegion === r ? 'true' : 'false') + '">' + label + '</button>';

  }

  function topDayChips(id) {
    var days = topDays(), cur = topDayOf(id), out = '';
    for (var d = 1; d <= days; d++) {
      out += '<button type="button" class="qday' + (cur === d ? ' on' : '') + '" data-act="q-top-day" data-id="' +
        id + '" data-d="' + d + '" aria-pressed="' + (cur === d ? 'true' : 'false') + '">' +
        t('quote.top.day', { n: d }) + '</button>';
    }
    return out;
  }

      '<h4>' + t('topping.' + tp.id) + '</h4>' +
      '<div class="qtop-bot">' + topPriceHTML(tp) +
      '<button type="button" class="qtop-btn' + (on ? ' on' : '') + '" data-act="q-top-add" data-id="' + tp.id +
      '" aria-pressed="' + (on ? 'true' : 'false') + '">' + t(on ? 'quote.top.added' : 'quote.top.add') + '</button></div>' +
      (on ? '<div class="qtop-days">' + topDayChips(tp.id) + '</div>' : '') +
      '</article>';
  }
  function topCards() {
    return topRegionList(state.q.topRegion).map(topCard).join('');

  function topSummaryBar() {
    var picked = topPicked(), cost = 0;

      '<div class="qtop-acts">' +
      (picked.length
        ? '<button type="button" class="qlink" data-act="q-top-plan">' + t('quote.top.plan') + '</button>' +
          '<button type="button" class="qlink danger" data-act="q-top-clear">' + t('quote.top.clear') + '</button>'
        : '') +
      '</div></div>';
  }

  function itiHTML() {
    var sched = topSchedule(), any = false;
    sched.forEach(function (d) { if (d.rows.length) any = true; });
    if (!any) {
      return '<div class="qiti-empty">' + ic.sparkle + '<span>' + t('quote.iti.empty') + '</span></div>';
    }
    var html = '';
    sched.forEach(function (day) {
      var items = day.rows.map(function (r) {
        return '<li class="qiti-item" data-iti="' + r.id + '">' +
          '<span class="qiti-time">' + fmtTime(r.start) + '<small>' + fmtTime(r.end) + '</small></span>' +
          '<span class="qiti-main"><b>' + t('topping.' + r.id) + '</b><small>' + t('quote.top.cat.' + r.tp.cat) +
          ' · ' + fmtDur(r.tp.mins) + ' · ' + (r.tp.krw ? money(topAmount(r.tp)) : t('quote.top.free')) + '</small></span>' +
          '<button type="button" class="qiti-rm" data-act="q-top-add" data-id="' + r.id +
          '" aria-label="' + t('common.close') + '">' + ic.close + '</button></li>';
      }).join('');
      html += '<div class="qiti-day' + (day.rows.length ? '' : ' free') + '">' +
        '<div class="qiti-head"><span class="qiti-d">' + t('quote.top.day', { n: day.day }) + '</span>' +
        (day.date ? '<span class="qiti-date">' + day.date + '</span>' : '') +
        (day.mins > 360 ? '<span class="qiti-warn">' + t('quote.iti.longDay') + '</span>' : '') +

        (day.rows.length ? '<ol class="qiti-list">' + items + '</ol>' : '') +

  function copyQuote(ref) {
    var text = qSummary(ref);
    var reveal = function () {
      var ta = $('#qSum');
      if (ta) { ta.hidden = false; ta.value = text; ta.focus(); ta.select(); }
    };
    var ok = function () { toast(t('quote.copied')); };
    var bad = function () { reveal(); toast(t('quote.copyFail')); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, bad);
      return;
    }
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute('readonly', 'readonly');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      var done = document.execCommand('copy');
      document.body.removeChild(ta);
      if (done) ok(); else bad();
    } catch (e2) { bad(); }
  }

  /* Fill #printSheet with the current product or plan, then hand over to the

  function printDoc(kind, id) {
    var sheet = $('#printSheet');

      if (fired) return;

      var prev = document.title;
      document.title = title + ' · MEMBERS Tour';
      try { window.print(); } catch (e) { /* printing blocked — the sheet stays for later */ }

      img.onload = fire;
