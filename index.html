      return r.json();

      if (Array.isArray(rows) && rows.length) {

  /* ---- YouTube / live URL parsing ---- */
  function ytId(url) {
    var s = String(url == null ? '' : url).trim();
    if (!s) return '';
    var m;
    if ((m = s.match(/(?:youtube\.com|youtube-nocookie\.com)\/(?:watch\?(?:[^#]*&)?v=|embed\/|live\/|shorts\/|v\/)([A-Za-z0-9_-]{11})/))) return m[1];
    if ((m = s.match(/youtu\.be\/([A-Za-z0-9_-]{11})/))) return m[1];
    if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
    return '';
  }
  function lvPlatform(url) {
    var u = String(url == null ? '' : url).toLowerCase();
    if (!u) return '';
    if (ytId(u)) return 'youtube';
    if (u.indexOf('chzzk') >= 0) return 'chzzk';
    if (u.indexOf('soop') >= 0 || u.indexOf('afreeca') >= 0) return 'soop';
    if (u.indexOf('instagram') >= 0) return 'instagram';
    if (u.indexOf('naver') >= 0) return 'naver';
    return 'external';
  }
  function lvYt(x) { return (x && x.yt) || ytId(x && x.url) || ''; }
  function lvThumb(x) {
    var id = lvYt(x);
    return id ? 'https://img.youtube.com/vi/' + id + '/hqdefault.jpg' : '';
  }
  function lvEmbed(x) {
    var id = lvYt(x);
    return id ? 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0&playsinline=1' : '';
  }
  function lvTitle(x) {
    if (!x) return '';

  }
  function lvDesc(x) {

        (x.status !== 'approved' ? '<button type="button" class="ok" data-act="lv-approve" data-id="' + esc(x.id) + '">' + t('lv.admin.approve') + '</button>' : '') +
        (x.status !== 'rejected' ? '<button type="button" class="no" data-act="lv-reject" data-id="' + esc(x.id) + '">' + t('lv.admin.reject') + '</button>' : '') +
        '<button type="button" data-act="live-watch" data-id="' + esc(x.id) + '">' + t('lv.admin.preview') + '</button>' +

  function lvSetStatus(id, status) {
    var x = lvById(id);
    if (!x) return;
    x.status = status;
    x.decidedAt = new Date().toISOString();
    lvPut(x);
    renderView('partner'); renderView('live');
    toast(t(status === 'approved' ? 'lv.admin.toast.approved' : 'lv.admin.toast.rejected'));
  }
  function lvDeleteOne(id) {
    if (state.lv.del !== id) {
      state.lv.del = id;
      renderView('partner');
      return;
    }
    state.lv.del = '';
    lvRemove(id);
    renderView('partner'); renderView('live');
    toast(t('lv.admin.toast.deleted'));
  }

  /* ============================================== all-in-one super search
     A Trip.com-style portal: six tabs in one card. Flights and hotels drive the
     same state the #flights / #hotels pages use, so the two never disagree.
     Each search opens the live partner inventory (Travelpayouts marker 605860)
     in a new tab and is kept in "recent searches". */

  var KTX_ROUTES = [
    { id: 'seoul-busan', from: 'city.seoul', to: 'city.busan', mins: 150, fare: 59800 },
    { id: 'seoul-gyeongju', from: 'city.seoul', to: 'city.gyeongju', mins: 130, fare: 49900 },
    { id: 'seoul-yeosu', from: 'city.seoul', to: 'city.yeosu', mins: 180, fare: 47000 },
    { id: 'seoul-jeonju', from: 'city.seoul', to: 'city.jeonju', mins: 100, fare: 35600 },
    { id: 'seoul-gangneung', from: 'city.seoul', to: 'city.gangneung', mins: 120, fare: 27600 },
    { id: 'tokyo-osaka', from: 'city.tokyo', to: 'city.osaka', mins: 150, fare: 138000, global: true },
    { id: 'osaka-hiroshima', from: 'city.osaka', to: 'city.hiroshima', mins: 85, fare: 62000, global: true }
  ];

  function ktxRoute(id) {
    for (var i = 0; i < KTX_ROUTES.length; i++) if (KTX_ROUTES[i].id === id) return KTX_ROUTES[i];
    return KTX_ROUTES[0];
  }
  function spFareEst(from, to, round) {
    var A = airport(from), B = airport(to);
    if (A.code === B.code) return 0;
    var base = 45000 + distanceKm(A, B) * 95;
    if (round) base = base * 1.86;
    return Math.round(base / 10000) * 10000;
  }

  /* ---- partner targets (all attributed to the Travelpayouts marker) ---- */
  function spFlightsTarget() {
    var p = state.f.from + ddmm(state.f.depart) + state.f.to;
    if (state.f.trip === 'round' && state.f.ret) p += ddmm(state.f.ret);
    p += (CABIN_CODE[state.f.cabin] || '');
    p += String(Math.max(1, Math.min(9, parseInt(state.f.pax, 10) || 1)));
    var u = ((PARTNER.flights && PARTNER.flights.url) || '') + '?params=' + p;
    if (state.f.direct) u += '&only_direct=true';
    return tpUrl('flights', u);
  }
  function spSimpleTarget(kind) {
    var conf = PARTNER[kind] || {};
    var url = conf.url || '';
    if (kind === 'transfers' && state.sp.tf.mode === 'rental') {
      url = (PARTNER.carrental && PARTNER.carrental.url) || url;
    }
    if (kind === 'esim') {
      url = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'curr=' + encodeURIComponent(state.cur) +
        '&locale=' + encodeURIComponent(curLang().locale);
    }
    return url;
  }
  function spTargets() {
    return {
      flights: spFlightsTarget(),
      hotels: tpUrl('hotels', hotelsTarget()),
      trains: spSimpleTarget('trains'),
      transfers: spSimpleTarget('transfers'),
      carrental: spSimpleTarget('carrental'),
      tickets: spSimpleTarget('tickets'),
      esim: spSimpleTarget('esim')
    };
  }
  function spRefreshLinks() {
    var T = spTargets();
    $$('[data-sp-go]').forEach(function (a) {
      var k = a.getAttribute('data-sp-go');
      if (T[k]) a.setAttribute('href', T[k]);
    });
  }
  /* portal fields write straight into the state the #flights / #hotels pages use */
  function spApplyField(k, v) {
    var n = parseInt(v, 10);
    if (k === 'from') state.f.from = v;
    else if (k === 'to') state.f.to = v;
    else if (k === 'depart') {
      state.f.depart = v;
      if (state.f.ret < v) { state.f.ret = v; if ($('#spRet')) $('#spRet').value = v; }
    }
    else if (k === 'ret') state.f.ret = v;
    else if (k === 'pax') state.f.pax = n || 1;
    else if (k === 'fch') state.f.ch = n || 0;
    else if (k === 'finf') state.f.inf = n || 0;
    else if (k === 'cabin') state.f.cabin = v;
    else if (k === 'city') { state.h.city = v; spPaint(); return; }
    else if (k === 'cin') {
      state.h.cin = v;
      if (state.h.cout <= v) {
        state.h.cout = iso(addDays(new Date(v + 'T00:00:00'), 2));
        if ($('#spCout')) $('#spCout').value = state.h.cout;
      }
    }
    else if (k === 'cout') state.h.cout = v;
    else if (k === 'rooms') state.h.rooms = n || 1;
    else if (k === 'guests') state.h.guests = n || 1;
    else if (k === 'hch') state.h.ch = n || 0;
    else if (k === 'route') state.sp.tr.route = v;
    else if (k === 'trdate') state.sp.tr.date = v;
    else if (k === 'trpax') state.sp.tr.pax = n || 1;
    else if (k === 'ap') state.sp.tf.ap = v;
    else if (k === 'tfdate') state.sp.tf.date = v;
    else if (k === 'tftime') state.sp.tf.time = v;
    else if (k === 'tfpax') state.sp.tf.pax = n || 1;
    else if (k === 'tfbags') state.sp.tf.bags = n || 0;
    else if (k === 'tkq') { state.sp.tk.q = v; spPaint(); return; }
    else if (k === 'tkdate') state.sp.tk.date = v;
    else if (k === 'escout') state.sp.es.country = v;
    else if (k === 'esdays') state.sp.es.days = n || 7;
    else if (k === 'esplan') state.sp.es.plan = v;
    spRefreshLinks();
  }

  /* ---- wishlist ---- */
  function wishHas(kind, id) {
    for (var i = 0; i < state.wish.length; i++) {
      if (state.wish[i].kind === kind && state.wish[i].id === id) return true;
    }
    return false;
  }
  function wishToggle(kind, id) {
    var on = !wishHas(kind, id);
    if (on) state.wish.unshift({ kind: kind, id: id, at: new Date().toISOString() });
    else state.wish = state.wish.filter(function (w) { return !(w.kind === kind && w.id === id); });
    save();
    toast(t(on ? 'sp.toast.saved' : 'sp.toast.removed'));
    return on;
  }
  function wishBtn(kind, id) {
    var on = wishHas(kind, id);
    return '<button type="button" class="wish-btn' + (on ? ' on' : '') + '" data-act="wish" data-kind="' + kind +
      '" data-id="' + esc(id) + '" aria-pressed="' + (on ? 'true' : 'false') + '" aria-label="' +
      esc(t(on ? 'sp.wish.remove' : 'sp.wish.add')) + '">' + ic.heart + '</button>';
  }

  /* ---- recent searches ---- */
  function spSnap() {
    return {
      f: JSON.parse(JSON.stringify(state.f)),
      h: JSON.parse(JSON.stringify(state.h)),
      tr: JSON.parse(JSON.stringify(state.sp.tr)),
      tf: JSON.parse(JSON.stringify(state.sp.tf)),
      tk: JSON.parse(JSON.stringify(state.sp.tk)),
      es: JSON.parse(JSON.stringify(state.sp.es))
    };
  }
  function spLabel(tab) {
    if (tab === 'flights') return state.f.from + ' → ' + state.f.to;
    if (tab === 'hotels') return cityName('city.' + state.h.city) + ' · ' + fmtDate(state.h.cin);
    if (tab === 'trains') { var r = ktxRoute(state.sp.tr.route); return cityName(r.from) + ' → ' + cityName(r.to); }
    if (tab === 'transfers') return t('sp.tf.' + state.sp.tf.mode) + ' · ' + state.sp.tf.ap;
    if (tab === 'tickets') return state.sp.tk.q || t('sp.tk.cat.' + state.sp.tk.cat);
    return t('sp.tab.esim') + ' · ' + state.sp.es.country + ' · ' + state.sp.es.days + 'd';
  }
  function spRecord(tab) {
    var entry = { tab: tab, label: spLabel(tab), at: new Date().toISOString(), snap: spSnap() };
    state.recent = [entry].concat(state.recent.filter(function (r) {
      return !(r.tab === entry.tab && r.label === entry.label);
    })).slice(0, 6);
    save();
  }
  function spRestore(entry) {
    if (!entry || !entry.snap) return;
    if (entry.snap.f) state.f = entry.snap.f;
    if (entry.snap.h) state.h = entry.snap.h;
    if (entry.snap.tr) state.sp.tr = entry.snap.tr;
    if (entry.snap.tf) state.sp.tf = entry.snap.tf;
    if (entry.snap.tk) state.sp.tk = entry.snap.tk;
    if (entry.snap.es) state.sp.es = entry.snap.es;
    state.sp.tab = entry.tab;
  }
  function spRun(tab) {
    spRecord(tab);
    var T = spTargets();
    var url = T[tab];
    if (url) { try { window.open(url, '_blank', 'noopener'); } catch (e) { /* popup blocked */ } }
    if (tab === 'hotels') { go('#hotels'); return; }
    spPaint();
  }
  function spTabIcon(tab) {
    return tab === 'flights' ? ic.plane : tab === 'hotels' ? ic.bed : tab === 'trains' ? ic.train
      : tab === 'transfers' ? ic.car : tab === 'tickets' ? ic.ticket : ic.sim;
  }
  function recentChips() {
    var items = state.recent || [];
    var head = '<span class="rt">' + t('sp.recent.title') + '</span>';
    if (!items.length) {
      return '<div class="sp-recent">' + head + '<span class="sp-chip ghost">' + t('sp.recent.empty') + '</span></div>';
    }
    var chips = items.map(function (r, i) {
      return '<button type="button" class="sp-chip" data-act="sp-recent" data-i="' + i +
        '" aria-label="' + esc(t('sp.recent.run')) + '">' + spTabIcon(r.tab) + '<span>' + esc(r.label) + '</span></button>';
    }).join('');
    return '<div class="sp-recent">' + head + chips +
      '<button type="button" class="sp-chip ghost" data-act="sp-recent-clear">' + t('sp.recent.clear') + '</button></div>';
  }

  /* ---- panels ---- */
  function spSeg(rows, cur) {
    return '<div class="sp-seg">' + rows.map(function (r) {
      return '<button type="button" data-act="' + r.act + '" data-v="' + r.v + '" class="' +
        (r.v === cur ? 'on' : '') + '">' + r.label + '</button>';
    }).join('') + '</div>';
  }

  function spPanelFlights() {
    var trip = state.f.trip;
    var est = spFareEst(state.f.from, state.f.to, trip === 'round');
    var seg = spSeg([
      { act: 'sp-trip', v: 'round', label: t('flights.round') },
      { act: 'sp-trip', v: 'oneway', label: t('flights.oneway') },
      { act: 'sp-trip', v: 'multi', label: t('sp.fl.multi') }
    ], trip);
    var tips = ['ICN|NRT', 'ICN|KIX', 'ICN|DAD', 'ICN|BKI', 'ICN|HKG'].map(function (pair) {
      var a = pair.split('|')[0], b = pair.split('|')[1];
      var A = airport(a), B = airport(b);
      return '<button type="button" class="sp-tip" data-act="sp-route" data-from="' + a + '" data-to="' + b + '">' +
        '<span><b>' + a + ' → ' + b + '</b><small>' + esc(cityName(A.city)) + ' · ' + esc(cityName(B.city)) +
        ' · ' + fmtDur(45 + Math.round(distanceKm(A, B) / 800 * 60)) + ' · ' + t('sp.fl.nonstop') + '</small></span>' +
        '<span class="fare">' + t('tours.from') + ' ' + money(spFareEst(a, b, trip === 'round')) + '</span></button>';
    }).join('');
    return '<form data-form="sp-flights">' + seg +
      '<div class="field-grid sp-grid">' +
      '<div class="field"><label for="spFrom">' + t('flights.from') + '</label><select id="spFrom" data-sp-field="from">' + airportOptions(state.f.from) + '</select></div>' +
      '<div class="field"><label for="spTo">' + t('flights.to') + '</label><select id="spTo" data-sp-field="to">' + airportOptions(state.f.to) + '</select></div>' +
      '<div class="field"><label for="spDep">' + t('flights.depart') + '</label><input id="spDep" type="date" data-sp-field="depart" min="' + iso(new Date()) + '" value="' + state.f.depart + '"></div>' +
      '<div class="field"' + (trip === 'oneway' ? ' hidden' : '') + '><label for="spRet">' + t('flights.return') + '</label><input id="spRet" type="date" data-sp-field="ret" min="' + state.f.depart + '" value="' + state.f.ret + '"></div>' +
      '<div class="field"><label for="spAd">' + t('sp.fl.adults') + '</label><select id="spAd" data-sp-field="pax">' + numOpts(1, 9, state.f.pax) + '</select></div>' +
      '<div class="field"><label for="spCh">' + t('sp.fl.children') + '</label><select id="spCh" data-sp-field="fch">' + numOpts(0, 8, state.f.ch || 0) + '</select></div>' +
      '<div class="field"><label for="spInf">' + t('sp.fl.infants') + '</label><select id="spInf" data-sp-field="finf">' + numOpts(0, 4, state.f.inf || 0) + '</select></div>' +
      '<div class="field"><label for="spCab">' + t('flights.cabin') + '</label><select id="spCab" data-sp-field="cabin">' +
      ['economy', 'premium', 'business', 'first'].map(function (c) {
        return '<option value="' + c + '"' + (state.f.cabin === c ? ' selected' : '') + '>' + t('flights.' + c) + '</option>';
      }).join('') + '</select></div>' +
      '</div>' +
      '<label class="sp-check"><input type="checkbox" id="spDirect" data-sp-check="direct"' + (state.f.direct ? ' checked' : '') + '>' +
      '<span>' + t('sp.fl.direct') + '</span></label>' +
      '<a class="sp-go" data-sp-go="flights" href="' + esc(spTargets().flights) + '" target="_blank" rel="noopener sponsored" data-act="sp-run" data-tab="flights">' +
      ic.search + '<span>' + t('flights.search') + '</span></a>' +
      (trip === 'multi' ? '<p class="sp-note">' + t('sp.fl.multiNote') + '</p>' : '') +
      '<p class="sp-note">' + t('sp.fl.popular') + ' · ' + t('sp.fl.fare') + ' · ' + t('sp.fl.estNote') + '</p>' +
      '<div class="sp-tips">' + tips + '</div>' +
      (est ? '<p class="sp-note"><b style="color:var(--navy)">' + state.f.from + ' → ' + state.f.to + '</b> · ' +
        t('sp.fl.fare') + ' ' + money(est) + '</p>' : '') +
      '</form>';
  }

  function spCityOpts(sel) {
    return ['seoul', 'busan', 'jeju', 'gyeongju'].map(function (c) {
      return '<option value="' + c + '"' + (c === sel ? ' selected' : '') + '>' + t('city.' + c) + '</option>';
    }).join('');
  }
  function spPanelHotels() {
    var n = hotelsFor().length;
    var f = state.h;
    var chip = function (k, on, label) {
      return '<button type="button" class="chip' + (on ? ' on' : '') + '" data-act="sp-hf" data-k="' + k + '" aria-pressed="' +
        (on ? 'true' : 'false') + '">' + label + '</button>';
    };
    return '<form data-form="sp-hotels">' +
      '<div class="field-grid sp-grid">' +
      '<div class="field full"><label for="spCity">' + t('hotels.destination') + '</label><select id="spCity" data-sp-field="city">' + spCityOpts(f.city) + '</select></div>' +
      '<div class="field"><label for="spCin">' + t('hotels.checkin') + '</label><input id="spCin" type="date" data-sp-field="cin" min="' + iso(new Date()) + '" value="' + f.cin + '"></div>' +
      '<div class="field"><label for="spCout">' + t('hotels.checkout') + '</label><input id="spCout" type="date" data-sp-field="cout" min="' + f.cin + '" value="' + f.cout + '"></div>' +
      '<div class="field"><label for="spRooms">' + t('hotels.rooms') + '</label><select id="spRooms" data-sp-field="rooms">' + numOpts(1, 4, f.rooms) + '</select></div>' +
      '<div class="field"><label for="spAdults">' + t('sp.fl.adults') + '</label><select id="spAdults" data-sp-field="guests">' + numOpts(1, 8, f.guests) + '</select></div>' +
      '<div class="field"><label for="spKids">' + t('sp.ht.children') + '</label><select id="spKids" data-sp-field="hch">' + numOpts(0, 4, f.ch || 0) + '</select></div>' +
      '</div>' +
      '<div style="margin-top:10px"><label style="font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#63728A">' + t('sp.ht.filters') + '</label>' +
      '<div class="chip-row" style="padding:8px 0 0">' + chip('free', !!f.free, t('sp.deals.freecancel')) +
      chip('breakfast', !!f.breakfast, t('sp.deals.breakfast')) + chip('star5', f.stars === 5, '5★') +

  /* =====================================================================
     MyRealTrip + Klook feature layer
     · companion curation on the tour list (누구와 떠나시나요?)
     · verified guide card, traveller reviews and a write-a-review form
     · travel Q&A board (여행 지식인)
     · Klook ticket filters, partner search links, combo passes
     · time slot + voucher type on the booking sheet
     · mobile QR e-voucher wallet in #account
     · hanok / guesthouse / long-stay hotel filters
     Data: DATA.mrt, DATA.guides, DATA.reviews, DATA.qaTips, DATA.passes,
     DATA.hotelStay (see content_mrt_klook.py). Everything a visitor writes
     stays in this browser: mta_reviews_v1 / mta_qa_v1.
     ===================================================================== */
  var KEY_REVIEWS = 'mta_reviews_v1';
  var KEY_QA = 'mta_qa_v1';
  var QA_CATS = ['all', 'transfer', 'sim', 'weather', 'food'];

  function mrtOf(x) { return (DATA.mrt && x && DATA.mrt[x.id]) || {}; }
  function guideOf(x) { var m = mrtOf(x); return (m.guide && DATA.guides) ? DATA.guides[m.guide] : null; }
  function tourWho(x) { return mrtOf(x).who || []; }
  function tourKl(x) { return mrtOf(x).kl || []; }
  function tourSlots(x) { var s = mrtOf(x).slots; return (s && s.length) ? s : ['10:00', '14:00']; }
  function langShort(code) {
    for (var i = 0; i < LANGS.length; i++) if (LANGS[i].code === code) return LANGS[i].short;
    return String(code || '').toUpperCase();
  }
  function starsSVG(n) {
    var out = '';
    for (var i = 1; i <= 5; i++) out += '<span style="opacity:' + (i <= n ? '1' : '.22') + '">' + ic.star + '</span>';
    return out;
  }

  /* scannable-style QR: deterministic from the booking number, drawn as SVG */
  function qrSvg(seed) {
    var n = 25, h = 2166136261, i, j;
    var s = String(seed || 'MEMBERS');
    for (i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    function rnd() {
      h ^= h << 13; h >>>= 0; h ^= h >>> 17; h ^= h << 5; h >>>= 0;
      return h / 4294967296;
    }
    function finder(x, y) {
      var blocks = [[0, 0], [n - 7, 0], [0, n - 7]];
      for (var b = 0; b < blocks.length; b++) {
        var px = x - blocks[b][0], py = y - blocks[b][1];
        if (px >= 0 && px < 7 && py >= 0 && py < 7) {
          if (px === 0 || px === 6 || py === 0 || py === 6) return 1;
          if (px >= 2 && px <= 4 && py >= 2 && py <= 4) return 1;
          return 0;
        }
        if (px >= -1 && px <= 7 && py >= -1 && py <= 7) return 0;
      }
      return -1;
    }
    var d = '';
    for (j = 0; j < n; j++) {
      for (i = 0; i < n; i++) {
        var f = finder(i, j), on;
        if (f >= 0) on = f === 1;
        else if (i === 6 || j === 6) on = (i + j) % 2 === 0;
        else on = rnd() > 0.5;
        if (on) d += 'M' + i + ' ' + j + 'h1v1h-1z';
      }
    }
    return '<svg viewBox="0 0 ' + n + ' ' + n + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QR ' + esc(s) + '">' +
      '<rect width="' + n + '" height="' + n + '" fill="#fff"/><path d="' + d + '" fill="#164E63"/></svg>';
  }

  /* ------------------------------------------------------------- routing */
  /* Every channel tab and every detail sheet is a real history entry, so the
     browser Back button (and the iPhone swipe-back gesture) returns to the
     previous tab or closes the open sheet instead of leaving the site. */
  var TAB_LIST = ['tours', 'outbound', 'live', 'flights', 'hotels', 'quote', 'bookings', 'insurance', 'partner', 'account'];
  var modalTrail = [];
  var openKey = '';
  var appliedHash = '';
  var pushCount = 0;

  function hashNow() {
    var h = location.hash || '';
    return h.charAt(0) === '#' ? h : '#' + h;
  }
  function parseRoute() {
    var parts = hashNow().replace(/^#/, '').split('/').filter(function (p) { return p; });
    var head = parts[0] || '';
    if (head === 'bookings' && parts[1] === 'cancel') return { tab: 'bookings', modal: { kind: 'cancel', id: parts[2] || '' } };
    if (head === 'live' && parts[1] === 'watch' && parts[2]) return { tab: 'live', modal: { kind: 'live', id: decodeURIComponent(parts[2]) } };
    if (head === 'live' && parts[1] === 'submit') return { tab: 'live', modal: { kind: 'liveform', id: 'form' } };
    if (head === 'auth') return { tab: state.tab, modal: { kind: 'auth', id: parts[1] || 'signin' } };
    if (head === 'admin') return { tab: 'partner', modal: null, anchor: 'lvAdmin' };
    if (head === 'signup') return { tab: state.tab, modal: { kind: 'auth', id: 'join' } };
    if (head === 'login') return { tab: state.tab, modal: { kind: 'auth', id: 'signin' } };
    if (head === 'quote' && parts[1] && parts[1].indexOf('plan=') === 0) return { tab: 'quote', modal: null, plan: parts[1].slice(5) };
    if (TAB_LIST.indexOf(head) >= 0) return { tab: head, modal: null };
    if (head === 'tour' && parts[1]) return { tab: 'tours', modal: { kind: 'tour', id: parts[1] } };
    if (head === 'flight' && parts[1]) return { tab: 'flights', modal: { kind: 'flight', id: decodeURIComponent(parts.slice(1).join('/')) } };
    if (head === 'hotel' && parts[1]) return { tab: 'hotels', modal: { kind: 'hotel', id: parts[1] } };
    return { tab: state.tab, modal: null };
  }
  function writeHash(hash, replace) {
    try {
      if (replace) history.replaceState({ app: true }, '', hash);
      else history.pushState({ app: true }, '', hash);
      appliedHash = hash;
      if (!replace) pushCount += 1;
      return true;
    } catch (e) {
      /* local file:// previews reject pushState with a URL — a plain hash change is still a history entry */
      try { if (replace) location.replace(hash); else location.hash = hash.slice(1); } catch (e2) { /* ignore */ }
      appliedHash = hashNow();
      if (!replace) pushCount += 1;
      return false;
    }
  }
  function go(hash, replace) {
    if (!hash) return;
    if (hashNow() === hash && !replace) {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    writeHash(hash, replace);
    applyRoute();
  }
  function showTab(tab, opts) {
    opts = opts || {};
    state.tab = tab;
    TAB_LIST.forEach(function (v) { $('#view-' + v).hidden = v !== tab; });
    renderView(tab);
    applyChrome();
    if (!opts.keepScroll) window.scrollTo({ top: 0, behavior: opts.instant ? 'auto' : 'smooth' });
  }
  function applyRoute() {
    var r = parseRoute();
    if (state.tab !== r.tab) showTab(r.tab, { instant: true });
    if (r.plan) {
      if (ymApplyPlan(r.plan)) {
        renderView('quote');
        toast(t('ym.share.restored'));
      } else {
        toast(t('ym.share.bad'));
      }
    }
    if (r.anchor) {
      var target = $('#' + r.anchor);
      if (target) setTimeout(function () { target.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 80);
    }
    var key = r.modal ? r.modal.kind + ':' + r.modal.id : '';
    if (key === openKey) {
      if (!key && $('#modal').classList.contains('open')) hideModal();
      return;
    }
    if (key) {
      var known = r.modal.kind === 'tour' ? !!findTour(r.modal.id)
        : r.modal.kind === 'hotel' ? !!findHotel(r.modal.id)
          : r.modal.kind === 'flight' ? !!findFlight(r.modal.id)
            : r.modal.kind === 'live' ? !!lvById(r.modal.id)
              : true;
      if (!known) { hideModal(); return; }
    }
    openKey = key;
    modalTrail = [];
    if (!key) { hideModal(); return; }
    if (r.modal.kind === 'tour') tourModal(r.modal.id, true);
    else if (r.modal.kind === 'flight') flightModal(r.modal.id, true);
    else if (r.modal.kind === 'hotel') hotelRoomsModal(r.modal.id, true);
    else if (r.modal.kind === 'cancel') cancelBookingModal(r.modal.id, true);
    else if (r.modal.kind === 'live') liveModal(r.modal.id, true);
    else if (r.modal.kind === 'liveform') lvFormModal(true);
    else if (r.modal.kind === 'auth') authModal(r.modal.id, true);
    else hideModal();
  }
  function onHistoryNav() {
    var h = hashNow();
    if (h === appliedHash) return;
    appliedHash = h;
    if (pushCount > 0) pushCount -= 1;
    applyRoute();
  }

  /* ---- sheets: one renderer per step, so ← Back inside a sheet steps back ---- */
  function modalBar(title) {
    return '<div class="m-bar">' +
      '<button type="button" class="m-back" data-act="modal-back">' + ic.back + '<span>' + t('common.back') + '</span></button>' +

  function paintModal(html, footerHtml) {
    $('#modalCard').innerHTML = '<div class="m-scroll">' + html + '</div>' + (footerHtml || '');
    $('#modal').classList.add('open');
    $('#modal').setAttribute('aria-hidden', 'false');
    document.body.classList.add('modal-open');
    var sc = $('#modalCard .m-scroll');
    if (sc) sc.scrollTop = 0;
  }
  function showModal(key, render, html, footerHtml) {
    openKey = key;
    modalTrail = render ? [{ render: render }] : [];
    paintModal(html, footerHtml);
  }
  function pushModalStep(render, html, footerHtml) {
    if (render) modalTrail.push({ render: render });
    paintModal(html, footerHtml);
  }
  function hideModal() {
    $('#modal').classList.remove('open');
    $('#modal').setAttribute('aria-hidden', 'true');
    document.body.classList.remove('modal-open');
    /* Clear the sheet so an embedded YouTube player stops playing. */
    $('#modalCard').innerHTML = '';
    openKey = '';
    modalTrail = [];
  }
  function closeModal() {
    if (openKey && pushCount > 0) { history.back(); return; }
    if (openKey) { go('#' + state.tab, true); return; }
    hideModal();
  }
  function modalBack() {
    if (modalTrail.length > 1) {
      modalTrail.pop();
      var top = modalTrail[modalTrail.length - 1];
      if (top && top.render) { top.render(); return; }
    }
    closeModal();
  }

<script>
/* =====================================================================
   MTA_PARSE — client-side itinerary reader for the Partner Hub.

   Reads .xlsx / .csv / .docx / .pptx / .pdf entirely in the browser:
   Office files are ZIP containers, so a minimal ZIP reader (with the
   browser's own DecompressionStream) opens them and the XML inside is
   scanned for text. PDFs are read by walking the object graph, inflating
   content streams and decoding strings through each font's ToUnicode CMap.

   Nothing leaves the page: no CDN library, no upload, no server.
   Exposes window.MTA_PARSE = { readFile, extract, maxBytes }.
   ===================================================================== */
(function () {
  'use strict';

  var MAX_BYTES = 10 * 1024 * 1024;

  /* ------------------------------------------------------------ helpers */
  function utf8(u8) {
    try { return new TextDecoder('utf-8').decode(u8); }
    catch (e) { return latin1(u8); }
  }
  function latin1(u8) {
    var out = '', i = 0, n = u8.length;
    while (i < n) { out += String.fromCharCode.apply(null, u8.subarray(i, Math.min(i + 8192, n))); i += 8192; }
    return out;
  }
  function decodeText(buf) {
    var u8 = new Uint8Array(buf);
    if (u8[0] === 0xFF && u8[1] === 0xFE) { try { return new TextDecoder('utf-16le').decode(u8.subarray(2)); } catch (e) {} }
    var s = utf8(u8);
    if (s.indexOf('\uFFFD') >= 0) {
      try {
        var alt = new TextDecoder('euc-kr').decode(u8);
        if (alt.indexOf('\uFFFD') < 0) return alt;
      } catch (e2) { /* encoding not supported */ }
    }
    return s.replace(/^\uFEFF/, '');
  }
  function unescapeXml(s) {
    return String(s).replace(/&#x([0-9a-fA-F]+);/g, function (m, h) { return String.fromCodePoint(parseInt(h, 16)); })
      .replace(/&#(\d+);/g, function (m, d) { return String.fromCodePoint(parseInt(d, 10)); })
      .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"')
      .replace(/&apos;/g, "'").replace(/&amp;/g, '&').replace(/&nbsp;/g, ' ');
  }
  function stripTags(xml) {
    return unescapeXml(String(xml).replace(/<[^>]*>/g, ''));
  }
  /* PDF text often arrives one text-run per line; glue the tiny fragments
     back so words, dates and "4박5일" stay readable. */
  function reflow(text) {
    var lines = String(text).split('\n'), out = [];
    function cjk(ch) { return /[\uac00-\ud7a3\u4e00-\u9fff\u3040-\u30ff]/.test(ch); }
    lines.forEach(function (raw) {
      var l = raw.trim();
      if (!l) { if (out.length && out[out.length - 1] !== '') out.push(''); return; }
      var prev = out.length ? out[out.length - 1] : '';
      var short = l.length <= 3;
      var punctStart = /^[·)\].,:;!?'"”’%…—–-]/.test(l);
      if (prev && (short || punctStart) && !/^(?:DAY|Day|D)\s*\d/i.test(l) && !/^\d{1,2}$/.test(l)) {
        var a = prev.charAt(prev.length - 1), b = l.charAt(0);
        var space = !(cjk(a) || cjk(b) || /[([“‘']$/.test(a) || /^[)\].,:;!?%]/.test(b));
        out[out.length - 1] = prev + (space ? ' ' : '') + l;
      } else out.push(l);
    });
    return out.join('\n');
  }
  function tidy(text) {
    return String(text || '')
      .replace(/\r\n?/g, '\n').replace(/\u00a0/g, ' ')
      .replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n')
      .replace(/[ \t]{2,}/g, ' ')
      .trim();
  }

  /* --------------------------------------------------------------- zip */
  function findEOCD(u8) {
    var min = Math.max(0, u8.length - 66000);
    for (var i = u8.length - 22; i >= min; i--) {
      if (u8[i] === 0x50 && u8[i + 1] === 0x4b && u8[i + 2] === 0x05 && u8[i + 3] === 0x06) return i;
    }
    return -1;
  }
  function inflateRaw(data) {
    if (typeof DecompressionStream === 'undefined') {
      return Promise.reject({ code: 'browser' });
    }
    try {
      var ds = new DecompressionStream('deflate-raw');
      var stream = new Blob([data]).stream().pipeThrough(ds);
      return new Response(stream).arrayBuffer();
    } catch (e) {
      return Promise.reject({ code: 'browser' });
    }
  }
  function unzip(buf) {
    var u8 = new Uint8Array(buf), dv = new DataView(buf);
    var eocd = findEOCD(u8);
    if (eocd < 0) return Promise.reject({ code: 'zip' });
    var count = dv.getUint16(eocd + 10, true), off = dv.getUint32(eocd + 16, true);
    var entries = [], p = off, i;
    for (i = 0; i < count; i++) {
      if (p + 46 > u8.length || dv.getUint32(p, true) !== 0x02014b50) break;
      var method = dv.getUint16(p + 10, true);
      var csize = dv.getUint32(p + 20, true);
      var nlen = dv.getUint16(p + 28, true);
      var elen = dv.getUint16(p + 30, true);
      var clen = dv.getUint16(p + 32, true);
      var lo = dv.getUint32(p + 42, true);
      entries.push({ name: utf8(u8.subarray(p + 46, p + 46 + nlen)), method: method, csize: csize, lo: lo });
      p += 46 + nlen + elen + clen;
    }
    var jobs = [];
    entries.forEach(function (en) {
      if (en.csize === 0 || en.lo + 30 > u8.length) return;
      if (dv.getUint32(en.lo, true) !== 0x04034b50) return;
      var nl = dv.getUint16(en.lo + 26, true), el = dv.getUint16(en.lo + 28, true);
      var start = en.lo + 30 + nl + el;
      var data = u8.subarray(start, Math.min(start + en.csize, u8.length));
      if (en.method === 0) jobs.push(Promise.resolve([en.name, data]));
      else if (en.method === 8) {
        jobs.push(inflateRaw(data).then(function (out) {
          return [en.name, new Uint8Array(out)];
        }).catch(function () { return null; }));
      }
    });
    return Promise.all(jobs).then(function (pairs) {
      var map = {};
      pairs.forEach(function (pr) { if (pr) map[pr[0]] = pr[1]; });
      return map;
    });
  }

  /* -------------------------------------------------------------- xlsx */
  function xlsxText(zip) {
    var dec = new TextDecoder('utf-8');
    var shared = [];
    if (zip['xl/sharedStrings.xml']) {
      var ss = dec.decode(zip['xl/sharedStrings.xml']);
      var sis = ss.match(/<si\b[\s\S]*?<\/si>/g) || [];
      shared = sis.map(function (si) {
        var ts = si.match(/<t\b[^>]*>([\s\S]*?)<\/t>/g) || [];
        return ts.map(function (t) { return unescapeXml(t.replace(/<[^>]*>/g, '')); }).join('');
      });
    }
    var sheets = Object.keys(zip).filter(function (n) { return /^xl\/worksheets\/sheet\d+\.xml$/.test(n); })
      .sort(function (a, b) { return parseInt(a.match(/sheet(\d+)/)[1], 10) - parseInt(b.match(/sheet(\d+)/)[1], 10); });
    var out = [];
    sheets.forEach(function (name, idx) {
      var xml = dec.decode(zip[name]);
      var rows = xml.match(/<row\b[\s\S]*?<\/row>/g) || [];
      out.push('### ' + (idx + 1) + ' ' + name.split('/').pop());
      rows.forEach(function (row) {
        var cells = row.match(/<c\b[^>]*?(?:\/>|>[\s\S]*?<\/c>)/g) || [];
        var vals = [];
        cells.forEach(function (c) {
          var tAttr = (c.match(/\bt="([^"]+)"/) || [])[1] || '';
          var v = (c.match(/<v>([\s\S]*?)<\/v>/) || [])[1];
          var inline = (c.match(/<is>[\s\S]*?<\/is>/) || [])[0];
          var val = '';
          if (inline) val = stripTags(inline);
          else if (tAttr === 's' && v != null) val = shared[parseInt(v, 10)] || '';
          else if (tAttr === 'inlineStr') val = stripTags(c);
          else if (v != null) val = unescapeXml(v);
          vals.push(val.replace(/\s+/g, ' ').trim());
        });
        var line = vals.join('\t').replace(/\t+$/, '');
        if (line.replace(/\t/g, '').trim()) out.push(line);
      });
      out.push('');
    });
    return out.join('\n');
  }

  /* -------------------------------------------------------------- docx */
  function docxText(zip) {
    var dec = new TextDecoder('utf-8');
    var parts = ['word/document.xml', 'word/header1.xml', 'word/footer1.xml'].filter(function (n) { return zip[n]; });
    var out = parts.map(function (n) {
      var x = dec.decode(zip[n])
        .replace(/<w:tab\b[^>]*\/>/g, '\t')
        .replace(/<w:br\b[^>]*\/>/g, '\n')
        .replace(/<\/w:tc>/g, '\t')
        .replace(/<\/w:tr>/g, '\n')
        .replace(/<\/w:p>/g, '\n');
      return stripTags(x);
    });
    return out.join('\n');
  }

  /* -------------------------------------------------------------- pptx */
  function pptxText(zip) {
    var dec = new TextDecoder('utf-8');
    var slides = Object.keys(zip).filter(function (n) { return /^ppt\/slides\/slide\d+\.xml$/.test(n); })
      .sort(function (a, b) { return parseInt(a.match(/slide(\d+)/)[1], 10) - parseInt(b.match(/slide(\d+)/)[1], 10); });
    var out = [];
    slides.forEach(function (n, i) {
