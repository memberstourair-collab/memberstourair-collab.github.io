<style>
/* =====================================================================
   BRAND PALETTE — swap these values to match the company letterhead.
   Everything else in the design reads from these variables.
   ===================================================================== */
:root{
  --navy:#164E63;
  --navy-2:#1B5E96;
  --teal:#2A8C82;
  --teal-2:#38A39D;
  --accent:#E8826B;
  --accent-soft:#FDEDE8;
  --ink:#16202C;
  --muted:#63728A;
  --line:#E1EAEE;
  --bg:#F4F8F9;
  --card:#FFFFFF;
  --ok:#127C5B;
  --danger:#B4413A;
  --radius:20px;
  --radius-sm:14px;
  --shadow:0 10px 30px rgba(11,34,57,.08);
  --shadow-sm:0 4px 14px rgba(11,34,57,.06);
  --maxw:1120px;
  --header-h:60px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Hiragino Sans","PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,"Liberation Sans","Noto Sans",sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
img,svg{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p{margin:0}
ul{margin:0;padding:0;list-style:none}
input,select,textarea{font:inherit;color:inherit}
.container{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 16px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------------- header ---------------- */
.app-header{
  position:sticky;top:0;z-index:40;
  background:rgba(255,255,255,.94);
  backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.header-inner{display:flex;align-items:center;gap:12px;height:var(--header-h);max-width:var(--maxw);margin:0 auto;padding:0 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
/* logo slot: replaced by <img> when BRAND.logoImage is set */
.brand-mark{width:40px;height:40px;flex:0 0 40px;border-radius:50%;overflow:hidden;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 1px rgba(22,78,99,.10)}
.brand-mark svg{width:100%;height:100%}
.brand-mark img{width:100%;height:100%;object-fit:cover;background:#fff}
.brand-text{min-width:0;line-height:1.15}
.brand-text strong{display:block;font-size:16px;letter-spacing:-.02em;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.top-nav{display:none;align-items:center;gap:4px}
.top-nav button{padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted)}
.top-nav button.on{color:var(--navy);background:#EEF3F8}
.header-tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.seg{display:inline-flex;background:#EEF3F8;border-radius:999px;padding:3px}
.seg button{padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.01em;white-space:nowrap}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(11,34,57,.12)}
.icon-btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:999px;background:#EEF3F8;color:var(--navy);font-size:12px;font-weight:700}
.icon-btn svg{width:17px;height:17px}
.lang-sheet{
  position:fixed;top:calc(var(--header-h) + env(safe-area-inset-top));right:12px;z-index:45;
  background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  padding:6px;min-width:190px;display:none;
}
.lang-sheet.open{display:block;animation:pop .16s ease-out}
.lang-sheet button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:9px 12px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink)}
.lang-sheet button:hover{background:#F3F6FA}
.lang-sheet button.on{color:var(--teal);background:#EDF7F5}
.lang-sheet .code{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ---------------- hero ---------------- */
.hero{
  position:relative;overflow:hidden;color:#fff;background-color:#0B2E3C;
  background-image:
    radial-gradient(900px 420px at 86% -14%, rgba(56,163,157,.42), transparent 64%),
    linear-gradient(92deg, rgba(4,19,30,.94) 0%, rgba(5,24,36,.88) 34%, rgba(6,31,44,.62) 66%, rgba(7,38,50,.34) 100%),
    linear-gradient(180deg, rgba(4,16,26,.5) 0%, rgba(4,16,26,.12) 38%, rgba(4,16,26,.55) 100%),
    url("images/hero-seoul.webp");
  background-size:cover, cover, cover, cover;
  background-position:center, center, center, center 38%;
  background-repeat:no-repeat;
}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:120px;background:linear-gradient(180deg,transparent,rgba(6,18,30,.35))}
.hero-inner{position:relative;z-index:2;max-width:var(--maxw);margin:0 auto;padding:34px 16px 32px;display:grid;gap:22px}
.hero-copy{max-width:560px}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#9FE3D7}
.kicker .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.hero h1{font-size:29px;line-height:1.22;letter-spacing:-.03em;margin:12px 0 10px;font-weight:800}
.hero p{color:#C6D6E4;font-size:14.5px;line-height:1.6;max-width:520px}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:48px;padding:0 20px;border-radius:14px;font-size:14.5px;font-weight:700;
  transition:transform .15s ease, box-shadow .2s ease, background .2s ease;
}
.btn:active{transform:scale(.985)}
.btn svg{width:18px;height:18px}
.btn-primary{background:linear-gradient(135deg,var(--teal-2),var(--teal));color:#fff;box-shadow:0 10px 24px rgba(14,124,123,.35)}
.btn-primary:hover{box-shadow:0 12px 28px rgba(14,124,123,.45)}
.btn-ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.22)}
.btn-light{background:#fff;color:var(--navy);box-shadow:var(--shadow-sm)}
.btn-block{width:100%}
.hero-stats{display:flex;gap:20px;flex-wrap:wrap;margin-top:22px}
.hero-stats div{display:flex;flex-direction:column}
.hero-stats b{font-size:20px;letter-spacing:-.02em}
.hero-stats span{font-size:11px;color:#9FB4C8;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.hero-art{display:none}
.hero-art svg{width:100%;height:auto;filter:drop-shadow(0 18px 30px rgba(0,0,0,.28))}

/* ---------------- section shell ---------------- */
.view{padding:26px 0 34px}
.view[hidden]{display:none}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px}
.section-head h2{font-size:21px;letter-spacing:-.02em;color:var(--navy)}
.section-head p{font-size:13px;color:var(--muted);margin-top:3px}
.count-pill{font-size:12px;font-weight:700;color:var(--teal);background:#E9F5F2;border-radius:999px;padding:5px 11px;white-space:nowrap}

/* ---------------- chips ---------------- */
.chip-row{display:flex;gap:8px;overflow-x:auto;padding:2apx 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chip-row::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:#fff;
  font-size:13px;font-weight:600;color:#40506A;white-space:nowrap;transition:.18s;
}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 6px 14px rgba(11,34,57,.18)}
.chip:active{transform:scale(.97)}

/* ---------------- cards ---------------- */
.grid{display:grid;gap:16px;grid-template-columns:1fr}
.tour-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow-sm);display:flex;flex-direction:column;text-align:left;width:100%;
  transition:transform .18s ease, box-shadow .2s ease;
}
.tour-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.cover{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--navy)}
.cover .art{width:100%;height:100%;object-fit:cover;display:block}
.cover img.art{transition:transform .5s cubic-bezier(.2,.6,.2,1)}
.tour-card:hover .cover img.art{transform:scale(1.045)}
.cover .badges{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:78%}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;
  font-size:10.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;
  background:rgba(255,255,255,.92);color:var(--navy);backdrop-filter:blur(6px);
}
.badge svg{width:12px;height:12px}
.badge.accent{background:var(--accent);color:#3B2506}
.badge.teal{background:var(--teal);color:#fff}
.cover .code{
  position:absolute;bottom:10px;right:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:10.5px;font-weight:700;letter-spacing:.06em;color:rgba(255,255,255,.9);
  background:rgba(9,24,38,.42);padding:4px 8px;border-radius:999px;backdrop-filter:blur(6px);
}
.card-body{padding:14px 15px 16px;display:flex;flex-direction:column;gap:9px;flex:1}
.card-top{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--teal)}
.card-top .sep{width:3px;height:3px;border-radius:50%;background:#C3CEDA}
.card-top .loc{color:var(--muted);text-transform:none;letter-spacing:0;font-weight:600;font-size:12px;display:flex;align-items:center;gap:4px}
.card-top .loc svg{width:12px;height:12px}
.tour-card h3{font-size:16.5px;line-height:1.32;letter-spacing:-.015em;color:var(--navy);font-weight:800}
.card-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.card-meta span{display:inline-flex;align-items:center;gap:5px}
.card-meta svg{width:13px;height:13px;opacity:.75}
.card-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:auto;padding-top:6px;border-top:1px dashed var(--line)}
.price{display:flex;flex-direction:column;line-height:1.2}
.price small{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.price b{font-size:18px;color:var(--navy);letter-spacing:-.02em}
.price em{font-style:normal;font-size:11px;color:var(--muted);font-weight:600}
.rating{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--navy)}
.rating svg{width:14px;height:14px;color:var(--accent)}
.rating span{color:var(--muted);font-weight:500}
.arrow-btn{width:38px;height:38px;border-radius:50%;background:#EEF3F8;display:grid;place-items:center;color:var(--navy);flex:0 0 38px}
.arrow-btn svg{width:17px;height:17px}

/* ---------------- search panels ---------------- */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:14px}
.panel + .panel{margin-top:12px}
.trip-toggle{display:inline-flex;background:#EEF3F8;border-radius:12px;padding:3px;margin-bottom:12px}
.trip-toggle button{padding:7px 14px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--muted)}
.trip-toggle button.on{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(11,34,57,.14)}
.field-grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field select,.field input,.field textarea{
  width:100%;height:44px;border:1px solid var(--line);background:#FBFCFE;border-radius:12px;padding:0 11px;
  font-size:14px;color:var(--ink);appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2363728A' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 9px center;background-size:16px;
  padding-right:30px;
}
.field input[type=date]{background-image:none;padding-right:11px}
.field input[type=text],.field input[type=email],.field input[type=tel],.field input[type=number],.field input[type=search]{background-image:none;padding-right:11px}
.field input[type=number]{-moz-appearance:textfield;appearance:textfield}
.field input[type=number]::-webkit-outer-spin-button,.field input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field textarea{height:auto;min-height:74px;padding:11px;background-image:none;resize:vertical;line-height:1.45}
.field select:focus,.field input:focus,.field textarea:focus{outline:2px solid rgba(18,163,148,.35);border-color:var(--teal)}
.field .hint{font-size:11px;color:var(--muted)}
.swap-wrap{position:relative}
.swap-btn{position:absolute;right:-2px;top:-8px;width:30px;height:30px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--teal);box-shadow:var(--shadow-sm);z-index:2}
.swap-btn svg{width:15px;height:15px}
.demo-strip{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:11px;color:#8A4C3C;background:var(--accent-soft);border:1px solid #F6D6CD;border-radius:10px;padding:7px 10px;line-height:1.35}
.demo-strip svg{width:13px;height:13px;flex:0 0 13px;color:#C36A53}
.results-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 10px;flex-wrap:wrap}
.results-head h3{font-size:15px;color:var(--navy);letter-spacing:-.01em}
.results-head .sub{font-size:12px;color:var(--muted);margin-top:2px}
.sort-row{display:flex;gap:6px}
.sort-row button{font-size:12px;font-weight:700;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted)}
.sort-row button.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* ---------------- flight card ---------------- */
.flight{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:14px;display:flex;flex-direction:column;gap:12px}
.flight-top{display:flex;align-items:center;gap:10px}
.airline-logo{width:34px;height:34px;border-radius:10px;background:#EEF3F8;display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--navy);letter-spacing:.02em;flex:0 0 34px}
.flight-top .airline{font-size:13px;font-weight:700;color:var(--navy)}
.flight-top .fno{font-size:11px;color:var(--muted);margin-top:1px}
.flight-top .tag{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--teal);background:#E9F5F2;padding:4px 8px;border-radius:999px}
.route{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.route .t{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-.02em;line-height:1.1}
.route .ap{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.route .mid{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);font-weight:600}
.route .line{width:100%;height:2px;background:linear-gradient(90deg,#D7E1EC,#9FB6C9,#D7E1EC);border-radius:2px;position:relative}
.route .line::before,.route .line::after{content:"";position:absolute;top:50%;width:5px;height:5px;border-radius:50%;background:#8FA9BF;transform:translateY(-50%)}
.route .line::before{left:0}.route .line::after{right:0}
.route .arr{text-align:right}
.flight-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px dashed var(--line);padding-top:11px}
.flight-bottom .price b{font-size:19px}
.btn-sm{height:40px;padding:0 16px;border-radius:12px;font-size:13.5px;font-weight:700}

/* ---------------- hotel card ---------------- */
.hotel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);display:flex;flex-direction:column}
.hotel-cover{position:relative;aspect-ratio:16/7;background:var(--navy)}
.hotel-cover .art{width:100%;height:100%;object-fit:cover;display:block}
.hotel-cover img.art{transition:transform .5s cubic-bezier(.2,.6,.2,1)}
.hotel:hover .hotel-cover img.art{transform:scale(1.04)}
.hotel-cover .stars{position:absolute;top:10px;left:12px;display:flex;gap:2px}
.hotel-cover .stars svg{width:13px;height:13px;color:var(--accent);filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.hotel-body{padding:13px 15px 15px;display:flex;flex-direction:column;gap:10px}
.hotel-body h3{font-size:16px;color:var(--navy);letter-spacing:-.015em;font-weight:800;line-height:1.3}
.hotel-area{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.hotel-area svg{width:12px;height:12px}
.amenities{display:flex;flex-wrap:wrap;gap:6px}
.amenity{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#4A5A72;background:#F3F6FA;border-radius:999px;padding:4px 8px}
.amenity svg{width:12px;height:12px;color:var(--teal)}
.hotel-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-top:1px dashed var(--line);padding-top:11px;margin-top:auto}
.breakfast-flag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--ok);background:#EAF7F1;border-radius:8px;padding:4px 8px;width:max-content}
.breakfast-flag svg{width:12px;height:12px}

/* ---------------- rooms / modal content ---------------- */
.room-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.room-row:last-child{border-bottom:0}
.room-row .rn{font-size:14px;font-weight:700;color:var(--navy)}
.room-row .rd{font-size:11.5px;color:var(--muted);margin-top:2px}
.room-row .rp{text-align:right;flex:0 0 auto}
.room-row .rp b{display:block;font-size:15px;color:var(--navy)}
.room-row .rp small{font-size:10.5px;color:var(--muted)}
.m-hd{position:relative}
.m-hd .cover{aspect-ratio:16/8;border-radius:0}
.m-hd .m-close{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;color:var(--navy);box-shadow:var(--shadow-sm);z-index:3}
.m-hd .m-close svg{width:17px;height:17px}
.m-body{padding:18px 18px 22px}
.m-title{font-size:20px;line-height:1.3;letter-spacing:-.02em;color:var(--navy);font-weight:800}
.m-sub{font-size:12.5px;color:var(--muted);margin-top:5px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.m-sub span{display:inline-flex;align-items:center;gap:4px}
.m-sub svg{width:13px;height:13px}
.m-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 4px}
.m-meta div{background:#F5F8FB;border-radius:12px;padding:10px 12px}
.m-meta dt{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 3px}
.m-meta dd{margin:0;font-size:13px;font-weight:700;color:var(--navy);line-height:1.35}
.m-sec{margin-top:18px}
.m-sec h4{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.hl-list li{display:flex;gap:9px;padding:5px 0;font-size:13.5px;color:#2B3A4C;line-height:1.45}
.hl-list svg{width:15px;height:15px;color:var(--teal);flex:0 0 15px;margin-top:2px}
.inc-chips{display:flex;flex-wrap:wrap;gap:6px}
.inc-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:#2B3A4C;background:#F3F6FA;border-radius:9px;padding:6px 9px}
.inc-chip svg{width:12px;height:12px;color:var(--teal)}
.m-footer{position:sticky;bottom:0;z-index:2;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;flex:0 0 auto}
.m-footer .price{flex:1}
.m-footer .btn{height:46px}
.form-note{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:10px}
.summary{background:#F5F8FB;border-radius:14px;padding:12px 14px;margin-top:14px;font-size:13px}
.summary .row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;color:#43536B}
.summary .row.total{border-top:1px dashed #D8E1EB;margin-top:7px;padding-top:9px;font-weight:800;color:var(--navy);font-size:14.5px}
.success{text-align:center;padding:34px 22px 26px}
.success .tick{width:64px;height:64px;border-radius:50%;background:#E9F5F2;display:grid;place-items:center;margin:0 auto 16px;color:var(--ok)}
.success .tick svg{width:30px;height:30px}
.success h3{font-size:20px;color:var(--navy);letter-spacing:-.02em}
.success p{font-size:13.5px;color:var(--muted);margin-top:7px;line-height:1.5}
.ref-box{margin:18px auto 0;max-width:320px;border:1px dashed #C9D6E3;border-radius:12px;padding:11px;background:#FBFCFE}
.ref-box small{display:block;font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.ref-box b{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:19px;letter-spacing:.12em;color:var(--navy);margin-top:3px}
.success-actions{display:flex;gap:9px;margin-top:20px}
.success-actions .btn{flex:1}

/* ---------------- bookings ---------------- */
.booking{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:14px;display:flex;flex-direction:column;gap:10px}
.booking-top{display:flex;align-items:center;gap:8px}
.type-badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:#EEF3F8;color:var(--navy)}
.type-badge svg{width:12px;height:12px}
.type-badge.quote{background:#EEF0FB;color:#39407F}
.type-badge.flight{background:#E9F1FB;color:#1D4F8C}
.type-badge.hotel{background:#FDF1E4;color:#96601B}
.type-badge.tour{background:#E9F5F2;color:#0A6A5F}
.status{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ok);display:inline-flex;align-items:center;gap:5px}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.status.cancelled{color:var(--danger)}
.booking h3{font-size:15.5px;color:var(--navy);font-weight:800;letter-spacing:-.01em;line-height:1.3}
.booking .bk-meta{display:flex;flex-wrap:wrap;gap:5px 14px;font-size:12px;color:var(--muted)}
.booking .bk-meta span{display:inline-flex;align-items:center;gap:5px}
.booking .bk-meta svg{width:12px;height:12px}
.booking-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px dashed var(--line);padding-top:10px}
.ref-mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--muted);letter-spacing:.06em}
.link-danger{font-size:12.5px;font-weight:700;color:var(--danger);padding:7px 10px;border-radius:9px;background:#FCF1F0}
.empty{text-align:center;padding:44px 20px;background:#fff;border:1px dashed #D5DFEA;border-radius:var(--radius)}
.empty .ico{width:64px;height:64px;border-radius:50%;background:#EEF3F8;display:grid;place-items:center;margin:0 auto 14px;color:#8FA5BC}
.empty .ico svg{width:28px;height:28px}
.empty h3{font-size:17px;color:var(--navy)}
.empty p{font-size:13px;color:var(--muted);margin:6px 0 16px}

/* ---------------- custom ground / MICE quote ---------------- */
.qhero{
  position:relative;overflow:hidden;color:#fff;background-color:#0B2E3C;
  background-image:
    radial-gradient(620px 300px at 88% -20%, rgba(232,130,107,.30), transparent 62%),
    radial-gradient(760px 340px at 8% -10%, rgba(56,163,157,.34), transparent 66%),
    linear-gradient(96deg, #0A2A38 0%, #10414F 56%, #16545C 100%);
}
.qhero-inner{max-width:var(--maxw);margin:0 auto;padding:30px 16px 26px;display:grid;gap:18px}
.qhero .kicker{color:#9FE3D7}
.qhero h1{font-size:25px;line-height:1.24;letter-spacing:-.03em;margin:10px 0 8px;font-weight:800;max-width:640px}
.qhero p{color:#C6D6E4;font-size:13.5px;line-height:1.6;max-width:600px}
.qhero-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.qhero-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#D7ECE8;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 10px}
.qhero-chip svg{width:12px;height:12px;color:#9FE3D7}
.qhero .btn{margin-top:18px;width:max-content}
.qwrap{display:grid;gap:16px}
.qmain{display:flex;flex-direction:column;gap:14px;min-width:0}
.qcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:15px}
.qcard-head{margin-bottom:12px}
.qstep{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.qcard h3{font-size:16px;color:var(--navy);letter-spacing:-.015em;margin-top:4px;font-weight:800}
.qhint{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45}
.qsvc{display:flex;flex-direction:column;gap:9px}
.qsvc-row{border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:#FBFCFE;transition:border-color .15s, background .15s}
.qsvc-row.on{border-color:#BFE4DD;background:#F4FAF8}
.qsvc-top{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.qbox{width:22px;height:22px;border-radius:7px;border:1.6px solid #C6D3E1;background:#fff;display:grid;place-items:center;flex:0 0 22px;color:#fff}
.qbox svg{width:14px;height:14px;opacity:0;transition:opacity .15s}
.qsvc-row.on .qbox{background:var(--teal);border-color:var(--teal)}
.qsvc-row.on .qbox svg{opacity:1}
.qsvc-top .txt{flex:1 1 auto;min-width:0}
.qsvc-top b{display:block;font-size:14px;color:var(--navy);font-weight:800;line-height:1.3}
.qsvc-top small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.qsvc-state{font-size:10.5px;font-weight:800;letter-spacing:.04em;color:#8A9AAE;white-space:nowrap;padding-top:2px}
.qsvc-row.on .qsvc-state{color:var(--teal)}
.qsvc-body{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line)}
.qsvc-body[hidden]{display:none}
.qsub-label{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.qopt-grid{display:grid;gap:7px;grid-template-columns:1fr}
.qopt{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 11px;transition:.15s}
.qopt:active{transform:scale(.99)}
.qopt.on{border-color:var(--teal);background:#EDF7F5;box-shadow:inset 0 0 0 1px rgba(42,140,130,.22)}
.qopt .qdot{width:17px;height:17px;border-radius:50%;border:1.6px solid #C6D3E1;background:#fff;flex:0 0 17px;margin-top:1px;display:grid;place-items:center;color:#fff}
.qopt .qdot svg{width:10px;height:10px;opacity:0}
.qopt.on .qdot{border-color:var(--teal);background:var(--teal)}
.qopt.on .qdot svg{opacity:1}
.qopt .otxt{flex:1 1 auto;min-width:0}
.qopt b{display:block;font-size:13px;color:var(--navy);font-weight:700;line-height:1.3}
.qopt small{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.35}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchip{font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:#40506A;white-space:nowrap}
.qchip.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 5px 12px rgba(11,34,57,.16)}
.qchip:active{transform:scale(.97)}
.qside{display:flex;flex-direction:column;gap:12px;min-width:0}
.qest{background:linear-gradient(158deg,#0F3D4B 0%,#0A2A36 100%);color:#fff;border-radius:var(--radius);padding:16px;box-shadow:0 14px 30px rgba(8,32,44,.22)}
.qest-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.qest-head h3{font-size:14px;font-weight:800;letter-spacing:-.01em}
.qest-head span{font-size:10.5px;color:#9FE3D7;font-weight:700}
.qest-lines{display:flex;flex-direction:column;gap:6px;margin:12px 0 10px;font-size:11.5px;color:#C6D6E4;line-height:1.4}
.qest-line{display:flex;justify-content:space-between;gap:10px}
.qest-line span:first-child{min-width:0}
.qest-line b{font-weight:700;color:#fff;white-space:nowrap}
.qest-total{border-top:1px solid rgba(255,255,255,.18);padding-top:10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.qest-total small{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#9FE3D7}
.qest-total b{font-size:21px;letter-spacing:-.02em}
.qest-per{font-size:11.5px;color:#9FE3D7;margin-top:3px}
.qest-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:#A9BFCE;margin-top:8px}
.qest-note{display:flex;gap:6px;font-size:10.5px;line-height:1.5;color:#A9BFCE;background:rgba(255,255,255,.06);border-radius:10px;padding:8px 10px;margin-top:12px}
.qest-note svg{width:13px;height:13px;flex:0 0 13px;color:#9FE3D7;margin-top:1px}
.qest-empty{font-size:12.5px;color:#C6D6E4;padding:8px 0}
.qsend{padding-bottom:8px}
.qsend .field-grid{grid-template-columns:1fr 1fr}
.qsend .field.full{grid-column:1/-1}
.qsend .btn{margin-top:12px}
.qbtn-pair{display:flex;gap:8px;margin-top:9px}
.qbtn-pair .btn{flex:1 1 0;min-width:0;height:42px;font-size:12.5px;padding:0 10px}
.qcard .field[hidden]{display:none}
.success .qsum{min-height:0;margin-top:14px;text-align:left;font-size:11px;line-height:1.55;resize:none;overflow:auto}
.qsum{width:100%;margin-top:10px;min-height:96px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.5;border:1px dashed #C9D6E3;border-radius:12px;background:#FBFCFE;color:#3A4A5F;padding:10px;resize:vertical}

/* ---------------- footer ---------------- */
.site-footer{background:#fff;border-top:1px solid var(--line);padding:26px 0 30px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.site-footer .fgrid{display:grid;gap:18px}
.site-footer .fbrand{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.site-footer .fbrand .brand-mark{width:34px;height:34px;flex:0 0 34px;border-radius:50%}
.site-footer .fbrand strong{font-size:15px;color:var(--navy);letter-spacing:-.01em}
.site-footer .fbrand span.ko{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.site-footer h5{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--navy);margin:0 0 8px}
.site-footer p{line-height:1.6}
.site-footer .fcol{display:flex;flex-direction:column;gap:4px}
.site-footer .fcol a,.site-footer .fcol .site-url{color:var(--ink);font-weight:600}
.site-footer .fcol .site-url{cursor:default;text-decoration:none;border-bottom:1px dashed #C6D3E1;width:max-content}
.site-footer .legal{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;line-height:1.6}
.site-footer .fspec{margin-top:18px}
.site-footer .spec-chips{display:flex;flex-wrap:wrap;gap:6px}
.site-footer .spec-chips span{font-size:11px;font-weight:700;color:#1F6B63;background:#E8F4F1;border:1px solid #CDE6E1;border-radius:999px;padding:4px 10px}

/* ---------------- bottom nav ---------------- */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:35;
  background:rgba(255,255,255,.97);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(5,1fr);gap:1px;
}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 1px;border-radius:12px;color:#8697AB;font-size:10px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.bn-item svg{width:22px;height:22px}
.bn-item.on{color:var(--teal)}
.bn-item.on svg{filter:drop-shadow(0 3px 6px rgba(18,163,148,.25))}
.bn-item .dot{width:4px;height:4px;border-radius:50%;background:var(--teal);opacity:0}
.bn-item.on .dot{opacity:1}

/* ---------------- toast ---------------- */
.toast{
  position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,12px);
  background:var(--navy);color:#fff;font-size:13px;font-weight:600;padding:11px 16px;border-radius:12px;
  box-shadow:0 14px 34px rgba(11,34,57,.3);z-index:80;opacity:0;pointer-events:none;transition:.25s;
  max-width:calc(100% - 32px);text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------------- modal ---------------- */
.modal{position:fixed;inset:0;z-index:70;display:none;background:rgba(8,22,36,.56);backdrop-filter:blur(3px);align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal-card{background:#fff;width:100%;max-width:560px;max-height:93vh;overflow:hidden;display:flex;flex-direction:column;border-radius:24px 24px 0 0;animation:sheetUp .3s cubic-bezier(.2,.8,.2,1);position:relative}
.m-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0}
@keyframes sheetUp{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}
body.modal-open{overflow:hidden}

/* ---------------- desktop ---------------- */
@media (min-width:620px){
  .field-grid{grid-template-columns:repeat(4,1fr)}
  .field.full{grid-column:span 2}
  .grid{grid-template-columns:repeat(2,1fr)}
  .hero h1{font-size:36px}
  .grid.flights{grid-template-columns:1fr}
  .site-footer .fgrid{grid-template-columns:1.4fr 1fr 1fr}
}
@media (min-width:620px){
  .qopt-grid{grid-template-columns:1fr 1fr}
  .qsend .field-grid{grid-template-columns:1fr 1fr}
}
@media (min-width:900px) and (max-width:1140px){
  .top-nav button{padding:8px 9px;font-size:12.5px}
  .brand-text small{display:none}
}
@media (min-width:900px){
  body{padding-bottom:0}
  .top-nav{display:flex}
  .bottom-nav{display:none}
  .header-inner{height:72px}
  .brand-mark{width:42px;height:42px}
  .brand-text strong{font-size:17px}
  .hero-inner{grid-template-columns:1fr;padding:56px 16px 44px;gap:36px;max-width:1120px}
  .hero{background-image:
    radial-gradient(760px 320px at 90% -20%, rgba(56,163,157,.28), transparent 60%),
    linear-gradient(94deg, rgba(5,21,33,.93) 0%, rgba(6,27,39,.72) 34%, rgba(7,34,47,.32) 70%, rgba(9,43,55,.16) 100%),
    url("images/hero-seoul.webp");
    background-size:cover, cover, cover;
    background-position:center, center, 52% 42%;
  }
  .hero-copy{position:relative;z-index:2;max-width:600px}
  .hero h1{font-size:42px}
  .hero p{font-size:16px}
  .grid{grid-template-columns:repeat(3,1fr);gap:20px}
  .grid.flights{grid-template-columns:repeat(2,1fr)}
  .grid.hotels{grid-template-columns:repeat(3,1fr)}
  .grid.bookings{grid-template-columns:repeat(2,1fr)}
  .modal{align-items:center;padding:24px}
  .modal-card{border-radius:22px;max-height:88vh;box-shadow:0 30px 70px rgba(5,16,28,.4)}
  .m-hd .cover{aspect-ratio:16/7}
  .section-head h2{font-size:24px}
  .toast{bottom:34px}
  .view{padding:34px 0 46px}
  .panel{padding:18px}
  .m-meta{grid-template-columns:repeat(4,1fr)}
  .qwrap{grid-template-columns:minmax(0,1fr) 372px;gap:20px;align-items:start}
  .qside{position:sticky;top:calc(var(--header-h) + 18px)}
  .qhero-inner{padding:44px 16px 38px}
  .qhero h1{font-size:34px}
  .qhero p{font-size:15px}
  .qcard{padding:18px}
  .qopt-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:430px){
  .brand-text strong{font-size:15px}
  .brand-text small{font-size:10px}
  .header-inner{gap:8px;padding:0 12px}
  .brand-mark{width:36px;height:36px;flex:0 0 36px}
  .seg button{padding:5px 8px;font-size:11px}
  .seg button .code{display:none}
  .icon-btn{padding:0 9px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>
</head>
<body>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<header class="app-header">
  <div class="header-inner">
    <a class="brand" href="#" id="brandHome" aria-label="Home">
      <span class="brand-mark" id="brandMark"></span>
      <span class="brand-text">
        <strong data-brand="name">Morning Korea</strong>
        <small data-i18n="app.tagline">Korea, planned by locals</small>
      </span>
    </a>
    <nav class="top-nav" id="topNav" aria-label="Main">

","ko":"평창 에코힐링로드 & 광천선굴 당일투어","zh":"平昌生态步道与广川洞窟一日游","ja":"平昌エコトレイル＆広川洞窟日帰りツアー","ru":"Пхёнчхан: эко-тропа и пещера Кванчхон","es":"Pyeongchang: ruta ecológica y cueva de Gwangcheon","vi":"Pyeongchang: đường mòn sinh thái & hang Gwangcheon"},"tour.pc01.desc":{"en":"Walk the highland trails of the 2018 Winter Olympics, then glide by boat through a limestone cave.","ko":"2018 동계올림픽 고원 지대의 에코힐링로드를 걷고, 광천선굴에서 보트를 타고 동굴을 둘러봅니다.","zh":"漫步2018冬奥会高原生态步道，再乘船穿行广川石灰岩洞窟。","ja":"2018冬季五輪の高原エコトレイルを歩き、広川石灰岩洞窟をボートで進みます。","ru":"Прогулка по высокогорным тропам Олимпиады-2018 и поездка на лодке по известняковой пещере.","es":"Recorre los senderos de altura de los Juegos de Invierno 2018 y navega en bote por una cueva de caliza.","vi":"Đi bộ đường mòn vùng cao của Olympic mùa đông 2018 và đi thuyền trong hang đá vôi."},"tour.pc01.hl":{"en":"Olympic highland eco-trail|Gwangcheon cave boat ride|Buckwheat pancake lunch|Small group, max 40","ko":"올림픽 고원 에코힐링로드|광천선굴 보트 체험|메밀전병 정식|최대 40명 소규모","zh":"冬奥高原生态步道|广川洞窟乘船体验|荞麦煎饼午餐|最多40人小团","ja":"五輪高原エコトレイル|広川洞窟ボート体験|そばチヂミ定食|最大40名の少人数","ru":"Эко-тропа олимпийского плато|Лодка в пещере Кванчхон|Обед с гречневыми блинами|Группа до 40 человек","es":"Ruta ecológica olímpica|Bote en la cueva de Gwangcheon|Almuerzo de tortitas de trigo sarraceno|Grupo de máx. 40","vi":"Đường mòn sinh thái Olympic|Đi thuyền hang Gwangcheon|Bữa trưa bánh kiều mạch|Nhóm tối đa 40 khách"},"tour.ad02.title":{"en":"Andong Hahoe Village & Folk Market Day Tour","ko":"안동 하회마을 & 전통시장 당일투어","zh":"安东河回村与传统市场一日游","ja":"安東河回村＆伝統市場日帰りツアー","ru":"Андон: деревня Хахве и народный рынок","es":"Andong: aldea Hahoe y mercado tradicional","vi":"Andong: làng Hahoe & chợ truyền thống"},"tour.ad02.desc":{"en":"A UNESCO-listed hanok village, a mask dance stage and the food stalls of Andong's old market.","ko":"유네스코 하회마을의 한옥 골목과 탈춤 공연, 안동 구시장 먹거리를 하루에 담았습니다.","zh":"一天走遍联合国教科文组织河回韩屋村、假面舞表演与安东老市场小吃。","ja":"世界遺産の河回韓屋村、仮面舞踊、安東の旧市場グルメを一日で。","ru":"Деревня ханок из списка ЮНЕСКО, театр масок и еда на старом otel estilo hanok|Tumbas de Daereungwon de noche","vi":"Bulguksa & Seokguram sớm mai|Cầu ngắm Pohang|Khách sạn hanok|Lăng mộ Daereungwon ban đêm"},"tour.jj04.title":{"en":"Jeonju Hanok Village & Railbike 1N2D","ko":"전주 한옥마을 & 철도자전거 1박2일","zh":"全州韩屋村与铁路自行车 2天1晚","ja":"全州韓屋村＆レールバイク 1泊2日","ru":"Чонджу: деревня ханок и рельсовый велосипед, 2 дня","es":"Jeonju: aldea hanok y railbike, 2 días","vi":"Jeonju: làng hanok & xe đạp đường ray 2 ngày 1 đêm"},"tour.jj04.desc":{"en":"Sleep in a hanok guesthouse, cook bibimbap with a local, and ride a railbike through the rice fields.","ko":"한옥 게스트하우스에서 하룻밤, 비빔밥 만들기 체험, 논길 레일바이크까지 즐깁니다.","zh":"夜宿韩屋民宿、学做拌饭，再骑铁路自行车穿过稻田。","ja":"韓屋ゲストハウス泊、ビビンバ作り体験、田園のレールバイク。","ru":"Ночлег в ханоке, мастер-класс по пибимпапу и рельсовый велосипед среди рисовых полей.","es":"Duerme en un hanok, cocina bibimbap y pasea en railbike entre arrozales.","vi":"Ngủ nhà hanok, nấu bibimbap và đạp xe đường ray giữa cánh đồng lúa."},"tour.jj04.hl":{"en":"Hanok guesthouse stay|Bibimbap cooking class|Railbike through Gimje fields|Hanbok walk in the village","ko":"한옥 게스트하우스 숙박|비빔밥 쿠킹클래스|김제 들녘 레일바이크|한복 체험 산책","zh":"韩屋民宿住宿|拌饭烹饪课|金堤田野铁路自行车|韩服漫步","ja":"韓屋ゲストハウス泊|ビビンバ料理教室|金堤の田園レールバイク|韓服で散策","ru":"Ночлег в ханоке|Кулинарный класс пибимпап|Рельсовый велосипед в Кимдже|Прогулка в ханбоке","es":"Estancia en hanok|Clase de bibimbap|Railbike por Gimje|Paseo con hanbok","vi":"Lưu trú nhà hanok|Lớp nấu bibimbap|Xe đạp đường ray Gimje|Dạo phố áo hanbok"},"tour.bs05.title":{"en":"Busan Sky Capsule & Gamcheon 1N2D","ko":"부산 스카이캡슐 & 감천문화마을 1박2일","zh":"釜山天空胶囊与甘川文化村 2天1晚","ja":"釜山スカイカプセル＆甘川文化村 1泊2日","ru":"Пусан: Sky Capsule и Камчхон, 2 дня","es":"Busan: Sky Capsule y Gamcheon, 2 días","vi":"Busan: Sky Capsule & làng Gamcheon 2 ngày 1 đêm"},"tour.bs05.desc":{"en":"Ride the Sky Capsule above the Haeundae coast, wander Gamcheon's painted hillside and eat at Jagalchi market.","ko":"해운대 해안을 달리는 스카이캡슐, 감천문화마을 골목, 자갈치시장 해산물까지 즐깁니다.","zh":"乘坐海云台海岸的天空胶囊，漫步甘川彩色山丘，品尝札嘎其市场海鲜。","ja":"海雲台の海岸を走るスカイカプセル、甘川の坂道、チャガルチ市場の海鮮。","ru":"Небесная капсула над побережьем Хэундэ, разноцветные склоны Камчхона и рынок Чакальчхи.","es":"Sky Capsule sobre la costa de Haeundae, las colinas de Gamcheon y el mercado de Jagalchi.","vi":"Sky Capsule ven biển Haeundae, đồi màu Gamcheon và chợ hải sản Jagalchi."},"tour.bs05.hl":{"en":"Sky Capsule along Haeundae coast|Gamcheon Culture Village photo walk|Jagalchi seafood dinner|Ocean-view hotel","ko":"해운대 해안 스카이캡슐|감천문화마을 포토워크|자갈치 해산물 저녁|오션뷰 호텔","zh":"海云台海岸天空胶囊|甘川文化村拍照漫步|札嘎其海鲜晚餐|海景酒店","ja":"海雲台スカイカプセル|甘川文化村フォトウォーク|チャガルチ海鮮ディナー|オーシャンビューホテル","ru":"Sky Capsule вдоль Хэундэ|Фотопрогулка по Камчхону|Ужин на Чакальчхи|Отель с видом на море","es":"Sky Capsule por Haeundae|Paseo fotográfico por Gamcheon|Cena en Jagalchi|Hotel con vistas al mar","vi":"Sky Capsule ven biển Haeundae|Chụp ảnh làng Gamcheon|Tối hải sản Jagalchi|Khách sạn view biển"},"tour.ys06.title":{"en":"Yeosu Yacht & Suncheon Bay 2N3D","ko":"여수 요트 & 순천만 2박3일","zh":"丽水游艇与顺天湾 3天2晚","ja":"麗水ヨット＆順天湾 2泊3日","ru":"Йосу: яхта и залив Сунчхон, 3 дня","es":"Yeosu: yate y bahía de Suncheon, 3 días","vi":"Yeosu: du thuyền & vịnh Suncheon 3 ngày 2 đêm"},"tour.ys06.desc":{"en":"Three days on the south coast: a sunset yacht cruise, Suncheon Bay reed fields and the Dolsan cable car.","ko":"남해안 3일, 여수 선셋 요트와 순천만 갈대밭, 돌산 케이블카를 함께 즐깁니다.","zh":"南海岸三日：丽水日落游艇、顺天湾芦苇荡与突山缆车。","ja":"南海岸3日間。麗水サンセットヨット、順天湾の葦原、突山ケーブルカー。","ru":"Три дня на южном побережье: яхта на закате, тростники Сунчхон и канатка Тольсан.","es":"Tres días en la costa sur: yate al atardecer, juncos de Suncheon y teleférico de Dolsan.","vi":"Ba ngày bờ biển phía nam: du thuyền hoàng hôn, lau sậy Suncheon và cáp treo Dolsan."},"tour.ys06.hl":{"en":"Sunset yacht around Yeosu islands|Suncheon Bay reed field|Dolsan cable car ridge|Two nights by the sea","ko":"여수 섬 투어 선셋 요트|순천만 갈대밭|돌산 케이블카|바닷가 2박","zh":"丽水群岛日落游艇|顺天湾芦苇荡|突山缆车|海边连住两晚","ja":"麗水の島めぐりサンセットヨット|順天湾の葦原|突山ケーブルカー|海辺に2泊","ru":"Яхта на закате вокруг островов Йосу|Тростники Сунчхона|Канатка Тольсан|Две ночи у моря","es":"Yate al atardecer por las islas|Juncos de Suncheon|Teleférico de Dolsan|Dos noches junto al mar","vi":"Du thuyền hoàng hôn quanh đảo Yeosu|Lau sậy Suncheon|Cáp treo Dolsan|Hai đêm bên biển"},"tour.je07.title":{"en":"Jeju Hallasan & Olle Trail 2N3D Flight Package","ko":"제주 한라산 & 올레길 2박3일 항공 패키지","zh":"济州汉拿山与偶来小路 3天2晚机票套餐","ja":"済州ハルラサン＆オルレ 2泊3日航空パック","ru":"Чеджу: Халласан и тропа Олле, 3 дня с перелётом","es":"Jeju: Hallasan y Olle, 3 días con vuelo","vi":"Jeju: Hallasan & đường Olle 3 ngày 2 đêm gồm vé bay"},"tour.je07.desc":{"en":"Fly to Jeju for a crater hike, a volcanic coastal walk and sunrise over Seongsan Ilchulbong.","ko":"제주로 떠나 한라산 분화구 트레킹, 화산 해안 올레길, 성산일출봉 일출을 만납니다.","zh":"飞往济州，登汉拿山火山口、走火山海岸偶来小路、看城山日出峰日出。","ja":"済州へ。ハルラサンの火口トレッキング、火山海岸のオルレ、城山日出峰の日の出。","ru":"Перелёт на Чеджу: кратер Халласан, вулканическое побережье Олле и рассвет на Сонсан-Ильчхульбон.","es":"Vuela a Jeju: cráter de Hallasan, costa volcánica de Olle y amanecer en Seongsan Ilchulbong.","vi":"Bay đến Jeju: leo miệng núi lửa Hallasan, đường Olle ven biển và bình minh Seongsan."},"tour.je07.hl":{"en":"Hallasan crater hike with a local guide|Olle trail along the volcanic coast|Seongsan Ilchulbong sunrise|Resort with ocean view","ko":"현지 가이드와 한라산 분화구 트레킹|화산 해안 올레길|성산일출봉 일출|오션뷰 리조트","zh":"当地向导带队登汉拿山|火山海岸偶来小路|城山日出峰日出|海景度假村","ja":"現地ガイドとハルラサン火口トレッキング|火山海岸のオルレ|城山日出峰の日の出|オーシャンビューリゾート","ru":"Треккинг к кратеру Халласан с гидом|Тропа Олле по вулканическому берегу|Рассвет на Сонсан|Курорт с видом на море","es":"Cráter de Hallasan con guía local|Costa volcánica de Olle|Amanecer en Seongsan|Resort con vistas al mar","vi":"Leo núi Hallasan cùng HDV địa phương|Đường Olle ven biển|Bình minh Seongsan|Resort view biển"},"tour.ul08.title":{"en":"Ulleungdo & Dokdo Cruise 2N3D","ko":"울릉도·독도 크루즈 2박3일","zh":"郁陵岛·独岛游船 3天2晚","ja":"鬱陵島・独島クルーズ 2泊3日","ru":"Уллындо и Токто: круиз, 3 дня","es":"Ulleungdo y Dokdo en crucero, 3 días","vi":"Ulleungdo & Dokdo 3 ngày 2 đêm"},"tour.ul08.desc":{"en":"A three-hour ferry to a volcanic island, a Dokdo landing when the sea allows, and quiet coastal trails.","ko":"3시간 여객선으로 떠나는 화산섬, 날씨가 허락하면 독도 상륙, 한적한 해안 산책로를 걷습니다.","zh":"乘三小时渡轮前往火山岛，海况允许时登独岛，漫步宁静海岸步道。","ja":"3時間のフェリーで火山島へ。海況が許せば独島上陸、静かな海岸遊歩道。","ru":"Трёхчасовой паром на вулканический остров, высадка на Токто при хорошей погоде и тихие тропы.","es":"Tres horas de ferri a una isla volcánica, desembarco en Dokdo si el mar lo permite y senderos tranquilos.","vi":"Ba giờ phà đến đảo núi lửa, lên đảo Dokdo nếu biển lặng và những lối ven biển yên bình."},"tour.ul08.hl":{"en":"Three-hour ferry across the East Sea|Dokdo landing (weather permitting)|Elephant Rock coastal trail|Fresh squid dinner","ko":"동해 3시간 여객선|독도 상륙 (기상 허락 시)|코끼리바위 해안 산책로|생오징어 회 저녁","zh":"横渡东海三小时渡轮|登独岛（视天气）|象岩海岸步道|新鲜鱿鱼晚餐","ja":"東海3時間フェリー|独島上陸（天候次第）|象岩の海岸遊歩道|新鮮イカの夕食","ru":"Трёхчасовой паром через Восточное море|Высадка на Токто (по погоде)|Тропа у скалы Слон|Ужин из свежего кальмара","es":"Ferri de tres horas por el mar del Este|Desembarco en Dokdo (según el tiempo)|Senda de Elephant Rock|Cena de calamar fresco","vi":"Phà ba giờ qua Biển Đông|Lên đảo Dokdo (tùy thời tiết)|Đường ven biển Đá Voi|Tối mực tươi"},"hotel.lotte.desc":{"en":"Landmark five-star hotel above Myeongdong with a pool, spa and direct subway access.","ko":"명동 중심의 랜드마크 5성급 호텔. 수영장·스파와 지하철 직결.","zh":"明洞地标五星酒店，设泳池、水疗并直通地铁。","ja":"明洞のランドマーク5つ星。プール・スパ、地下鉄直結。","ru":"Пятизвёздочный отель-достопримечательность над Мёндоном: бассейн, спа, прямой выход к метро.","es":"Hotel cinco estrellas emblemático sobre Myeongdong, con piscina, spa y acceso directo al metro.","vi":"Khách sạn 5 sao biểu tượng trên Myeongdong, có hồ bơi, spa và lối đi thẳng xuống tàu điện."},"hotel.ninetree.desc":{"en":"Smart four-star base a minute from Myeongdong shopping street, breakfast included.","ko":"명동 쇼핑거리 1분, 조식 포함 실속형 4성급.","zh":"距明洞购物街一分钟，含早餐的实用四星酒店。","ja":"明洞ショッピング街まで1分、朝食付きの4つ星。","ru":"Удобный четырёхзвёздочный отель в минуте от торговой улицы Мёндона, с завтраком.",   /* -------------------------------------------------------------- flights */
  function airport(code) {
    for (var i = 0; i < DATA.airports.length; i++) if (DATA.airports[i].code === code) return DATA.airports[i];
    return DATA.airports[0];
  }
  function airportOptions(sel) {
    return DATA.airports.map(function (a) {
      return '<option value="' + a.code + '"' + (a.code === sel ? ' selected' : '') + '>' +
        cityName(a.city) + ' (' + a.code + ')</option>';
    }).join('');
  }
  function distanceKm(a, b) {
    var R = 6371, dLat = (b.lat - a.lat) * Math.PI / 180, dLon = (b.lon - a.lon) * Math.PI / 180;
    var la1 = a.lat * Math.PI / 180, la2 = b.lat * Math.PI / 180;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(la1) * Math.cos(la2) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return Math.round(2 * R * Math.asin(Math.sqrt(h)));
  }
  function hash(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 100000;
    return h;
  }
  function flights() {
    var A = airport(state.f.from), B = airport(state.f.to);
    if (A.code === B.code) return [];
    var dist = distanceKm(A, B);
    var seed = hash(A.code + B.code);
    var pool = DATA.airlines.filter(function (al) {
      return al.regions.indexOf('*') >= 0 || al.regions.indexOf(A.region) >= 0 || al.regions.indexOf(B.region) >= 0;
    });
    if (!pool.length) pool = DATA.airlines.slice(0, 4);
    var cabin = { economy: 1, premium: 1.65, business: 2.9, first: 4.3 }[state.f.cabin] || 1;
    var n = dist > 3000 ? 6 : 5;
    var out = [];
    var baseMin = 45 + Math.round(dist / 800 * 60);
    for (var i = 0; i < n; i++) {
      var al = pool[(seed + i * 3) % pool.length];
      var stops = dist > 3500 && i % 3 === 1 ? 1 : 0;
      var mins = baseMin + (stops ? 105 : 0) + ((seed + i * 7) % 15);
      var dep = 420 + ((seed / 7 + i * 143) % 900);
      dep = Math.round(dep / 5) * 5;
      var price = (45000 + dist * 95) * al.factor * cabin * (stops ? 0.9 : 1);
      if (state.f.trip === 'round') price = price * 1.86;
      price = Math.round(price / 1000) * 1000;
      out.push({
        key: A.code + B.code + i,
        airline: al.name,
        code: al.code,
        no: al.code + ' ' + (100 + ((seed + i * 37) % 880)),
        from: A.code, to: B.code,
        dep: dep, arr: dep + mins, mins: mins, stops: stops,
        price: price, seats: 3 + ((seed + i * 11) % 6)
      });
    }
    out.sort(function (a, b) {
      if (state.f.sort === 'cheapest') return a.price - b.price;
      if (state.f.sort === 'fastest') return a.mins - b.mins;
      return (a.price * 0.7 + a.mins * 900) - (b.price * 0.7 + b.mins * 900);
    });
    return out;
  }

  function flightCard(f) {
    return '<article class="flight">' +
      '<div class="flight-top"><span class="airline-logo">' + f.code + '</span>' +
      '<div><div class="airline">' + esc(f.airline) + '</div><div class="fno">' + f.no + ' · ' + t('flights.' + state.f.cabin) + '</div></div>' +
      (state.f.trip === 'round' ? '<span class="tag">' + t('flights.round') + '</span>' : '') +
      '</div>' +
      '<div class="route">' +

  /* --------------------------------------------------------------- hotels */

    });
  }

    var stars = '';
    for (var i = 0; i < h.stars; i++) stars += ic.star;
    var am = h.am.slice(0, 4).map(function (a) {
      return '<span class="amenity">' + ic[a] + t('am.' + a) + '</span>';
    }).join('');
    var rooms = h.rooms.length;
    return '<article class="hotel">' +
      '<div class="hotel-cover">' + (photo('hotel:' + h.id) || scene(h.theme)) + '<div class="stars">' + stars + '</div></div>' +

      '</div></div></article>';
  }

    var list = hotelsFor();
    var cityOpts = ['city.seoul', 'city.busan', 'city.jeju', 'city.gyeongju'].map(function (c) {
      return '<option value="' + c.replace('city.', '') + '"' + (state.h.city === c.replace('city.', '') ? ' selected' : '') + '>' + t(c) + '</option>';
    }).join('');
    var starChips = [{ v: 0, l: t('hotels.anyStars') }, { v: 3, l: '3★+' }, { v: 4, l: '4★+' }, { v: 5, l: '5★' }].map(function (s) {
      return '<button type="button" class="chip' + (state.h.stars === s.v ? ' on' : '') + '" data-act="hotel-stars" data-stars="' + s.v + '">' + s.l + '</button>';
    }).join('');
    var n = diffDays(state.h.cin, state.h.cout);

      '<div class="section-head"><div><h2>' + t('hotels.title') + '</h2><p>' + t('hotels.subtitle') + '</p></div></div>' +

      '<div class="chip-row" style="padding:8px 0 0">' + starChips + '</div></div>' +
      '<div class="demo-strip">' + ic.info + '<span>' + t('hotels.demoBadge') + '</span></div>' +
      '</form>' +
      '<div class="results-head"><div><h3>' + t('hotels.results', { count: list.length, city: cityName('city.' + state.h.city) }) + '</h3>' +
      '<div class="sub">' + fmtDate(state.h.cin) + ' – ' + fmtDate(state.h.cout) + ' · ' + nights(n) + ' · ' + guestsN(state.h.guests) + '</div></div>' +

      '</div>';
  }

  function findHotel(id) {
    for (var i = 0; i < DATA.hotels.length; i++) if (DATA.hotels[i].id === id) return DATA.hotels[i];
    return null;
  }
  function roomPrice(h, room) { return Math.round(h.price * room.mult / 1000) * 1000; }

  function hotelRoomsModal(id) {
    var h = findHotel(id);

    var n = diffDays(state.h.cin, state.h.cout);

      var p = roomPrice(h, r);

        '<div class="rd">' + t('room.' + r.key + '.d') + '</div></div>' +
        '<div class="rp"><b>' + money(p) + '</b><small>' + t('hotels.perNight') + '</small></div>' +

    openModal(

    var n = diffDays(state.h.cin, state.h.cout);
    var total = roomPrice(h, room) * n * state.h.rooms;
    openModal(
      '<div class="m-body">' +
      '<button type="button" class="m-close" data-act="close-modal" aria-label="' + t('common.close') + '" style="position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:#EEF3F8;display:grid;place-items:center">' + ic.close + '</button>' +

      '<div class="field"><label for="gEmail">' + t('form.email') + '</label><input id="gEmail" name="email" type="email" autocomplete="email" placeholder="you@email.com" required></div>' +
      '<div class="field"><label for="gPhone">' + t('form.phone') + '</label><input id="gPhone" name="phone" type="tel" autocomplete="tel" placeholder="+82 10 0000 0000" required></div>' +

      '<p class="form-note">' + t('form.demoNote') + '</p>' +
      '</form></div>');
  }

  /* ------------------------------------------------------------- bookings */
  function bookingCard(b) {
    var typeLabel = t('bookings.type.' + b.type);
    var meta = '';
    var title = '';
    var icon = b.type === 'flight' ? ic.plane : b.type === 'hotel' ? ic.bed : b.type === 'quote' ? ic.ticket : ic.compass;
    if (b.type === 'tour') {
      title = t('tour.' + b.tourId + '.title');
      meta = '<span>' + ic.cal + fmtDate(b.date, true) + '</span><span>' + ic.users + t('bookings.paxN', { n: b.pax }) + '</span><span>' + ic.pin + t('pickup.' + b.pickup) + '</span>';
    } else if (b.type === 'flight') {
      title = b.from + ' → ' + b.to;
      meta = '<span>' + ic.cal + fmtDate(b.date, true) + '</span><span>' + ic.plane + esc(b.airline) + ' ' + b.no + '</span><span>' + ic.users + t('bookings.paxN', { n: b.pax }) + ' · ' + t('flights.' + b.cabin) + '</span>';
    } else if (b.type === 'quote') {
      title = t('quote.bookingTitle') + (b.agency ? ' · ' + esc(b.agency) : '');
      meta = '<span>' + ic.cal + fmtDate(b.start) + ' – ' + fmtDate(b.end) + '</span>' +
        '<span>' + ic.users + t('bookings.paxN', { n: b.pax }) + '</span>' +
        '<span>' + ic.pin + esc(qRegionsOf(b).join(', ')) + '</span>' +
        (b.vehicle ? '<span>' + ic.bus + t('quote.veh.' + b.vehicle) + '</span>' : '') +
        (b.hotel && b.hotel !== 'none' ? '<span>' + ic.bed + t('quote.hotel.' + b.hotel) + '</span>' : '');
    } else {
      var h = findHotel(b.hotelId);
      title = h ? h.name : b.hotelId;
      meta = '<span>' + ic.cal + fmtDate(b.cin) + ' – ' + fmtDate(b.cout) + '</span><span>' + ic.bed + t('room.' + RoomKey(b)) + '</span><span>' + ic.users + guestsN(b.guests) + ' · ' + roomsN(b.rooms) + '</span>';
    }
    return '<article class="booking">' +
      '<div class="booking-top"><span class="type-badge ' + b.type + '">' + icon + typeLabel + '</span>' +
      '<span class="status ' + (b.status === 'cancelled' ? 'cancelled' : '') + '">' + t('bookings.status.' + b.status) + '</span></div>' +

    ],
    mice: 1600000,
    galaPerPax: 95000,
    meet: 180000,
    regionDay: 130000
  };
  var QUOTE_REGIONS = ['seoul', 'gg', 'gw', 'gj', 'bs', 'jeju', 'custom'];

  function qVehicle(k) {
    for (var i = 0; i < QUOTE.vehicles.length; i++) if (QUOTE.vehicles[i].key === k) return QUOTE.vehicles[i];
    return QUOTE.vehicles[0];
  }
  function qHotel(k) {
    for (var i = 0; i < QUOTE.hotels.length; i++) if (QUOTE.hotels[i].key === k) return QUOTE.hotels[i];
    return null;
  }
  function qLangLabel(code) {
    for (var i = 0; i < LANGS.length; i++) if (LANGS[i].code === code) return LANGS[i].label;
    return LANGS[0].label;
  }
  function qPax() {
    var n = parseInt(state.q.pax, 10);
    if (isNaN(n) || n < 1) n = 1;
    return Math.min(n, 500);
  }
  function qSpan() {
    var q = state.q;
    var a = new Date((q.start || '') + 'T00:00:00'), b = new Date((q.end || '') + 'T00:00:00');
    var d = Math.round((b - a) / 86400000);
    if (!isFinite(d) || d < 0) d = 0;
    if (!q.start) return { days: 1, nights: 0 };
    return { days: d + 1, nights: d };
  }
  function qRegionsOf(rec) {
    return (rec.regions || []).map(function (r) {
      if (r === 'custom') return rec.custom || t('quote.region.custom');
      return t('quote.region.' + r);
    });
  }
  function qCalc() {
    var q = state.q, span = qSpan(), days = span.days, nights = span.nights;
    var pax = qPax(), lines = [], total = 0, vehCount = 0;
    if (q.svc.vehicle) {
      var v = qVehicle(q.veh);
      vehCount = Math.max(1, Math.ceil(pax / v.seats));
      var amt = v.day * vehCount * days;
      lines.push({ label: t('quote.line.vehicle', { name: t('quote.veh.' + v.key), v: vehCount, n: days }), amount: amt });
      total += amt;
    }
    if (q.svc.guide) {
      var gAmt = QUOTE.guideDay * days;
      lines.push({ label: t('quote.line.guide', { name: qLangLabel(q.glang), n: days }), amount: gAmt });
      total += gAmt;
    }
    var hotel = q.svc.hotel ? qHotel(q.hotel) : null;
    if (hotel && nights > 0) {
      var rooms = Math.ceil(pax / 2);
      var hAmt = hotel.room * rooms * nights;
      lines.push({ label: t('quote.line.hotel', { name: t('quote.hotel.' + hotel.key), r: rooms, m: nights }), amount: hAmt });
      total += hAmt;
    }
    var extra = Math.max(0, (q.regions || []).length - 1);
    if (extra > 0) {
      var rAmt = QUOTE.regionDay * extra * days;
      lines.push({ label: t('quote.line.region', { n: q.regions.length }), amount: rAmt });
      total += rAmt;
    }
    if (q.mice) { lines.push({ label: t('quote.line.mice'), amount: QUOTE.mice }); total += QUOTE.mice; }
    if (q.gala) {
      var galaAmt = QUOTE.galaPerPax * pax;
      lines.push({ label: t('quote.line.gala', { n: pax }), amount: galaAmt });
      total += galaAmt;
    }
    if (q.meet) { lines.push({ label: t('quote.line.meet'), amount: QUOTE.meet }); total += QUOTE.meet; }
    return {
      lines: lines, total: total, days: days, nights: nights, pax: pax, vehicles: vehCount,
      perPax: Math.round(total / pax)
    };
  }

  function qSummary(ref) {
    var q = state.q, c = qCalc(), out = [];
    out.push('MEMBERS Tour — ' + t('quote.bookingTitle'));
    if (ref) out.push(t('success.ref') + ': ' + ref);
    out.push(t('quote.sum.dates') + ': ' + (q.start || '-') + ' → ' + (q.end || '-') +
      ' (' + t('quote.days', { n: c.days }) + ' / ' + t('quote.nights', { n: c.nights }) + ')');
    out.push(t('quote.sum.pax') + ': ' + c.pax + ' ' + t('quote.paxUnit'));
    out.push(t('quote.sum.regions') + ': ' + qRegionsOf(q).join(', '));
    out.push(t('quote.sum.scope') + ':');
    if (!c.lines.length) out.push('  - ' + t('quote.est.empty'));
    c.lines.forEach(function (l) { out.push('  - ' + l.label + ' — ' + money(l.amount)); });
    out.push(t('quote.sum.total') + ': ' + money(c.total) + ' (' + t('quote.est.perPax', { v: money(c.perPax) }) + ')');
    var contact = [q.agency, q.name, q.email, q.phone].filter(function (x) { return x && String(x).trim(); }).join(' / ');
    if (contact) out.push(t('quote.sum.contact') + ': ' + contact);
    if (q.notes) out.push(q.notes);
    out.push('');
    out.push(t('quote.est.note'));
    return out.join('\n');
  }

  function copyQuote(ref) {
    var text = qSummary(ref);
    var reveal = function () {
      var ta = $('#qSum');
      if (ta) { ta.hidden = false; ta.value = text; ta.focus(); ta.select(); }
    };
    var ok = function () { toast(t('quote.copied')); };
    var bad = function () { reveal(); toast(t('quote.copyFail')); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, bad);
      return;
    }
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute('readonly', 'readonly');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      var done = document.execCommand('copy');
      document.body.removeChild(ta);
      if (done) ok(); else bad();
    } catch (e2) { bad(); }
  }

    var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = '';

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) {
      if (!e.target.closest || !e.target.closest('#langSheet, #langBtn')) {
        $('#langSheet').classList.remove('open');
        $('#langBtn').setAttribute('aria-expanded', 'false');
      }
      return;
    }
    var act = el.getAttribute('data-act');
    if (act === 'tab') { closeModal(); setTab(el.getAttribute('data-tab')); }
    else if (act === 'cur') { state.cur = el.getAttribute('data-cur'); save(); renderAll(); }
    else if (act === 'lang') {
      state.lang = el.getAttribute('data-lang'); save();
      $('#langSheet').classList.remove('open');
      $('#langBtn').setAttribute('aria-expanded', 'false');
      renderAll();
    }
    else if (act === 'cat') { state.cat = el.getAttribute('data-cat'); $('#view-tours').innerHTML = viewTours(); }
    else if (act === 'scroll-tours') {
      var el2 = $('#tourList'); if (el2) el2.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    else if (act === 'tour') { tourModal(el.getAttribute('data-id')); }
    else if (act === 'book-tour') { tourBookingModal(el.getAttribute('data-id')); }
    else if (act === 'close-modal') { closeModal(); }
    else if (act === 'goto-bookings') { closeModal(); setTab('bookings'); }
    else if (act === 'trip') { state.f.trip = el.getAttribute('data-trip'); $('#view-flights').innerHTML = viewFlights(); }
    else if (act === 'swap') {
      var a = state.f.from; state.f.from = state.f.to; state.f.to = a;
      $('#view-flights').innerHTML = viewFlights();
    }
    else if (act === 'flight-sort') { state.f.sort = el.getAttribute('data-sort'); $('#view-flights').innerHTML = viewFlights(); }
    else if (act === 'flight-select') { flightModal(el.getAttribute('data-key')); }
    else if (act === 'hotel-stars') { state.h.stars = parseInt(el.getAttribute('data-stars'), 10); $('#view-hotels').innerHTML = viewHotels(); }
    else if (act === 'hotel-rooms') { hotelRoomsModal(el.getAttribute('data-id')); }
    else if (act === 'hotel-select') { hotelBookingModal(el.getAttribute('data-id'), el.getAttribute('data-room')); }
    else if (act === 'q-start') {
      var wrap = $('#qWrap');
      if (wrap) wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    else if (act === 'q-svc') {
      var svc = el.getAttribute('data-svc');
      state.q.svc[svc] = !state.q.svc[svc];
      var row = el.closest('.qsvc-row');
      if (row) {
        row.classList.toggle('on', state.q.svc[svc]);
        var body = row.querySelector('.qsvc-body');
        if (body) body.hidden = !state.q.svc[svc];
        var st = row.querySelector('.qsvc-state');
        if (st) st.textContent = t(state.q.svc[svc] ? 'quote.included' : 'quote.notIncluded');
      }
      el.setAttribute('aria-pressed', state.q.svc[svc] ? 'true' : 'false');
      renderQuoteEstimate();
    }
    else if (act === 'q-veh') {
      state.q.veh = el.getAttribute('data-v');
      $$('#view-quote [data-act="q-veh"]').forEach(function (b) {
        b.classList.toggle('on', b.getAttribute('data-v') === state.q.veh);
      });
      renderQuoteEstimate();
    }
    else if (act === 'q-glang') {
      state.q.glang = el.getAttribute('data-lang');
      $$('#view-quote [data-act="q-glang"]').forEach(function (b) {
        b.classList.toggle('on', b.getAttribute('data-lang') === state.q.glang);
      });
      renderQuoteEstimate();
    }
    else if (act === 'q-hotel') {
      state.q.hotel = el.getAttribute('data-v');
      $$('#view-quote [data-act="q-hotel"]').forEach(function (b) {
        b.classList.toggle('on', b.getAttribute('data-v') === state.q.hotel);
      });
      renderQuoteEstimate();
    }
    else if (act === 'q-opt') {
      var opt = el.getAttribute('data-opt');
      state.q[opt] = !state.q[opt];
      el.classList.toggle('on', !!state.q[opt]);
      el.setAttribute('aria-pressed', state.q[opt] ? 'true' : 'false');
      renderQuoteEstimate();
    }
    else if (act === 'q-region') {
      var rg = el.getAttribute('data-r');
      var idx = state.q.regions.indexOf(rg);
      if (idx >= 0) {
        if (state.q.regions.length === 1) { toast(t('quote.regions.hint')); return; }
        state.q.regions.splice(idx, 1);
      } else {
        state.q.regions.push(rg);
      }
      el.classList.toggle('on', state.q.regions.indexOf(rg) >= 0);
      if (rg === 'custom') {
        var cw = $('#qCustomWrap');
        if (cw) cw.hidden = state.q.regions.indexOf('custom') < 0;
      }
      renderQuoteEstimate();
    }
    else if (act === 'q-copy') { copyQuote(el.getAttribute('data-ref')); }
    else if (act === 'cancel-booking') {
      var id = el.getAttribute('data-id');
      openModal('<div class="m-body" style="padding:26px 20px 24px;text-align:center">' +
        '<div class="m-title" style="font-size:18px">' + t('bookings.cancelTitle') + '</div>' +
        '<p style="font-size:13px;color:var(--muted);margin-top:8px">' + t('bookings.cancelSub') + '</p>' +
        '<div class="success-actions"><button type="button" class="btn btn-light" data-act="close-modal">' + t('bookings.keep') + '</button>' +
        '<button type="button" class="btn btn-primary" style="background:#B4413A;box-shadow:none" data-act="cancel-yes" data-id="' + id + '">' + t('bookings.cancelConfirm') + '</button></div></div>');
    }
    else if (act === 'cancel-yes') {
      var bid = el.getAttribute('data-id');
      state.bookings.forEach(function (b) { if (b.id === bid) b.status = 'cancelled'; });
      save(); closeModal(); renderView('bookings'); toast(t('toast.cancelled'));
    }
    else if (act === 'lang-toggle') {
      var open = $('#langSheet').classList.toggle('open');
      $('#langBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
    }
  });

  $('#langBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    var open = $('#langSheet').classList.toggle('open');
    this.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  document.addEventListener('input', function (e) {
    var el = e.target;
    var qf = el.getAttribute && el.getAttribute('data-q-field');
    if (!qf) return;
    state.q[qf] = el.value;
    if (qf === 'pax' || qf === 'start' || qf === 'end' || qf === 'custom') renderQuoteEstimate();
  });

  document.addEventListener('change', function (e) {
    var el = e.target;
    var f = el.getAttribute && el.getAttribute('data-field');
    if (!f) return;
    var form = el.closest('[data-form]');
    if (!form) return;
    var kind = form.getAttribute('data-form');
    if (kind === 'flight-search') {
      state.f[f] = (f === 'pax') ? parseInt(el.value, 10) : el.value;
      if (f === 'depart' && state.f.ret < state.f.depart) {
        state.f.ret = state.f.depart;
        $('#fRet').value = state.f.ret;
      }
    }
    if (kind === 'hotel-search') {
      state.h[f] = (f === 'guests' || f === 'rooms') ? parseInt(el.value, 10) : el.value;
      if (f === 'cin' && state.h.cout <= state.h.cin) {
        state.h.cout = iso(addDays(new Date(state.h.cin + 'T00:00:00'), 2));
        $('#hOut').value = state.h.cout;
      }
    }
  });

  document.addEventListener('submit', function (e) {
    var form = e.target.closest ? e.target.closest('form[data-form]') : null;
    if (!form) return;
    e.preventDefault();
    var kind = form.getAttribute('data-form');
    if (kind === 'flight-search') { $('#view-flights').innerHTML = viewFlights(); return; }
    if (kind === 'hotel-search') { $('#view-hotels').innerHTML = viewHotels(); return; }
    var data = {};
    Array.prototype.forEach.call(form.elements, function (el) {
      if (el.name) data[el.name] = el.value.trim();
    });
    var err = $('#formErr');
    var problems = [];
    if (kind === 'quote' && (!data.agency || data.agency.length < 2)) problems.push(t('quote.errAgency'));
    if (!data.name || data.name.length < 2) problems.push(t('form.errName'));
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(data.email || '')) problems.push(t('form.errEmail'));
    if (!data.phone || data.phone.replace(/[^0-9]/g, '').length < 5) problems.push(t('form.errPhone'));
    if (problems.length) {
      if (err) { err.style.display = 'block'; err.textContent = problems.join(' '); }
      return;
    }
    if (kind === 'tour') {
      var tour = null;
      DATA.tours.forEach(function (x) { if (x.id === form.getAttribute('data-id')) tour = x; });
      var pax = parseInt(form.querySelector('[name=pax]').value, 10);
      var b = {
        type: 'tour', tourId: tour.id, date: data.date, pax: pax,
        pickup: data.pickup, total: tour.price * pax, ref: newRef('TR'),
        name: data.name, email: data.email, phone: data.phone, notes: data.notes
      };
      addBooking(b);
      successView(t('success.tour.title'), t('success.tour.sub'), b.ref);
      toast(t('toast.tour'));
    }
    if (kind === 'flight') {
      var fl = findFlight(form.getAttribute('data-key'));
      var total = fl.price * state.f.pax;
      var fb = {
        type: 'flight', from: fl.from, to: fl.to, airline: fl.airline, no: fl.no,
        date: state.f.depart, ret: state.f.trip === 'round' ? state.f.ret : '',
        pax: state.f.pax, cabin: state.f.cabin, total: total, ref: newRef('FL'),
        name: data.name, email: data.email, phone: data.phone
      };
      addBooking(fb);
      successView(t('success.flight.title'), t('success.flight.sub'), fb.ref);
      toast(t('toast.flight', { ref: fb.ref }));
    }
    if (kind === 'hotel') {
      var h = findHotel(form.getAttribute('data-id'));
      var rk = form.getAttribute('data-room');
      var room = null; h.rooms.forEach(function (r) { if (r.key === rk) room = r; });
      var n = diffDays(state.h.cin, state.h.cout);
      var hb = {
        type: 'hotel', hotelId: h.id, roomKey: rk, cin: state.h.cin, cout: state.h.cout,
        nights: n, rooms: state.h.rooms, guests: state.h.guests,
        total: roomPrice(h, room) * n * state.h.rooms, ref: newRef('HT'),
        name: data.name, email: data.email, phone: data.phone
      };
      addBooking(hb);
      successView(t('success.hotel.title'), t('success.hotel.sub'), hb.ref);
      toast(t('toast.hotel', { ref: hb.ref }));
    }
    if (kind === 'quote') {
      var qc = qCalc();
      var qb = {
        type: 'quote', status: 'requested', ref: newRef('QT'),
        start: state.q.start, end: state.q.end, days: qc.days, nights: qc.nights, pax: qc.pax,
        regions: state.q.regions.slice(), custom: state.q.custom,
        vehicle: state.q.svc.vehicle ? state.q.veh : '',
        guide: state.q.svc.guide ? state.q.glang : '',
        hotel: state.q.svc.hotel ? state.q.hotel : '',
        mice: !!state.q.mice, gala: !!state.q.gala, meet: !!state.q.meet,
        total: qc.total, agency: data.agency, name: data.name, email: data.email,
        phone: data.phone, notes: data.notes
      };
      addBooking(qb);
      quoteSuccessModal(qb);
      toast(t('quote.toast'));
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeModal(); $('#langSheet').classList.remove('open'); }
  });
  $('#modal').addEventListener('click', function (e) {
    if (e.target === this) closeModal();
  });

  /* ----------------------------------------------------------------- boot */
  function boot() {
    load();
    if (!state._savedLang) state.lang = detectLang();
    var today = new Date();
    state.f.depart = iso(addDays(today, 14));
    state.f.ret = iso(addDays(today, 18));
    state.h.cin = iso(addDays(today, 14));
    state.h.cout = iso(addDays(today, 16));
    state.q.start = iso(addDays(today, 30));
    state.q.end = iso(addDays(today, 33));
    renderLangSheet();
    renderAll();
    setTab(state.tab);
    // expose a tiny hook for automated smoke tests
    window.__MK = {
      state: state,
      setLang: function (l) { state.lang = l; renderAll(); },
      setTab: function (tb) { setTab(tb); },
      tours: function () { return DATA.tours.length; },
      quoteSummary: function () { return qSummary(); },
      quoteTotal: function () { return qCalc().total; },
      quoteLines: function () { return qCalc().lines.length; }
    };
  }
  boot();
})();

</script>
</body>
</html>
